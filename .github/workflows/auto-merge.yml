name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [develop, master]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: enable-auto-merge
    runs-on: ubuntu-latest
    steps:
      - name: Habilitar auto-merge (squash) del PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"

# Este workflow solo ARMA el auto-merge de GitHub sobre el PR — no mergea nada
# por sí mismo. GitHub completa el merge cuando los status checks requeridos
# por la branch protection (job "docs-legacy-guard", y "laravel-tests" cuando
# exista código) quedan en verde. Con un solo desarrollador, el gate es
# exclusivamente CI en verde: no se exige aprobación humana (ver
# docs/decisiones/0006-gitflow-simplificado.md).

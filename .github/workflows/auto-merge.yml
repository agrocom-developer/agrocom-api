name: Auto-merge

# No usa el "Enable auto-merge" nativo de GitHub: esa característica requiere
# repositorio público en el plan Free (github.com/es/pull-requests/how-tos/
# merge-and-close-pull-requests/automatically-merging-a-pull-request), y este
# repo es privado. En su lugar, este workflow espera a que los checks
# requeridos terminen y mergea directamente por `gh pr merge` — mismo
# resultado, sin depender del plan de la organización.

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop, master]

permissions:
  pull-requests: write
  contents: write
  checks: read

jobs:
  merge-when-green:
    name: merge-when-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Esperar checks requeridos y mergear si todos pasan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -o pipefail
          # Solo estos dos — nunca "todos los checks del PR", porque este
          # mismo job también es un check y esperarse a sí mismo colgaría
          # el workflow para siempre.
          REQUIRED=("docs-legacy-guard" "laravel-tests")

          for i in $(seq 1 40); do
            if ! JSON=$(gh pr checks "$PR_URL" --json name,state 2>&1); then
              echo "gh pr checks falló (intento $i), reintentando en 15s:"
              echo "$JSON"
              sleep 15
              continue
            fi

            echo "--- intento $i ---"
            echo "$JSON" | jq -c '.[] | {name, state}'

            ALL_DONE=true
            ANY_FAILED=false

            for name in "${REQUIRED[@]}"; do
              STATE=$(echo "$JSON" | jq -r --arg n "$name" \
                '[.[] | select(.name == $n)] | .[0].state // "PENDING"')
              case "$STATE" in
                SUCCESS|SKIPPED) ;;
                FAILURE|ERROR|CANCELLED) ANY_FAILED=true ;;
                *) ALL_DONE=false ;;
              esac
            done

            if [ "$ANY_FAILED" = true ]; then
              echo "Un check requerido falló — no se mergea."
              exit 1
            fi
            if [ "$ALL_DONE" = true ]; then
              echo "Checks requeridos en verde — mergeando."
              gh pr merge --squash "$PR_URL"
              exit 0
            fi

            sleep 15
          done

          echo "Tiempo de espera agotado (10 minutos) sin que los checks requeridos terminaran."
          exit 1

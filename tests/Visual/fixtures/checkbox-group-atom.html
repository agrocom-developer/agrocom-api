<!DOCTYPE html>
<!--
    Arnés estático del átomo `checkbox-group` (tarea 76 / HU-53, etapa 3),
    para probar resources/js/atoms/checkbox-group.js con un navegador real
    sin pasar por Docker, login ni una ruta del panel — el script es JS puro
    sin imports (mismo criterio que atoms/select.js), así que corre directo
    con un <script> clásico sobre este HTML suelto.

    El marcado de abajo es un espejo A MANO del contrato de DOM que arma
    resources/views/components/atoms/checkbox-group.blade.php antes de que
    el JS corra (clases + `data-*` que checkbox-group.js lee): no es el
    output real de Blade. Si el contrato del átomo cambia, este archivo hay
    que actualizarlo a mano — ver tests/Visual/checkbox-group-atom.spec.ts,
    que es quien de verdad ejerce el filtro de búsqueda.
-->
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>checkbox-group — arnés de búsqueda</title>
</head>
<body>

    <!-- Grupo A: 3 opciones (NO buscable) — sin caja de búsqueda en el marcado. -->
    <fieldset class="ag-checkbox-group" data-testid="grupo-corto" data-ag-checkbox-group
              data-label-search="Buscar…" data-label-no-results="Sin resultados">
        <legend class="ag-checkbox-group__legend">Herramientas</legend>
        <p class="ag-checkbox-group__empty" data-ag-checkbox-group-empty hidden>Sin resultados</p>
        <ul class="ag-checkbox-group__options" id="corto-list" data-ag-checkbox-group-list>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="corto-opt-0">
                    <input type="checkbox" name="herramientas[]" id="corto-opt-0" value="pala" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Pala</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="corto-opt-1">
                    <input type="checkbox" name="herramientas[]" id="corto-opt-1" value="rastrillo" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Rastrillo</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="corto-opt-2">
                    <input type="checkbox" name="herramientas[]" id="corto-opt-2" value="pico" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Pico</span>
                </label>
            </li>
        </ul>
    </fieldset>

    <!-- Grupo B: 9 opciones (buscable) — cubre el filtro dentro del grupo. -->
    <fieldset class="ag-checkbox-group" data-testid="grupo-largo" data-ag-checkbox-group
              data-label-search="Buscar…" data-label-no-results="Sin resultados">
        <legend class="ag-checkbox-group__legend">Repuestos</legend>
        <div class="ag-checkbox-group__search" data-ag-checkbox-group-search-wrap hidden>
            <span class="material-symbols-rounded ag-icon ag-icon--sm" aria-hidden="true">search</span>
            <input type="search" class="ag-checkbox-group__search-input" data-ag-checkbox-group-search
                   placeholder="Buscar…" aria-label="Buscar…" aria-controls="largo-list">
        </div>
        <p class="ag-checkbox-group__empty" data-ag-checkbox-group-empty hidden>Sin resultados</p>
        <ul class="ag-checkbox-group__options" id="largo-list" data-ag-checkbox-group-list>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-0">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-0" value="boquilla" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Boquilla</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-1">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-1" value="filtro" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Filtro</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-2">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-2" value="bateria" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Batería</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-3">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-3" value="helice" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Hélice</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-4">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-4" value="motor" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Motor</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-5">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-5" value="sensor" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Sensor</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-6">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-6" value="bomba" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Bomba</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-7">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-7" value="cableado" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Cableado</span>
                </label>
            </li>
            <li class="ag-checkbox-group__item" data-ag-checkbox-group-item>
                <label class="ag-checkbox-group__option" for="largo-opt-8">
                    <input type="checkbox" name="repuestos[]" id="largo-opt-8" value="bateria-respaldo" class="ag-checkbox-group__input">
                    <span class="ag-checkbox-group__box" aria-hidden="true"></span>
                    <span class="ag-checkbox-group__option-label">Batería de respaldo</span>
                </label>
            </li>
        </ul>
    </fieldset>

    <!-- Sin type="module": Chromium bloquea el fetch de módulos ES sobre
         file:// (solo soporta orígenes http/https para ese fetch interno).
         checkbox-group.js no usa import/export, así que corre igual como
         script clásico — es justamente la ventaja de no tener dependencias. -->
    <script src="../../../resources/js/atoms/checkbox-group.js"></script>
</body>
</html>

openapi: 3.0.0
info:
  title: 'Agrocom API'
  description: 'API del Sistema de Gestión de Operaciones de Fumigación de Agrocom SRL. Sirve a las apps de campo (`agrocom-field`) y al portal del cliente; el spec generado desde el código es el contrato de la API (ADR 0014). Dinero y hectáreas viajan como string decimal, nunca como número de punto flotante.'
  version: 0.1.0
servers:
  -
    url: /
    description: 'Servidor actual — la URL base la define el entorno (local, staging, producción).'
paths:
  /api/ofertas:
    get:
      tags:
        - Ofertas
      summary: 'Mis ofertas'
      description: 'Las ofertas del proveedor de la cuenta. `vista=vivas` (por defecto) deja las que esperan respuesta, con su cuenta regresiva; `vista=historial`, las ya resueltas. `desde` (ISO 8601) devuelve solo lo que cambió después: es la consulta periódica (polling) con que la app se entera de una oferta nueva, junto con `GET /api/notificaciones`. El servicio muestra el terreno aproximado, las hectáreas, el pago estimado y la distancia; nunca datos del cliente.'
      operationId: listarOfertas
      parameters:
        -
          name: vista
          in: query
          required: false
          schema:
            type: string
            enum:
              - vivas
              - historial
        -
          name: desde
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        200:
          description: Ofertas.
          content:
            application/json:
              schema:
                required:
                  - ofertas
                properties:
                  ofertas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no recibe ofertas.'
        404:
          description: 'La cuenta no pertenece a ningún proveedor.'
      security:
        -
          tokenDispositivo: []
  '/api/ofertas/{id}':
    get:
      tags:
        - Ofertas
      summary: 'Detalle de una oferta'
      description: 'Una oferta del proveedor de la cuenta. Una oferta de otro proveedor responde 404.'
      operationId: verOferta
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'La oferta.'
          content:
            application/json:
              schema:
                required:
                  - oferta
                properties:
                  oferta:
                    $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no recibe ofertas.'
        404:
          description: 'No existe o es de otro proveedor.'
      security:
        -
          tokenDispositivo: []
  '/api/ofertas/{id}/aceptar':
    post:
      tags:
        - Ofertas
      summary: 'Aceptar una oferta'
      description: 'Acepta una oferta viva. Requiere red. Es atómico sobre la solicitud: si otro proveedor la aceptó antes, la oferta venció o se retiró, responde 409 y no cambia nada. Con `equipo_id` asigna ese equipo; sin él, el primer equipo apto y libre en la ventana. Aceptar dos veces la misma oferta devuelve la misma oferta. La solicitud queda `asignada` y se avisa al cliente.'
      operationId: aceptarOferta
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                equipo_id:
                  type: integer
                  nullable: true
              type: object
      responses:
        200:
          description: 'Oferta aceptada.'
          content:
            application/json:
              schema:
                required:
                  - oferta
                properties:
                  oferta:
                    $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no responde ofertas.'
        404:
          description: 'No existe o es de otro proveedor.'
        409:
          description: 'La oferta ya no está disponible: otro proveedor aceptó, venció o se retiró.'
        422:
          description: 'No hay un equipo apto y libre, o el proveedor tiene una sanción vigente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/ofertas/{id}/rechazar':
    post:
      tags:
        - Ofertas
      summary: 'Rechazar una oferta'
      description: 'Rechaza una oferta viva con motivo. Requiere red. Rechazar no penaliza hasta que la tasa de aceptación baje del umbral de la política de calificación. Rechazar dos veces la misma oferta devuelve la misma oferta.'
      operationId: rechazarOferta
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - motivo
              properties:
                motivo:
                  type: string
                  example: 'No tengo equipo libre esa semana'
              type: object
      responses:
        200:
          description: 'Oferta rechazada.'
          content:
            application/json:
              schema:
                required:
                  - oferta
                properties:
                  oferta:
                    $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no responde ofertas.'
        404:
          description: 'No existe o es de otro proveedor.'
        409:
          description: 'La oferta ya no está disponible.'
        422:
          description: 'Falta el motivo.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/solicitudes/{id}/cancelar-proveedor':
    post:
      tags:
        - Ofertas
      summary: 'Cancelar un servicio aceptado'
      description: 'El proveedor cancela un servicio que ya aceptó (`asignada` o `en_camino`), con motivo. La solicitud vuelve a asignación con prioridad, sin ofrecérsela de nuevo a quien canceló, y se avisa al cliente. Suma a su tasa de cancelación: pesa el doble con menos de 12 horas de anticipación y no pesa si la `causa` es `emergencia` o `falla_de_equipo` avisada con más de 12 horas. Tres cancelaciones en 30 días generan una advertencia; cinco, una restricción temporal de ofertas (política de cancelación).'
      operationId: cancelarSolicitudComoProveedor
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - motivo
              properties:
                motivo:
                  type: string
                  example: 'El dron quedó en reparación'
                causa:
                  type: string
                  nullable: true
                  enum:
                    - otra
                    - falla_de_equipo
                    - emergencia
              type: object
      responses:
        200:
          description: 'Cancelación registrada.'
          content:
            application/json:
              schema:
                required:
                  - solicitud_id
                  - peso
                properties:
                  solicitud_id:
                    type: integer
                  peso:
                    description: 'Peso con que cuenta en la tasa de cancelación.'
                    type: integer
                    example: 1
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no responde ofertas.'
        404:
          description: 'La solicitud no existe o no está asignada a tu proveedor.'
        422:
          description: 'Falta el motivo o la solicitud ya no admite cancelación del proveedor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/reputacion:
    get:
      tags:
        - Ofertas
      summary: 'Mi reputación'
      description: 'Tu calificación, tus tasas de aceptación y de cancelación (cuatro decimales, entre 0 y 1) y las sanciones vigentes con su motivo. Una sanción se apela ante un administrador (política de calificación, «Defensa»).'
      operationId: verReputacion
      responses:
        200:
          description: 'Reputación del proveedor.'
          content:
            application/json:
              schema:
                required:
                  - calificacion_promedio
                  - calificaciones_conteo
                  - tasa_aceptacion
                  - tasa_cancelacion
                  - sanciones
                properties:
                  calificacion_promedio:
                    type: string
                    example: '4.60'
                  calificaciones_conteo:
                    type: integer
                    example: 24
                  tasa_aceptacion:
                    type: string
                    example: '0.8500'
                  tasa_cancelacion:
                    type: string
                    example: '0.0200'
                  sanciones:
                    type: array
                    items:
                      properties:
                        tipo:
                          type: string
                          enum:
                            - advertencia
                            - restriccion_ofertas
                            - revision_suspension
                        causa:
                          type: string
                          enum:
                            - cancelaciones
                            - calificacion
                            - aceptacion
                        motivo:
                          type: string
                        desde:
                          type: string
                          format: date-time
                        hasta:
                          type: string
                          format: date-time
                          nullable: true
                      type: object
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no recibe ofertas.'
        404:
          description: 'La cuenta no pertenece a ningún proveedor.'
      security:
        -
          tokenDispositivo: []
  /api/version:
    get:
      tags:
        - Distribucion
      summary: 'Versión mínima y vigente del APK'
      description: 'Versión mínima aceptada y versión vigente del APK, con la URL de su release en agrocom-field (GitHub Releases) — el binario no se hospeda en este servidor. Sin autenticación: la app todavía no tiene ningún token emitido cuando la consulta. Con la invariante de negocio "una sola versión autorizada a la vez" (HU-20), hoy `minima` y `vigente` son la misma versión — el contrato ya distingue ambas claves para el día que una historia futura las separe.'
      operationId: obtenerVersionVigente
      responses:
        200:
          description: 'Ambas claves son `null` si el dueño todavía no autorizó ninguna versión.'
          content:
            application/json:
              schema:
                required:
                  - minima
                  - vigente
                properties:
                  minima:
                    oneOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                    nullable: true
                  vigente:
                    oneOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                    nullable: true
                type: object
  /api/disponibilidad:
    get:
      tags:
        - Flota
      summary: 'Mi disponibilidad'
      description: 'La disponibilidad declarada de los equipos vigentes de la cuenta. Un equipo sin fila nunca declaró nada y cuenta como fuera de línea.'
      operationId: consultarDisponibilidad
      responses:
        200:
          description: 'Disponibilidad por equipo.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disponibilidad'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona disponibilidad.'
      security:
        -
          tokenDispositivo: []
    put:
      tags:
        - Flota
      summary: 'Declararme en línea o fuera de línea'
      description: 'Pone en línea o fuera de línea un equipo (`equipo_id`) o, sin él, todos los equipos vigentes de la cuenta. Una solicitud urgente solo se ofrece a quien está en línea. `lat` y `lng` actualizan la última ubicación, que mide la distancia a los terrenos. Idempotente.'
      operationId: declararDisponibilidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - en_linea
              properties:
                en_linea:
                  type: boolean
                equipo_id:
                  type: integer
                  nullable: true
                lat:
                  type: number
                  example: -17.7833
                  nullable: true
                lng:
                  type: number
                  example: -63.1821
                  nullable: true
              type: object
      responses:
        200:
          description: 'Disponibilidad actualizada.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disponibilidad'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona disponibilidad.'
        404:
          description: 'El equipo no es de la cuenta.'
        422:
          description: 'Datos inválidos o la cuenta no tiene equipos vigentes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/proveedores/drones:
    get:
      tags:
        - Flota
      summary: 'Drones de mi proveedor'
      description: 'Drones que el proveedor del que la cuenta es titular opera, con su estado de aprobación y sus ciclos de batería.'
      operationId: listarDrones
      responses:
        200:
          description: Drones.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Flota
      summary: 'Registra un dron'
      description: 'El titular registra un dron suyo. Queda `pendiente` hasta que un administrador lo aprueba con sus documentos (registro, habilitación y seguro). El número de serie es único. Capacidad y ancho de pasada van como string decimal.'
      operationId: registrarDron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - marca
                - modelo
                - numero_serie
                - capacidad_tanque_l
                - ancho_pasada_m
              properties:
                marca:
                  type: string
                  example: DJI
                modelo:
                  type: string
                  example: 'Agras T40'
                numero_serie:
                  type: string
                  example: 1WNDH2K00A0001
                capacidad_tanque_l:
                  type: string
                  example: '40.00'
                ancho_pasada_m:
                  type: string
                  example: '11.00'
              type: object
      responses:
        201:
          description: 'Dron creado `pendiente`.'
          content:
            application/json:
              schema:
                required:
                  - dron
                properties:
                  dron:
                    $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        422:
          description: 'Datos inválidos, serie repetida o el proveedor no admite altas.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/proveedores/drones/{id}':
    put:
      tags:
        - Flota
      summary: 'Corrige un dron pendiente o rechazado'
      description: 'Corrige la ficha de un dron suyo mientras espera revisión o tras un rechazo. Un dron aprobado no se edita: cambiar su serie o su capacidad invalidaría lo que el administrador revisó.'
      operationId: actualizarDron
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - marca
                - modelo
                - numero_serie
                - capacidad_tanque_l
                - ancho_pasada_m
              properties:
                marca:
                  type: string
                modelo:
                  type: string
                numero_serie:
                  type: string
                capacidad_tanque_l:
                  type: string
                  example: '40.00'
                ancho_pasada_m:
                  type: string
                  example: '11.00'
              type: object
      responses:
        200:
          description: 'Dron actualizado.'
          content:
            application/json:
              schema:
                required:
                  - dron
                properties:
                  dron:
                    $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'El dron no existe o no es de esta cuenta.'
        422:
          description: 'Datos inválidos, serie repetida o el dron ya no se puede editar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/proveedores/drones/{id}/reenviar':
    post:
      tags:
        - Flota
      summary: 'Reenvía un dron rechazado a revisión'
      description: 'Un dron rechazado, corregido, vuelve a la cola de revisión (`rechazado` → `pendiente`).'
      operationId: reenviarDron
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Dron otra vez `pendiente`.'
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'El dron no existe o no es de esta cuenta.'
        422:
          description: 'El dron no está rechazado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/proveedores/drones/{id}/documentos':
    post:
      tags:
        - Flota
      summary: 'Carga un documento de un dron'
      description: 'Carga un documento del dron (registro, habilitación, seguro; PDF, JPG o PNG, hasta 8 MB). Queda `en_revision`. Registro, habilitación y seguro exigen fecha de vencimiento. Va como `multipart/form-data`.'
      operationId: cargarDocumentoDron
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - tipo
                - archivo
              properties:
                tipo:
                  type: string
                  enum:
                    - registro_dron
                    - habilitacion_dron
                    - seguro_responsabilidad
                    - otro
                archivo:
                  type: string
                  format: binary
                vence_en:
                  type: string
                  format: date
                  nullable: true
              type: object
      responses:
        201:
          description: 'Documento cargado `en_revision`.'
          content:
            application/json:
              schema:
                required:
                  - documento_id
                properties:
                  documento_id:
                    type: integer
                    example: 41
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'El dron no existe o no es de esta cuenta.'
        422:
          description: 'Archivo o datos inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/proveedores/equipos:
    get:
      tags:
        - Flota
      summary: 'Equipos de mi proveedor'
      description: 'Equipos del proveedor del que la cuenta es titular, vigentes o no, del más reciente al más antiguo.'
      operationId: listarEquipos
      responses:
        200:
          description: Equipos.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Equipo'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Flota
      summary: 'Crea un equipo'
      description: 'El titular arma un equipo con un piloto, un dron y, opcionalmente, un auxiliar de su proveedor. Un piloto y un dron no pueden estar en dos equipos vigentes a la vez; el equipo no recibe ofertas hasta que todos sus integrantes estén aprobados con documentos vigentes.'
      operationId: crearEquipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - piloto_id
                - dron_id
                - vigente_desde
              properties:
                piloto_id:
                  type: integer
                  example: 5
                dron_id:
                  type: integer
                  example: 9
                auxiliar_id:
                  type: integer
                  nullable: true
                vigente_desde:
                  type: string
                  format: date
                  example: '2026-11-23'
                vigente_hasta:
                  type: string
                  format: date
                  nullable: true
              type: object
      responses:
        201:
          description: 'Equipo creado.'
          content:
            application/json:
              schema:
                required:
                  - equipo
                properties:
                  equipo:
                    $ref: '#/components/schemas/Equipo'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        422:
          description: 'Un integrante es ajeno, no está disponible o ya está en otro equipo vigente.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/proveedores/equipos/{id}':
    put:
      tags:
        - Flota
      summary: 'Cambia el auxiliar o cierra un equipo'
      description: 'Cambia el auxiliar del equipo o lo cierra poniéndole fin de vigencia. El piloto y el dron de un equipo no se cambian (otro piloto u otro dron es otro equipo) y una vigencia solo se acorta, nunca se alarga.'
      operationId: actualizarEquipo
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                auxiliar_id:
                  type: integer
                  nullable: true
                vigente_hasta:
                  type: string
                  format: date
                  nullable: true
              type: object
      responses:
        200:
          description: 'Equipo actualizado.'
          content:
            application/json:
              schema:
                required:
                  - equipo
                properties:
                  equipo:
                    $ref: '#/components/schemas/Equipo'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'El equipo no existe o no es de esta cuenta.'
        422:
          description: 'Auxiliar ajeno o no disponible, o vigencia inválida.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/notificaciones:
    get:
      tags:
        - Notificaciones
      summary: 'Mis avisos'
      description: 'Los avisos más recientes de la cuenta (hasta 50), los no leídos primero y después por fecha. El texto sale ya armado en español. `no_leidas` cuenta todas las pendientes de la cuenta, aunque no entren en la lista.'
      operationId: listarNotificaciones
      responses:
        200:
          description: 'Avisos de la cuenta.'
          content:
            application/json:
              schema:
                required:
                  - data
                  - no_leidas
                properties:
                  data:
                    type: array
                    items:
                      required:
                        - id
                        - tipo
                        - titulo
                        - recurso_tipo
                        - recurso_id
                        - leida
                        - creada_en

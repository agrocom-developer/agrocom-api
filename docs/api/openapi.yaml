          name: hectareas_min
          in: query
          required: false
          schema:
            type: string
        -
          name: hectareas_max
          in: query
          required: false
          schema:
            type: string
        -
          name: precio_ha_min
          in: query
          required: false
          schema:
            type: string
        -
          name: precio_ha_max
          in: query
          required: false
          schema:
            type: string
        -
          name: fecha_hasta
          in: query
          description: 'Ventana deseada que empieza antes de esa fecha.'
          required: false
          schema:
            type: string
            format: date
        -
          name: cultivo
          in: query
          required: false
          schema:
            type: string
        -
          name: tipo_aplicacion
          in: query
          required: false
          schema:
            type: string
        -
          name: orden

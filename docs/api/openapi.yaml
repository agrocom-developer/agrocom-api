        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - uuid_cliente
                - tipo
              properties:
                uuid_cliente:
                  type: string
                  format: uuid
                tipo:
                  type: string
                  enum:
                    - acepta_propuesta
                    - contraoferta
                precio_ha:
                  description: 'Obligatorio en `contraoferta`.'
                  type: string
                  example: '118'
                  nullable: true
                equipo_id:
                  type: integer
                  nullable: true
                nota:
                  type: string
                  example: 'Puedo ir la primera semana.'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Oferta creada.'
          content:
            application/json:
              schema:
                required:

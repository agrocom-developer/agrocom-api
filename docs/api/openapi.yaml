                  format: uuid
                texto:
                  type: string
                  maxLength: 1000
              type: object
      responses:
        201:
          description: 'Mensaje creado.'
          content:
            application/json:
              schema:
                required:
                  - mensaje
                properties:
                  mensaje:
                    $ref: '#/components/schemas/Mensaje'

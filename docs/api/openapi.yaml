            application/json:
              schema:
                required:
                  - proveedor
                  - documentos_faltantes
                  - apto_para_ofertas
                properties:
                  proveedor:
                    $ref: '#/components/schemas/Proveedor'
                  documentos_faltantes:
                    description: 'Tipos de documento obligatorios del proveedor sin uno aprobado y vigente.'
                    type: array
                    items:
                      type: string
                      example: seguro_responsabilidad
                  apto_para_ofertas:
                    type: boolean
                    example: false
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona ni ve un proveedor.'
        404:
          description: 'La cuenta no es titular ni piloto de ningún proveedor.'
      security:
        -
          tokenDispositivo: []
  /api/proveedores/mi/reenviar:
    post:
      tags:
        - Proveedores
      summary: 'Reenvía mi proveedor rechazado a revisión'
      description: 'Tras un rechazo, el titular corrige lo que se le indicó (documentos, datos) y vuelve a la cola de revisión: el proveedor pasa de `rechazado` a `pendiente`. Solo aplica a un proveedor rechazado.'
      operationId: reenviarMiProveedor

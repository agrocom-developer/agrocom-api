  /api/perfil/foto:
    put:
      tags:
        - Seguridad
      summary: 'Subir mi foto de perfil'
      description: 'La cuenta del token sube o reemplaza su foto de perfil (multipart, menos de 300 KB: la app la comprime antes). Sirve a clientes, proveedores, pilotos y auxiliares. El cliente la ve en la tarjeta del proveedor al comparar ofertas. La foto anterior se borra del disco privado.'
      operationId: subirFotoDePerfil

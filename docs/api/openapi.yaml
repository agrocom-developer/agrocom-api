                  example: carlos.mamani
                email:
                  type: string
                  format: email
                  nullable: true
                password:
                  description: 'Mínimo 8 caracteres con letras y números.'
                  type: string
                  format: password
                telefono:
                  type: string
                  example: '+591 70012345'
                razon_social:
                  type: string
                  example: 'Mamani Agroservicios'
                documento_fiscal:
                  description: 'NIT o documento de identidad.'
                  type: string
                  example: '4521897012'
                zona_base_id:
                  description: 'Zona base (ver `GET /api/zonas`).'
                  type: integer
                  nullable: true
                radio_operacion_km:
                  description: 'Decimal exacto; por defecto 50.'
                  type: string
                  example: '80'
                  nullable: true
                licencia_numero:
                  description: 'Obligatoria si el tipo es `independiente`.'
                  type: string
                  example: RPA-2291
                  nullable: true
                licencia_vence:
                  description: 'Obligatoria si el tipo es `independiente`; debe ser futura.'
                  type: string
                  format: date
                  example: '2027-06-30'
                  nullable: true
                categoria_habilitacion:
                  description: 'Obligatoria si el tipo es `independiente`.'
                  type: string
                  example: 'RPAS agrícola'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Proveedor creado en estado `pendiente`.'
          content:
            application/json:
              schema:
                required:
                  - proveedor
                properties:
                  proveedor:
                    $ref: '#/components/schemas/Proveedor'
                type: object
        422:
          description: 'Datos inválidos o login, correo o documento ya registrados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        429:
          description: 'Demasiados registros desde la misma IP; reintentar tras `Retry-After` segundos.'
  /api/dispositivos:
    get:
      tags:
        - Seguridad
      summary: 'Lista los dispositivos del operario autenticado'
      description: 'Dispositivos donde el operario autenticado tiene sesión abierta. Solo los suyos: no existe forma de listar los de otro usuario desde la app de campo.'
      operationId: listarDispositivosPropios
      responses:
        200:
          description: 'Dispositivos con sesión viva, el usado más recientemente primero.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  '/api/dispositivos/{id}':
    get:
      tags:
        - Seguridad
      summary: 'Muestra un dispositivo del operario autenticado'
      description: 'Un dispositivo del operario autenticado. Un id que no le pertenece devuelve 404 y no 403: un 403 confirmaría que ese dispositivo existe.'
      operationId: verDispositivoPropio
      parameters:
        -
          name: id
          in: path
          description: 'Identificador del dispositivo.'
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'El dispositivo pedido.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        404:
          description: 'No existe, o es de otro usuario — indistinguibles a propósito.'
      security:
        -
          tokenDispositivo: []
  /api/auth/token:
    post:
      tags:
        - Seguridad
      summary: 'Emite el token de un dispositivo de campo'
      description: 'Autentica al operario y emite el token con el que ese dispositivo opera sin volver a loguearse. El token caduca a los 30 días por defecto (configurable) y deja de valer antes si se lo revoca desde el panel. Limita los intentos por usuario e IP: superado el límite responde 429. Reintentar desde el mismo `uuid_dispositivo` revoca el token anterior y emite uno nuevo — nunca acumula credenciales vivas. El valor en claro se devuelve UNA sola vez.'
      operationId: emitirTokenDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - password
                - uuid_dispositivo
              properties:
                username:
                  description: 'Login del operario (nunca un correo).'
                  type: string
                  example: camila.rojas
                password:
                  type: string
                  format: password
                  example: password
                uuid_dispositivo:
                  description: 'UUID generado en el dispositivo.'
                  type: string
                  format: uuid
                  example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
                nombre_dispositivo:
                  description: 'Nombre legible del equipo, para que el panel sepa cuál revoca.'
                  type: string
                  example: 'Moto G84 — piloto 2'
                  nullable: true
                role_id:
                  description: 'Rol con el que se quiere operar. Opcional si el usuario tiene un único rol vivo.'
                  type: integer
                  example: 1
                  nullable: true
              type: object
      responses:
        201:
          description: 'Token emitido. `token` es el único momento en que la credencial existe en claro.'
          content:
            application/json:
              schema:
                required:
                  - token
                  - token_type
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  token:
                    description: 'Credencial completa, para el header `Authorization: Bearer`.'
                    type: string
                    example: 12|aB3cD4...
                  token_type:
                    type: string
                    example: Bearer
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        403:
          description: 'El `role_id` pedido no está entre los roles vivos del usuario.'
        409:
          description: 'El usuario tiene más de un rol vivo (o ninguno) y no indicó `role_id`: hay que elegir con cuál entra. Mismo contrato que el 409 del panel.'
          content:
            application/json:
              schema:
                required:
                  - message
                  - roles
                properties:
                  message:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolActivo'
                type: object
        422:
          description: 'Credenciales incorrectas, cuenta deshabilitada, o payload inválido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        429:
          description: 'Demasiados intentos; reintentar tras `Retry-After` segundos.'
    delete:
      tags:
        - Seguridad
      summary: 'Cierra la sesión del dispositivo actual'
      description: 'Cierra la sesión de ESTE dispositivo revocando el token con el que se hizo el request. Un dispositivo nunca puede cerrar la sesión de otro: para eso está la pantalla de revocación del panel.'
      operationId: cerrarSesionCampo
      responses:
        204:
          description: 'Sesión cerrada; el token deja de valer de inmediato.'
        401:
          description: 'Token ausente o ya revocado.'
      security:
        -
          tokenDispositivo: []
  /api/auth/sesion:
    get:
      tags:
        - Seguridad
      summary: 'Datos de la sesión del dispositivo'
      description: 'Quién es el operario, con qué rol opera y desde qué dispositivo. La app la consulta al reconectarse para saber si su token sigue vigente: un token revocado, una cuenta deshabilitada o un rol que le sacaron devuelven 401 acá.'
      operationId: verSesionCampo
      responses:
        200:
          description: 'Sesión vigente.'
          content:
            application/json:
              schema:
                required:
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  /api/sync/catalogo:
    get:
      tags:
        - Sincronizacion
      summary: 'Pull de catálogo con cursor (personas, servicios asignados y retirados, límites)'
      description: 'Baja el catálogo de personas, los servicios asignados al equipo del operario del token y los límites de condiciones de vuelo, modificado desde la posición del cursor recibido, con paginación por cursor (`updated_at`, `id`) — nunca por número de página, para no perder ni repetir registros entre pulls. `desde` vacío o ausente trae todo lo vigente (primera sincronización). Un `desde` no decodificable se trata igual que vacío, nunca como error de validación. Cada sección, `servicios_retirados` incluida, avanza su propia posición dentro del mismo cursor opaco y entrega como máximo 200 filas por pull; no hay flag "hay más": la sección que llenó su página se completa en el pull siguiente con el cursor devuelto. Con cursor vacío `servicios_retirados` viene vacía y su posición arranca en el momento del pull (un retiro en ese mismo segundo puede llegar en el pull siguiente aunque el dispositivo nunca haya tenido la fila: se prefiere repetir a perder). Un cursor anterior a esa sección la trae desde el principio, paginada.'
      operationId: obtenerCatalogoSincronizacion
      parameters:
        -
          name: desde
          in: query
          description: 'Cursor opaco devuelto por el pull anterior. Ausente o vacío en la primera sincronización.'
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Catálogo modificado desde el cursor, y el cursor de continuación para el próximo pull.'
          content:
            application/json:
              schema:
                required:
                  - personas
                  - servicios_asignados
                  - servicios_retirados
                  - limites
                  - cursor
                properties:
                  personas:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonaCatalogo'
                  servicios_asignados:
                    description: 'Solicitudes aceptadas que el equipo del operario lleva al lote, modificadas desde el cursor.'
                    type: array
                    items:
                      $ref: '#/components/schemas/ServicioAsignadoCatalogo'
                  servicios_retirados:
                    description: 'Servicios que el operario tuvo y ya no debe llevar, desde el cursor. Vacía en el primer pull (cursor vacío) y sin equipo.'
                    type: array
                    items:
                      $ref: '#/components/schemas/ServicioRetiradoCatalogo'
                    example:
                      -
                        id: 31
                        uuid_cliente: 9a1b7e3e-2f7a-4b3d-8c1e-6f2a1d9c4b0a
                        motivo: cancelada
                        updated_at: '2026-12-02T11:00:00+00:00'
                  limites:
                    $ref: '#/components/schemas/LimitesCondicionesCatalogo'
                  cursor:
                    description: 'Cursor opaco a reenviar tal cual en `desde` en el próximo pull.'
                    type: string
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  /api/sync:
    post:
      tags:
        - Sincronizacion
      summary: 'Push de sincronización en lote (trabajo, sesión)'
      description: 'Push en lote de la cola offline (espec §2.1). Cada registro se procesa en su propia transacción —nunca el lote completo en una— y se responde con uno de tres estados: `aplicado`, `duplicado` (reintento del mismo `uuid_cliente` ya aplicado, se trata como éxito) o `rechazado` con motivo. El servidor agrupa por tipo y aplica siempre en el orden `trabajo`, `sesion`, `cierre_trabajo`, `cierre_sesion`, sin importar el orden del arreglo recibido, así que un registro puede referenciar otro del mismo lote aunque venga antes en el arreglo.'
      operationId: sincronizarLote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - registros
              properties:
                registros:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegistroSync'
              type: object
      responses:
        200:
          description: 'Resultado por registro, en el mismo orden del arreglo de entrada.'
          content:
            application/json:
              schema:
                required:
                  - resultados
                properties:
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultadoSync'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'Falta `registros`, o no es un arreglo.'
      security:
        -
          tokenDispositivo: []
  /api/clientes/registro:
    post:
      tags:
        - Clientes
      summary: 'Registro público de un cliente'
      description: 'Alta pública de un cliente: crea la cuenta (rol `cliente`) y su ficha. El cliente no pasa por aprobación: puede pedir servicios desde el primer momento. Una empresa debe enviar razón social y NIT. No devuelve token: la persona ingresa luego por `POST /api/auth/token`. Limita los intentos por IP: superado el límite responde 429.'
      operationId: registrarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - tipo
                - nombre
                - username
                - password
                - telefono
              properties:
                tipo:
                  type: string
                  example: empresa
                  enum:
                    - persona
                    - empresa
                nombre:
                  description: 'Nombre de quien usa la cuenta.'
                  type: string
                  example: 'Rosa Condori Vargas'
                username:
                  description: 'Login (nunca un correo): letras, números, punto, guion.'
                  type: string
                  example: rosa.condori
                email:
                  type: string
                  format: email
                  nullable: true
                password:
                  description: 'Mínimo 8 caracteres con letras y números.'
                  type: string
                  format: password
                telefono:
                  type: string
                  example: '+591 76543210'
                razon_social:
                  description: 'Obligatoria para una empresa; si falta, se usa el nombre.'
                  type: string
                  nullable: true
                documento_fiscal:
                  description: 'Obligatorio para una empresa (NIT).'
                  type: string
                  nullable: true
              type: object
      responses:
        201:
          description: 'Cliente creado y activo.'
          content:
            application/json:
              schema:
                required:
                  - cliente
                properties:
                  cliente:
                    $ref: '#/components/schemas/Cliente'
                type: object
        422:
          description: 'Datos inválidos o login, correo o documento ya registrados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        429:
          description: 'Demasiados registros desde la misma IP; reintentar tras `Retry-After` segundos.'
  /api/clientes/mi:
    get:
      tags:
        - Clientes
      summary: 'Mi perfil de cliente'
      description: 'La ficha del cliente de la cuenta del token. El alcance sale de la cuenta autenticada, nunca de un id del request.'
      operationId: verMiCliente
      responses:
        200:
          description: 'Perfil del cliente.'
          content:
            application/json:
              schema:
                required:

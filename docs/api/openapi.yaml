  /api/proveedores/registro:
    post:
      tags:
        - Proveedores
      summary: 'Registro público de un proveedor'
      description: 'Alta pública de un proveedor independiente o tercero. Crea la cuenta (rol `proveedor`, más `piloto` si es independiente) y deja al proveedor `pendiente`: nadie opera sin aprobación de un administrador. El independiente es su propio piloto y envía su licencia. No devuelve token: la persona ingresa luego por `POST /api/auth/token`. Limita los intentos por IP: superado el límite responde 429.'
      operationId: registrarProveedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - tipo
                - nombre
                - username
                - password
                - telefono
                - razon_social
                - documento_fiscal
                - nombres
                - apellidos
                - documento_identidad
                - fecha_nacimiento
              properties:
                tipo:
                  type: string
                  example: independiente
                  enum:
                    - independiente
                    - tercero
                nombre:
                  description: 'Nombre del titular.'
                  type: string
                  example: 'Carlos Mamani Quispe'
                username:
                  description: 'Login (nunca un correo): letras, números, punto, guion.'
                  type: string
                  example: carlos.mamani
                email:
                  type: string
                  format: email
                  nullable: true
                password:
                  description: 'Mínimo 8 caracteres con letras y números.'
                  type: string
                  format: password
                telefono:
                  type: string
                  example: '+591 70012345'
                razon_social:
                  type: string
                  example: 'Mamani Agroservicios'
                nombres:
                  description: 'Datos de la persona (piloto o titular); el administrador los revisa al aprobar.'
                  type: string
                  example: Carlos
                apellidos:
                  type: string
                  example: 'Mamani Quispe'
                documento_identidad:
                  type: string
                  example: '7845123 SC'
                fecha_nacimiento:
                  type: string
                  format: date
                  example: '1988-04-12'
                documento_fiscal:
                  description: 'NIT o documento de identidad.'
                  type: string
                  example: '4521897012'
                zona_base_id:
                  description: 'Zona base (ver `GET /api/zonas`).'
                  type: integer
                  nullable: true
                radio_operacion_km:
                  description: 'Decimal exacto; por defecto 50.'
                  type: string
                  example: '80'
                  nullable: true
                licencia_numero:
                  description: 'Obligatoria si el tipo es `independiente`.'
                  type: string
                  example: RPA-2291
                  nullable: true
                licencia_vence:
                  description: 'Obligatoria si el tipo es `independiente`; debe ser futura.'
                  type: string
                  format: date
                  example: '2027-06-30'
                  nullable: true
                categoria_habilitacion:
                  description: 'Obligatoria si el tipo es `independiente`.'
                  type: string
                  example: 'RPAS agrícola'
                  nullable: true
              type: object
      responses:

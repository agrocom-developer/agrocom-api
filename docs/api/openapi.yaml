          description: 'Proveedor creado en estado `pendiente`.'
          content:
            application/json:
              schema:
                required:
                  - proveedor
                properties:
                  proveedor:
                    $ref: '#/components/schemas/Proveedor'
                type: object
        422:
          description: 'Datos inválidos o login, correo o documento ya registrados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        429:
          description: 'Demasiados registros desde la misma IP; reintentar tras `Retry-After` segundos.'
  '/api/dispositivos/{id}':

openapi: 3.0.0
info:
  title: 'Agrocom API'
  description: 'API del Sistema de Gestión de Operaciones de Fumigación de Agrocom SRL. Sirve a las apps de campo (`agrocom-field`) y al portal del cliente; el spec generado desde el código es el contrato de la API (ADR 0014). Dinero y hectáreas viajan como string decimal, nunca como número de punto flotante.'
  version: 0.1.0
servers:
  -
    url: /
    description: 'Servidor actual — la URL base la define el entorno (local, staging, producción).'
paths:
  '/api/solicitudes/{id}/calificaciones':
    get:
      tags:
        - Calificaciones
      summary: 'Estado de la calificación de un servicio'
      description: 'A quiénes puedes calificar en un servicio tuyo (el proveedor, el piloto y, si el equipo lo llevaba, el auxiliar), a quiénes ya calificaste y hasta cuándo. Solo un servicio `completada` se califica, durante 7 días desde que se completó.'
      operationId: verCalificacionesDelServicio
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Estado de la calificación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalificacionesDelServicio'
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Calificaciones
      summary: 'Calificar un servicio completado'
      description: 'Califica al proveedor, al piloto y al auxiliar de un servicio completado: de 1 a 5 estrellas, etiquetas de un catálogo cerrado y un comentario opcional. Cada calificación lleva su `uuid_cliente` (idempotente: reintentar el mismo devuelve la calificación ya guardada) y se guarda una sola vez por sujeto: no se edita. Las de una misma llamada se guardan juntas o ninguna. Responde 201 si se creó alguna y 200 si todas eran reintentos.'
      operationId: calificarServicio
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - calificaciones
              properties:
                calificaciones:
                  type: array
                  items:
                    required:
                      - uuid_cliente
                      - sujeto_tipo
                      - estrellas
                    properties:
                      uuid_cliente:
                        type: string
                        format: uuid
                      sujeto_tipo:
                        type: string
                        enum:
                          - proveedor
                          - piloto
                          - auxiliar
                      estrellas:
                        type: integer
                        example: 5
                        maximum: 5
                        minimum: 1
                      etiquetas:
                        type: array
                        items:
                          type: string
                          enum:
                            - puntualidad
                            - cobertura_pareja
                            - comunicacion
                            - cuidado_entorno
                            - orden_lote
                        nullable: true
                      comentario:
                        type: string
                        nullable: true
                    type: object
                  maxItems: 3
                  minItems: 1
              type: object
      responses:
        201:
          description: 'Calificaciones guardadas.'
          content:
            application/json:
              schema:
                required:
                  - calificaciones
                properties:
                  calificaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calificacion'
                type: object
        200:
          description: 'Reintento: todas las calificaciones ya estaban guardadas.'
          content:
            application/json:
              schema:
                required:
                  - calificaciones
                properties:
                  calificaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calificacion'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
        409:
          description: 'Ya calificaste a ese sujeto en este servicio.'
        422:
          description: 'El servicio no está completado, el plazo venció, el sujeto o las etiquetas no corresponden, o los datos son inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/solicitudes/{id}/calificar-cliente':
    get:
      tags:
        - Calificaciones
      summary: 'Estado de la calificación del cliente'
      description: 'Si puedes calificar al cliente de un servicio que prestó tu proveedor, hasta cuándo y la calificación que ya diste. Es privada: el cliente nunca la ve. Solo un servicio `completada` se califica, durante 7 días desde que se completó.'
      operationId: verCalificacionDelCliente
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Estado de la calificación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalificacionesDelServicio'
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no califica clientes.'
        404:
          description: 'No existe o no lo prestó tu proveedor.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Calificaciones
      summary: 'Calificar al cliente'
      description: 'Califica en privado al cliente de un servicio completado que prestó tu proveedor: de 1 a 5 estrellas, etiquetas (puntualidad, comunicacion, acceso_lote, claridad_pedido) y un comentario opcional. No se publica: sirve a moderación y a soporte y alimenta la reputación del cliente. Idempotente por `uuid_cliente`; se guarda una sola vez por servicio y no se edita.'
      operationId: calificarCliente
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - uuid_cliente
                - estrellas
              properties:
                uuid_cliente:
                  type: string
                  format: uuid
                estrellas:
                  type: integer
                  example: 4
                  maximum: 5
                  minimum: 1
                etiquetas:
                  type: array
                  items:
                    type: string
                    enum:
                      - puntualidad
                      - comunicacion
                      - acceso_lote
                      - claridad_pedido
                  nullable: true
                comentario:
                  type: string
                  nullable: true
              type: object
      responses:
        201:
          description: 'Calificación guardada.'
          content:
            application/json:
              schema:
                required:
                  - calificacion
                properties:
                  calificacion:
                    $ref: '#/components/schemas/Calificacion'
                type: object
        200:
          description: 'Reintento: la calificación ya estaba guardada.'
          content:
            application/json:
              schema:
                required:
                  - calificacion
                properties:
                  calificacion:
                    $ref: '#/components/schemas/Calificacion'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no califica clientes.'
        404:
          description: 'No existe o no lo prestó tu proveedor.'
        409:
          description: 'Ya calificaste al cliente en este servicio.'
        422:
          description: 'El servicio no está completado, el plazo venció, las etiquetas no corresponden o los datos son inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/calificaciones/recibidas:
    get:
      tags:
        - Calificaciones
      summary: 'Calificaciones que recibo'
      description: 'Las calificaciones que recibe tu proveedor (él, su piloto y su auxiliar), de la más nueva a la más vieja, sin las que un administrador ocultó. Incluye el resumen que muestra la app: promedio y conteo (los de tu reputación), distribución por estrellas y etiquetas más frecuentes de las últimas 100.'
      operationId: listarCalificacionesRecibidas
      parameters:
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Página de calificaciones.'
          content:
            application/json:
              schema:
                required:
                  - calificaciones
                  - pagina
                  - paginas
                  - total
                  - resumen
                properties:
                  calificaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Calificacion'
                  pagina:
                    type: integer
                    example: 1
                  paginas:
                    type: integer
                    example: 3
                  total:
                    type: integer
                    example: 41
                  resumen:
                    required:
                      - calificacion_promedio
                      - calificaciones_conteo
                      - por_estrellas
                      - etiquetas
                    properties:
                      calificacion_promedio:
                        type: string
                        example: '4.60'
                      calificaciones_conteo:
                        type: integer
                        example: 24
                      por_estrellas:
                        description: 'Cuántas calificaciones al proveedor tienen cada cantidad de estrellas (claves "1" a "5").'
                        type: object
                        additionalProperties:
                          type: integer
                      etiquetas:
                        description: 'Cuántas veces aparece cada etiqueta, de la más frecuente a la menos.'
                        type: object
                        additionalProperties:
                          type: integer
                    type: object
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no ve calificaciones.'
        404:
          description: 'La cuenta no pertenece a ningún proveedor.'
      security:
        -
          tokenDispositivo: []
  '/api/calificaciones/{id}/reportar':
    post:
      tags:
        - Calificaciones
      summary: 'Reportar una calificación'
      description: 'Reporta con motivo una calificación que recibiste y consideras abusiva (insultos, datos personales, factores ajenos como el clima, represalia tras una disputa). Queda `en_moderacion` y un administrador decide; reportar no la oculta ni la saca del promedio. Reportar dos veces la misma devuelve la misma calificación.'
      operationId: reportarCalificacion
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - motivo
              properties:
                motivo:
                  type: string
                  example: 'El comentario incluye insultos'
              type: object
      responses:
        200:
          description: 'Calificación en moderación.'
          content:
            application/json:
              schema:
                required:
                  - calificacion
                properties:
                  calificacion:
                    $ref: '#/components/schemas/Calificacion'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no reporta calificaciones.'
        404:
          description: 'No existe o no es de tu proveedor.'
        422:
          description: 'Falta el motivo o la calificación ya está oculta.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/solicitudes/{id}/disputas':
    post:
      tags:
        - Disputas
      summary: 'Abrir una disputa'
      description: 'Abre la disputa de un servicio (una por solicitud). El cliente puede hacerlo desde `ejecutada` hasta 72 horas después, por: `cobertura_incompleta`, `mala_aplicacion`, `dano_a_cultivos_o_terceros`, `producto_distinto`, `equipo_ausente`, `evidencia_faltante`, `cobro_indebido` o `trato_inadecuado`; la solicitud pasa a `en_disputa`. El proveedor puede abrirla por `cobro_pendiente`, `acceso_negado` o `calificacion_abusiva`. `monto_en_disputa` es opcional (por defecto, todo el monto del servicio) y no puede pasar de él. La contraparte tiene 48 horas para responder (`responde_antes_de`).'
      operationId: abrirDisputa
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - motivo
                - detalle
              properties:
                motivo:
                  type: string
                  example: cobertura_incompleta
                detalle:
                  type: string
                  example: 'Quedaron franjas sin cubrir en el lado norte'
                monto_en_disputa:
                  type: string
                  example: '3000.00'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Disputa abierta.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no abre disputas.'
        404:
          description: 'El servicio no existe o no es tuyo.'
        409:
          description: 'El servicio ya tiene una disputa.'
        422:
          description: 'El motivo no corresponde a tu lado, el servicio no está en un estado disputable, el plazo venció o el monto es inválido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/solicitudes/{id}/disputa':
    get:
      tags:
        - Disputas
      summary: 'La disputa de una solicitud'
      description: 'La disputa de un servicio tuyo, con su conversación y sus resoluciones. Responde 404 si la solicitud no tiene disputa o no es tuya.'
      operationId: verDisputaDeLaSolicitud
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'La disputa.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no ve disputas.'
        404:
          description: 'No hay disputa en esa solicitud o no es tuya.'
      security:
        -
          tokenDispositivo: []
  /api/disputas:
    get:
      tags:
        - Disputas
      summary: 'Mis disputas'
      description: 'Tus disputas (las de tu cuenta o las de tu proveedor), de la más nueva a la más vieja. `estado` filtra por un estado exacto.'
      operationId: listarDisputas
      parameters:
        -
          name: estado
          in: query
          required: false
          schema:
            type: string
            enum:
              - abierta
              - en_revision
              - resuelta
              - retirada
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Página de disputas.'
          content:
            application/json:
              schema:
                required:
                  - disputas
                  - pagina
                  - paginas
                  - total
                properties:
                  disputas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Disputa'
                  pagina:
                    type: integer
                    example: 1
                  paginas:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 2
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no ve disputas.'
        404:
          description: 'La cuenta no pertenece a ningún proveedor.'
      security:
        -
          tokenDispositivo: []
  '/api/disputas/{id}':
    get:
      tags:
        - Disputas
      summary: 'Detalle de una disputa'
      description: 'Una disputa tuya con su conversación y sus resoluciones. Una de otra cuenta responde 404.'
      operationId: verDisputa
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'La disputa.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no ve disputas.'
        404:
          description: 'No existe o no es tuya.'
      security:
        -
          tokenDispositivo: []
  '/api/disputas/{id}/mensajes':
    post:
      tags:
        - Disputas
      summary: 'Escribir en una disputa'
      description: 'Agrega un mensaje a la conversación de una disputa viva (`abierta` o `en_revision`): tu respuesta a la contraparte o a soporte. Una disputa resuelta se reabre apelando, no escribiendo.'
      operationId: enviarMensajeDeDisputa
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - texto
              properties:
                texto:
                  type: string
                  example: 'Adjunto la hora del vuelo: terminó a las 15:40'
              type: object
      responses:
        201:
          description: 'Mensaje guardado; devuelve la disputa con su conversación.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no escribe en disputas.'
        404:
          description: 'No existe o no es tuya.'
        409:
          description: 'La disputa ya no admite mensajes.'
        422:
          description: 'Falta el texto.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/disputas/{id}/retirar':
    post:
      tags:
        - Disputas
      summary: 'Retirar una disputa'
      description: 'Quien abrió la disputa la retira mientras está viva. Si había movido la solicitud a `en_disputa`, la solicitud se completa como si el reclamo no se hubiera hecho. Retirar dos veces devuelve la misma disputa.'
      operationId: retirarDisputa
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Disputa retirada.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona disputas.'
        404:
          description: 'No existe o no es tuya.'
        409:
          description: 'La disputa ya está resuelta y no se retira.'
        422:
          description: 'Solo quien abrió la disputa puede retirarla.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/disputas/{id}/apelar':
    post:
      tags:
        - Disputas
      summary: 'Apelar una resolución'
      description: 'Apela la resolución con pruebas nuevas: una sola vez y dentro de 7 días desde la resolución (`apelable_hasta`). La disputa vuelve a revisión en su segunda ronda y un administrador la resuelve de nuevo; la primera resolución rige hasta entonces.'
      operationId: apelarDisputa
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - pruebas
              properties:
                pruebas:
                  type: string
                  example: 'El registro del dron muestra la franja norte sin cubrir'
              type: object
      responses:
        200:
          description: 'Apelación registrada.'
          content:
            application/json:
              schema:
                required:
                  - disputa
                properties:
                  disputa:
                    $ref: '#/components/schemas/Disputa'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona disputas.'
        404:
          description: 'No existe o no es tuya.'
        409:
          description: 'La disputa no está resuelta o ya se apeló.'
        422:
          description: 'Faltan las pruebas o el plazo de 7 días venció.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/version:
    get:
      tags:
        - Distribucion
      summary: 'Versión mínima y vigente del APK'
      description: 'Versión mínima aceptada y versión vigente del APK, con la URL de su release en agrocom-field (GitHub Releases) — el binario no se hospeda en este servidor. Sin autenticación: la app todavía no tiene ningún token emitido cuando la consulta. Con la invariante de negocio "una sola versión autorizada a la vez" (HU-20), hoy `minima` y `vigente` son la misma versión — el contrato ya distingue ambas claves para el día que una historia futura las separe.'
      operationId: obtenerVersionVigente
      responses:
        200:
          description: 'Ambas claves son `null` si el dueño todavía no autorizó ninguna versión.'
          content:
            application/json:
              schema:
                required:
                  - minima
                  - vigente
                properties:
                  minima:
                    nullable: true
                    allOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                  vigente:
                    nullable: true
                    allOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                type: object
  /api/proveedores/drones:
    get:
      tags:
        - Flota
      summary: 'Drones de mi proveedor'
      description: 'Drones que el proveedor del que la cuenta es titular opera, con su estado de aprobación y sus ciclos de batería. El piloto de un proveedor recibe, en solo lectura, los drones de sus equipos vigentes.'
      operationId: listarDrones
      responses:
        200:
          description: Drones.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona ni ve drones.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Flota
      summary: 'Registra un dron'
      description: 'El titular registra un dron suyo. Queda `pendiente` hasta que un administrador lo aprueba con sus documentos (registro, habilitación y seguro). El número de serie es único. Capacidad y ancho de pasada van como string decimal.'
      operationId: registrarDron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - marca
                - modelo
                - numero_serie
                - capacidad_tanque_l
                - ancho_pasada_m
              properties:
                marca:
                  type: string
                  example: DJI
                modelo:
                  type: string
                  example: 'Agras T40'
                numero_serie:
                  type: string
                  example: 1WNDH2K00A0001
                anio:
                  type: integer
                  example: 2024
                  nullable: true
                capacidad_tanque_l:
                  type: string
                  example: '40.00'
                ancho_pasada_m:
                  type: string
                  example: '11.00'
              type: object
      responses:
        201:
          description: 'Dron creado `pendiente`.'
          content:
            application/json:
              schema:
                required:
                  - dron
                properties:
                  dron:
                    $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        422:
          description: 'Datos inválidos, serie repetida o el proveedor no admite altas.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/proveedores/drones/{id}':
    put:
      tags:
        - Flota
      summary: 'Corrige un dron pendiente o rechazado'
      description: 'Corrige la ficha de un dron suyo mientras espera revisión o tras un rechazo. Un dron aprobado no se edita: cambiar su serie o su capacidad invalidaría lo que el administrador revisó.'
      operationId: actualizarDron
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - marca
                - modelo
                - numero_serie
                - capacidad_tanque_l
                - ancho_pasada_m
              properties:
                marca:
                  type: string
                modelo:
                  type: string
                numero_serie:
                  type: string
                anio:
                  type: integer
                  example: 2024
                  nullable: true
                capacidad_tanque_l:
                  type: string
                  example: '40.00'
                ancho_pasada_m:
                  type: string
                  example: '11.00'
              type: object
      responses:
        200:
          description: 'Dron actualizado.'
          content:
            application/json:
              schema:
                required:
                  - dron
                properties:
                  dron:
                    $ref: '#/components/schemas/Dron'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'El dron no existe o no es de esta cuenta.'
        422:
          description: 'Datos inválidos, serie repetida o el dron ya no se puede editar.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []

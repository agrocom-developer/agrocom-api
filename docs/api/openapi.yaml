          schema:
            type: string
            enum:
              - distancia
              - precio_ha
              - hectareas
              - reciente
        -
          name: lat
          in: query
          description: 'Latitud del piloto para `orden=distancia`; no se guarda.'
          required: false
          schema:
            type: number
        -
          name: lon
          in: query
          description: 'Longitud del piloto para `orden=distancia`; no se guarda.'
          required: false
          schema:
            type: number
        -
          name: cursor
          in: query
          required: false
          schema:
            type: string
        -
          name: limite
          in: query
          required: false
          schema:
            type: integer

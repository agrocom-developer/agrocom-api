openapi: 3.0.0
info:
  title: 'Agrocom API'
  description: 'API del Sistema de Gestión de Operaciones de Fumigación de Agrocom SRL. Sirve a las apps de campo (`agrocom-field`) y al portal del cliente; el spec generado desde el código es el contrato de la API (ADR 0014). Dinero y hectáreas viajan como string decimal, nunca como número de punto flotante.'
  version: 0.1.0
servers:
  -
    url: /
    description: 'Servidor actual — la URL base la define el entorno (local, staging, producción).'
paths:
  /api/version:
    get:
      tags:
        - Distribucion
      summary: 'Versión mínima y vigente del APK'
      description: 'Versión mínima aceptada y versión vigente del APK, con la URL de su release en agrocom-field (GitHub Releases) — el binario no se hospeda en este servidor. Sin autenticación: la app todavía no tiene ningún token emitido cuando la consulta. Con la invariante de negocio "una sola versión autorizada a la vez" (HU-20), hoy `minima` y `vigente` son la misma versión — el contrato ya distingue ambas claves para el día que una historia futura las separe.'
      operationId: obtenerVersionVigente
      responses:
        200:
          description: 'Ambas claves son `null` si el dueño todavía no autorizó ninguna versión.'
          content:
            application/json:
              schema:
                required:
                  - minima
                  - vigente
                properties:
                  minima:
                    oneOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                    nullable: true
                  vigente:
                    oneOf:
                      -
                        $ref: '#/components/schemas/VersionApk'
                    nullable: true
                type: object
  '/api/trabajos/{uuid_cliente}/acta':
    post:
      tags:
        - Operaciones
      summary: 'Genera el acta de conformidad de un trabajo'
      description: 'Genera el acta de conformidad de un trabajo `cerrado` con todas sus sesiones vigentes `validado` (espec §4.3/§17). Idempotente por trabajo, no por `uuid_cliente`: un segundo pedido sobre un trabajo que ya tiene acta devuelve la MISMA fila y el MISMO PDF, sin regenerar nada. `estado: rechazado` cuando el trabajo no cumple las condiciones — nunca 422 de negocio.'
      operationId: generarActaTrabajo
      parameters:
        -
          name: uuid_cliente
          in: path
          description: 'uuid_cliente del trabajo (el que trajo su apertura).'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - uuid_cliente
              properties:
                uuid_cliente:
                  description: 'uuid_cliente generado por el dispositivo para el ACTA (no el del trabajo).'
                  type: string
                  example: a1b2c3d4-0000-4000-8000-000000000020
              type: object
      responses:
        200:
          description: 'Acta generada, ya existente, o rechazo con motivo.'
          content:
            application/json:
              schema:
                required:
                  - estado
                properties:
                  id:
                    type: integer
                    nullable: true
                  uuid_cliente:
                    type: string
                    nullable: true
                  trabajo_id:
                    type: integer
                    nullable: true
                  estado:
                    type: string
                    enum:
                      - pendiente
                      - firmada
                      - rechazado
                  hectareas_conformadas:
                    type: string
                    nullable: true
                  pdf_url:
                    type: string
                    nullable: true
                  motivo:
                    description: 'Presente solo cuando `estado` es `rechazado`.'
                    type: string
                    nullable: true
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        403:
          description: 'El token no tiene el permiso operaciones.acta.generar.'
        404:
          description: 'El trabajo referenciado no existe.'
      security:
        -
          tokenDispositivo: []
  '/api/actas/{uuid_cliente}/firmar':
    post:
      tags:
        - Operaciones
      summary: 'Firma un acta de conformidad'
      description: 'Registra la firma del agrónomo sobre un acta `pendiente`, referenciando una evidencia ya subida por `POST /api/evidencias` (tipo `firma_acta`). Reintento con la MISMA evidencia sobre un acta ya `firmada` es idempotente; con OTRA evidencia se rechaza.'
      operationId: firmarActa
      parameters:
        -
          name: uuid_cliente
          in: path
          description: 'uuid_cliente del acta (el que devolvió su generación).'
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - evidencia_firma_uuid_cliente
                - firmante
                - fecha_firma
              properties:
                evidencia_firma_uuid_cliente:
                  type: string
                  example: a1b2c3d4-0000-4000-8000-000000000030
                firmante:
                  description: 'Nombre del agrónomo — texto libre.'
                  type: string
                  example: 'Ing. Marcela Vargas'
                fecha_firma:
                  type: string
                  format: date-time
                  example: '2026-09-02T16:30:00-04:00'
              type: object
      responses:
        200:
          description: 'Acta firmada (o ya firmada con la misma evidencia), o rechazo con motivo.'
          content:
            application/json:
              schema:
                required:
                  - estado
                properties:
                  id:
                    type: integer
                    nullable: true
                  uuid_cliente:
                    type: string
                    nullable: true
                  estado:
                    type: string
                    enum:
                      - pendiente
                      - firmada
                      - rechazado
                  firmante:
                    type: string
                    nullable: true
                  fecha_firma:
                    type: string
                    nullable: true
                  motivo:
                    description: 'Presente solo cuando `estado` es `rechazado`.'
                    type: string
                    nullable: true
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        403:
          description: 'El token no tiene el permiso operaciones.acta.firmar.'
        404:
          description: 'El acta referenciada no existe.'
      security:
        -
          tokenDispositivo: []
  '/api/actas/{uuid_cliente}/pdf':
    get:
      tags:
        - Operaciones
      summary: 'Descarga el PDF de un acta'
      description: 'Descarga el PDF del acta, ya generado por `POST /api/trabajos/{uuid_cliente}/acta` — nunca lo regenera. Cualquier token de dispositivo válido puede descargarlo (misma exposición que el resto de la API de campo); no exige `operaciones.acta.generar`/`firmar`, que son de mutación.'
      operationId: descargarActaPdf
      parameters:
        -
          name: uuid_cliente
          in: path
          description: 'uuid_cliente del acta.'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Contenido binario del PDF.'
          content:
            application/pdf: []
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        404:
          description: 'El acta no existe o todavía no tiene PDF generado.'
      security:
        -
          tokenDispositivo: []
  /api/evidencias:
    post:
      tags:
        - Operaciones
      summary: 'Sube una evidencia (multipart/form-data)'
      description: 'Sube un archivo de evidencia (captura de RC, foto de campo, foto de incidencia, comprobante o firma de acta) y responde `aplicado`, `duplicado` (reintento del mismo `uuid_cliente`, se trata como éxito) o `rechazado` con motivo — mismo vocabulario que `POST /api/sync`, aunque este endpoint vive aparte porque su "sobre" lleva un binario. El servidor SIEMPRE recalcula el hash SHA-256 sobre el contenido recibido (es el que queda persistido); si el dispositivo declara `hash_dispositivo` (calculado al capturar, ADR 0009), se compara contra ese cálculo y se rechaza si no coincide — detecta corrupción en tránsito, sin confiar ciegamente en el valor declarado. La compresión a <300 KB y la cola de reintentos son responsabilidad de la app de campo (TE-07 lado app, repo `agrocom-field`) — este endpoint no las repite.'
      operationId: subirEvidencia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - uuid_cliente
                - tipo
                - fecha
                - archivo
              properties:
                uuid_cliente:
                  type: string
                  example: a1b2c3d4-0000-4000-8000-000000000010
                tipo:
                  type: string
                  example: imagen_campo
                  enum:
                    - captura_rc
                    - imagen_campo
                    - foto_incidencia
                    - comprobante
                    - firma_acta
                fecha:
                  type: string
                  format: date-time
                  example: '2026-09-01T10:00:00-04:00'
                hash_dispositivo:
                  description: 'SHA-256 calculado en el dispositivo al capturar (ADR 0009), opcional — si se declara, debe coincidir con el hash recalculado por el servidor.'
                  type: string
                  example: null
                  nullable: true
                archivo:
                  type: string
                  format: binary
              type: object
      responses:
        200:
          description: 'Resultado de aplicar el registro.'
          content:
            application/json:
              schema:
                required:
                  - uuid_cliente
                  - estado
                properties:
                  uuid_cliente:
                    type: string
                    example: a1b2c3d4-0000-4000-8000-000000000010
                    nullable: true
                  estado:
                    type: string
                    example: aplicado
                    enum:
                      - aplicado
                      - duplicado
                      - rechazado
                  motivo:
                    description: 'Presente solo cuando `estado` es `rechazado`.'
                    type: string
                    example: 'archivo ausente o vacío'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'El archivo supera el tope de tamaño de plataforma (20 MB).'
      security:
        -
          tokenDispositivo: []
  /api/ordenes:
    get:
      tags:
        - Operaciones
      summary: 'Lista las órdenes de aplicación con filtros'
      description: 'Listado paginado de órdenes de aplicación para la app de campo (espec §8). Exige el token del dispositivo desde HU-03: dejó de ser público. Todos los filtros se combinan por AND; si `vigentes` y `estado` se contradicen, el resultado es vacío — no hay prevalencia silenciosa entre filtros. Las órdenes borradas lógicamente nunca aparecen.'
      operationId: listarOrdenes
      parameters:
        -
          name: estado
          in: query
          description: 'Filtra por estado de la orden.'
          required: false
          schema:
            type: string
            enum:
              - emitida
              - vigente
              - consumida
              - vencida
        -
          name: lote_id
          in: query
          description: 'Filtra por lote (ID del módulo Comercial).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: contrato_id
          in: query
          description: 'Filtra por contrato (ID del módulo Comercial).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: nro_aplicacion
          in: query
          description: 'Filtra por número de aplicación dentro del contrato (1..n).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: vigentes
          in: query
          description: 'Con valor verdadero devuelve solo las órdenes vigentes (atajo para la app del piloto; equivale a `estado=vigente`).'
          required: false
          schema:
            type: boolean
            default: false
        -
          name: per_page
          in: query
          description: 'Registros por página.'
          required: false
          schema:
            type: integer
            default: 15
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Número de página.'
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Listado paginado de órdenes, ordenado por fecha de emisión descendente.'
          content:
            application/json:
              schema:
                required:
                  - data
                  - links
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrdenAplicacion'
                  links:
                    $ref: '#/components/schemas/PaginacionLinks'
                  meta:
                    $ref: '#/components/schemas/PaginacionMeta'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'Algún filtro no pasó la validación (estado desconocido, per_page fuera de 1..100, etc.).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/reportes/lote/{id}':
    get:
      tags:
        - Operaciones
      summary: 'Descarga el reporte técnico de un trabajo'
      description: 'Descarga el reporte técnico de un trabajo, ya generado por la firma de su acta de conformidad (HU-17/HU-18) — nunca lo regenera. `404` si el trabajo no existe o todavía no tiene reporte (acta sin firmar).'
      operationId: descargarReporteTecnico
      parameters:
        -
          name: id
          in: path
          description: 'id del trabajo (`trabajo_id`).'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Contenido binario del PDF.'
          content:
            application/pdf: []
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        403:
          description: 'El token no tiene el permiso operaciones.reporte.ver.'
        404:
          description: 'El trabajo no existe, o todavía no tiene reporte técnico generado.'
      security:
        -
          tokenDispositivo: []
  /api/dispositivos:
    get:
      tags:
        - Seguridad
      summary: 'Lista los dispositivos del operario autenticado'
      description: 'Dispositivos donde el operario autenticado tiene sesión abierta. Solo los suyos: no existe forma de listar los de otro usuario desde la app de campo.'
      operationId: listarDispositivosPropios
      responses:
        200:
          description: 'Dispositivos con sesión viva, el usado más recientemente primero.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  '/api/dispositivos/{id}':
    get:
      tags:
        - Seguridad
      summary: 'Muestra un dispositivo del operario autenticado'
      description: 'Un dispositivo del operario autenticado. Un id que no le pertenece devuelve 404 y no 403: un 403 confirmaría que ese dispositivo existe.'
      operationId: verDispositivoPropio
      parameters:
        -
          name: id
          in: path
          description: 'Identificador del dispositivo.'
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'El dispositivo pedido.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        404:
          description: 'No existe, o es de otro usuario — indistinguibles a propósito.'
      security:
        -
          tokenDispositivo: []
  /api/auth/token:
    post:
      tags:
        - Seguridad
      summary: 'Emite el token de un dispositivo de campo'
      description: 'Autentica al operario y emite el token con el que ese dispositivo opera sin volver a loguearse. El token no caduca por tiempo (sesión persistente offline): deja de valer cuando se lo revoca desde el panel. Reintentar desde el mismo `uuid_dispositivo` revoca el token anterior y emite uno nuevo — nunca acumula credenciales vivas. El valor en claro se devuelve UNA sola vez.'
      operationId: emitirTokenDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - password
                - uuid_dispositivo
              properties:
                username:
                  description: 'Login del operario (nunca un correo).'
                  type: string
                  example: camila.rojas
                password:
                  type: string
                  format: password
                  example: password
                uuid_dispositivo:
                  description: 'UUID generado en el dispositivo.'
                  type: string
                  format: uuid
                  example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
                nombre_dispositivo:
                  description: 'Nombre legible del equipo, para que el panel sepa cuál revoca.'
                  type: string
                  example: 'Moto G84 — piloto 2'
                  nullable: true
                role_id:
                  description: 'Rol con el que se quiere operar. Opcional si el usuario tiene un único rol vivo.'
                  type: integer
                  example: 1
                  nullable: true
              type: object
      responses:
        201:
          description: 'Token emitido. `token` es el único momento en que la credencial existe en claro.'
          content:
            application/json:
              schema:
                required:
                  - token
                  - token_type
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  token:
                    description: 'Credencial completa, para el header `Authorization: Bearer`.'
                    type: string
                    example: 12|aB3cD4...
                  token_type:
                    type: string
                    example: Bearer
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        403:
          description: 'El `role_id` pedido no está entre los roles vivos del usuario.'
        409:
          description: 'El usuario tiene más de un rol vivo (o ninguno) y no indicó `role_id`: hay que elegir con cuál entra. Mismo contrato que el 409 del panel.'
          content:
            application/json:
              schema:
                required:
                  - message
                  - roles
                properties:
                  message:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolActivo'
                type: object
        422:
          description: 'Credenciales incorrectas, cuenta deshabilitada, o payload inválido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
    delete:
      tags:
        - Seguridad
      summary: 'Cierra la sesión del dispositivo actual'
      description: 'Cierra la sesión de ESTE dispositivo revocando el token con el que se hizo el request. Un dispositivo nunca puede cerrar la sesión de otro: para eso está la pantalla de revocación del panel.'
      operationId: cerrarSesionCampo
      responses:
        204:
          description: 'Sesión cerrada; el token deja de valer de inmediato.'
        401:
          description: 'Token ausente o ya revocado.'
      security:
        -
          tokenDispositivo: []
  /api/auth/sesion:
    get:
      tags:
        - Seguridad
      summary: 'Datos de la sesión del dispositivo'
      description: 'Quién es el operario, con qué rol opera y desde qué dispositivo. La app la consulta al reconectarse para saber si su token sigue vigente: un token revocado, una cuenta deshabilitada o un rol que le sacaron devuelven 401 acá.'
      operationId: verSesionCampo
      responses:
        200:
          description: 'Sesión vigente.'
          content:
            application/json:
              schema:
                required:
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  /api/sync/catalogo:
    get:
      tags:
        - Sincronizacion
      summary: 'Pull de catálogo con cursor (órdenes, lotes, personas)'
      description: 'Baja el catálogo de órdenes vigentes, lotes y personas modificados desde la posición del cursor recibido, con paginación por cursor (`updated_at`, `id`) — nunca por número de página, para no perder ni repetir registros entre pulls. `desde` vacío o ausente trae todo lo vigente (primera sincronización). Un `desde` no decodificable se trata igual que vacío, nunca como error de validación.'
      operationId: obtenerCatalogoSincronizacion
      parameters:
        -
          name: desde
          in: query
          description: 'Cursor opaco devuelto por el pull anterior. Ausente o vacío en la primera sincronización.'
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Catálogo modificado desde el cursor, y el cursor de continuación para el próximo pull.'
          content:
            application/json:
              schema:
                required:
                  - ordenes
                  - lotes
                  - personas
                  - cursor
                properties:
                  ordenes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrdenCatalogo'
                  lotes:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoteCatalogo'
                  personas:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonaCatalogo'
                  cursor:
                    description: 'Cursor opaco a reenviar tal cual en `desde` en el próximo pull.'
                    type: string
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  /api/sync:
    post:
      tags:
        - Sincronizacion
      summary: 'Push de sincronización en lote (trabajo, sesión)'
      description: 'Push en lote de la cola offline (espec §2.1). Cada registro se procesa en su propia transacción —nunca el lote completo en una— y se responde con uno de tres estados: `aplicado`, `duplicado` (reintento del mismo `uuid_cliente` ya aplicado, se trata como éxito) o `rechazado` con motivo. El servidor agrupa por tipo y aplica siempre en el orden `trabajo`, `sesion`, `cierre_trabajo`, `cierre_sesion`, sin importar el orden del arreglo recibido, así que un registro puede referenciar otro del mismo lote aunque venga antes en el arreglo.'
      operationId: sincronizarLote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - registros
              properties:
                registros:
                  type: array
                  items:
                    $ref: '#/components/schemas/RegistroSync'
              type: object
      responses:
        200:
          description: 'Resultado por registro, en el mismo orden del arreglo de entrada.'
          content:
            application/json:
              schema:
                required:
                  - resultados
                properties:
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultadoSync'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'Falta `registros`, o no es un arreglo.'
      security:
        -
          tokenDispositivo: []
components:
  schemas:
    PaginacionLinks:
      title: 'Links de paginación'
      description: 'Links de navegación de la respuesta paginada estándar de Laravel.'
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          description: 'URL de la primera página.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=1'
        last:
          description: 'URL de la última página.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=3'
        prev:
          description: 'URL de la página anterior; null en la primera.'
          type: string
          example: null
          nullable: true
        next:
          description: 'URL de la página siguiente; null en la última.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=2'
          nullable: true
      type: object
    PaginacionMeta:
      title: 'Metadatos de paginación'
      description: 'Metadatos de la respuesta paginada estándar de Laravel.'
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          description: 'Página actual.'
          type: integer
          example: 1
        from:
          description: 'Posición del primer registro de la página; null si está vacía.'
          type: integer
          example: 1

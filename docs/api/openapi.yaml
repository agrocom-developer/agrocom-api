                tipo:
                  type: string
                  enum:
                    - identidad
                    - licencia_piloto
                    - habilitacion_dron
                    - seguro_responsabilidad
                    - registro_dron
                    - certificado_fumigacion
                    - antecedentes
                    - otro
                archivo:
                  type: string
                  format: binary
                vence_en:
                  type: string
                  format: date
                  nullable: true
              type: object
      responses:
        201:
          description: 'Documento cargado `en_revision`.'
          content:
            application/json:
              schema:
                required:
                  - documento
                properties:
                  documento:
                    $ref: '#/components/schemas/DocumentoProveedor'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no carga documentos.'
        404:
          description: 'El sujeto no existe o no es de esta cuenta.'
        422:
          description: 'Archivo o datos inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/proveedores/mi:
    get:
      tags:
        - Proveedores
      summary: 'Mi proveedor y su estado de verificación'
      description: 'El proveedor del que la cuenta es titular: estado de aprobación (con el motivo si fue rechazado o suspendido), los documentos obligatorios que aún no tienen uno aprobado y vigente, y si hoy puede recibir ofertas (`apto_para_ofertas`: aprobado y con al menos un equipo apto). La app lo consulta para mostrar «en revisión», «rechazado» o «listo para ponerte en línea». El piloto de un proveedor (por ejemplo, el piloto propio de Agrocom) lo consulta en solo lectura: recibe el proveedor al que pertenece, sin el documento fiscal, y `documentos_faltantes` son los suyos como piloto.'
      operationId: verMiProveedor
      responses:
        200:
          description: 'Perfil del proveedor.'

              schema:
                required:
                  - resultados
                properties:
                  resultados:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResultadoSync'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'Falta `registros`, o no es un arreglo.'
      security:
        -
          tokenDispositivo: []
  /api/clientes/registro:
    post:
      tags:
        - Clientes
      summary: 'Registro público de un cliente'
      description: 'Alta pública de un cliente: crea la cuenta (rol `cliente`) y su ficha. El cliente no pasa por aprobación: puede pedir servicios desde el primer momento. Una empresa debe enviar razón social y NIT. No devuelve token: la persona ingresa luego por `POST /api/auth/token`. Limita los intentos por IP: superado el límite responde 429.'
      operationId: registrarCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - tipo
                - nombre
                - username
                - password
                - telefono
              properties:
                tipo:
                  type: string
                  example: empresa
                  enum:
                    - persona
                    - empresa
                nombre:
                  description: 'Nombre de quien usa la cuenta.'
                  type: string
                  example: 'Rosa Condori Vargas'
                username:
                  description: 'Login (nunca un correo): letras, números, punto, guion.'
                  type: string
                  example: rosa.condori
                email:
                  type: string
                  format: email
                  nullable: true
                password:
                  description: 'Mínimo 8 caracteres con letras y números.'
                  type: string
                  format: password
                telefono:
                  type: string
                  example: '+591 76543210'
                razon_social:
                  description: 'Obligatoria para una empresa; si falta, se usa el nombre.'
                  type: string
                  nullable: true
                documento_fiscal:
                  description: 'Obligatorio para una empresa (NIT).'
                  type: string
                  nullable: true
                contactos:
                  description: 'Contactos de referencia. Una empresa que no los envía queda con quien registra la cuenta (`nombre` y `telefono`) como contacto principal.'
                  type: array
                  items:
                    $ref: '#/components/schemas/ContactoEntrada'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Cliente creado y activo.'
          content:
            application/json:
              schema:
                required:
                  - cliente
                properties:
                  cliente:
                    $ref: '#/components/schemas/Cliente'
                type: object
        422:
          description: 'Datos inválidos o login, correo o documento ya registrados.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        429:
          description: 'Demasiados registros desde la misma IP; reintentar tras `Retry-After` segundos.'
  /api/clientes/mi:
    get:

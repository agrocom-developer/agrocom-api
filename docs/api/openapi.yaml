        403:
          description: 'El rol del token no gestiona un proveedor.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Proveedores
      summary: 'Registra un piloto de mi proveedor'
      description: 'El titular de un proveedor `tercero` registra a un piloto suyo: crea la cuenta (rol `piloto`) y el piloto queda `pendiente` hasta que un administrador lo aprueba. El proveedor `independiente` es su propio piloto y no suma otros.'

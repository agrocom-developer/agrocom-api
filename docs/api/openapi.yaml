        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no gestiona un proveedor.'
        404:
          description: 'La cuenta no es titular de ningún proveedor.'
        422:
          description: 'El proveedor no está rechazado.'
          content:
            application/json:

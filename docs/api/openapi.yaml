            type: integer
      responses:
        200:
          description: Ofertas.
          content:
            application/json:
              schema:
                required:
                  - ofertas
                properties:
                  ofertas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'

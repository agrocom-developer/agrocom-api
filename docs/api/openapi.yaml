          content:
            application/json:
              schema:
                required:
                  - foto
                properties:
                  foto:
                    $ref: '#/components/schemas/FotoDeTerreno'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
        422:
          description: 'Archivo inválido, de 300 KB o más, o el terreno ya tiene el máximo de fotos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/terrenos/{id}/fotos/{foto}':
    delete:
      tags:
        - Terrenos
      summary: 'Borrar una foto del terreno'
      description: 'Borra una foto de un terreno propio.'
      operationId: borrarFotoDeTerreno
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
        -
          name: foto
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Foto borrada.'
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'La foto o el terreno no existen o son de otro cliente.'
      security:
        -
          tokenDispositivo: []
  '/api/terrenos/fotos/{foto}/archivo':
    get:
      tags:
        - Terrenos
      summary: 'Descargar una foto del terreno'
      description: 'El archivo de una foto de terreno. No lleva token: la URL es firmada y de corta vida (15 minutos), y solo la entregan el terreno del cliente dueño y el detalle de una solicitud abierta al piloto habilitado. Una firma inválida o vencida responde 403.'
      operationId: descargarFotoDeTerreno
      parameters:
        -
          name: foto
          in: path
          required: true
          schema:
            type: integer
        -
          name: expires
          in: query
          required: true
          schema:
            type: integer
        -
          name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'La imagen.'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        403:
          description: 'Firma inválida o vencida.'
        404:
          description: 'La foto ya no existe.'
  /api/zonas:
    get:
      tags:
        - Clientes
      summary: 'Catálogo de zonas'
      description: 'Zonas geográficas del marketplace con su centroide y radio, ordenadas por nombre. Sin autenticación: el registro de un proveedor las usa para elegir su zona base. Coordenadas y radio como string decimal.'
      operationId: listarZonas
      responses:
        200:
          description: Zonas.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      required:
                        - id
                        - nombre
                        - centroide_lat
                        - centroide_lng
                        - radio_km
                      properties:
                        id:
                          type: integer
                          example: 1
                        nombre:
                          type: string
                          example: 'Santa Cruz de la Sierra'
                        centroide_lat:
                          type: string
                          example: '-17.7833000'
                        centroide_lng:
                          type: string
                          example: '-63.1821000'
                        radio_km:
                          type: string
                          example: '40.0'
                      type: object
                type: object
components:
  schemas:
    CalificacionesDelServicio:
      title: 'Estado de la calificación de un servicio'
      description: 'A quiénes se puede calificar en el servicio, a quiénes ya se calificó y hasta cuándo.'
      required:
        - puede_calificar
        - plazo_dias
        - sujetos
        - etiquetas
      properties:
        puede_calificar:
          description: 'Verdadero si el servicio está completado, el plazo sigue abierto y falta calificar a alguien.'
          type: boolean
        vence_en:
          description: 'Cuándo vence el plazo; nulo si el servicio todavía no se completó.'
          type: string
          format: date-time
          nullable: true
        plazo_dias:
          type: integer
          example: 7
        sujetos:
          type: array
          items:
            required:
              - tipo
              - id
              - nombre
            properties:
              tipo:
                type: string
                enum:
                  - proveedor
                  - piloto
                  - auxiliar
                  - cliente
              id:
                type: integer
              nombre:
                type: string
              calificacion:
                nullable: true
                allOf:
                  -
                    $ref: '#/components/schemas/Calificacion'
            type: object
        etiquetas:
          description: 'Catálogo cerrado de etiquetas que puedes usar.'
          type: array
          items:
            type: string
      type: object
    Calificacion:
      title: Calificación
      description: 'Una calificación de un servicio completado (especificación §4.7, ADR 0031). Se escribe una vez y nunca se edita: moderar cambia el `estado`, no el contenido. El proveedor no ve las `oculta`; la que el proveedor escribe sobre el cliente es privada.'
      required:
        - id
        - uuid_cliente
        - solicitud_id
        - sujeto_tipo
        - sujeto_id
        - estrellas
        - etiquetas
        - estado
        - creada_en
      properties:
        id:
          type: integer
          example: 17
        uuid_cliente:
          description: 'Nace en el dispositivo; hace idempotente el reintento.'
          type: string
          format: uuid
        solicitud_id:
          type: integer
          example: 31
        sujeto_tipo:
          type: string
          enum:
            - proveedor
            - piloto
            - auxiliar
            - cliente
        sujeto_id:
          type: integer
          example: 4
        estrellas:
          type: integer
          example: 5
          maximum: 5
          minimum: 1
        etiquetas:
          description: 'Del catálogo cerrado: puntualidad, cobertura_pareja, comunicacion, cuidado_entorno, orden_lote, acceso_lote, claridad_pedido.'
          type: array
          items:
            type: string
        comentario:
          type: string
          nullable: true
        estado:
          type: string
          enum:
            - visible
            - en_moderacion
            - oculta
        creada_en:
          type: string
          format: date-time
      type: object
    PaginacionLinks:
      title: 'Links de paginación'
      description: 'Links de navegación de la respuesta paginada estándar de Laravel.'
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          description: 'URL de la primera página.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=1'
        last:
          description: 'URL de la última página.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=3'
        prev:
          description: 'URL de la página anterior; null en la primera.'
          type: string
          example: null
          nullable: true
        next:
          description: 'URL de la página siguiente; null en la última.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=2'
          nullable: true
      type: object
    PaginacionMeta:
      title: 'Metadatos de paginación'
      description: 'Metadatos de la respuesta paginada estándar de Laravel.'
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          description: 'Página actual.'
          type: integer
          example: 1
        from:
          description: 'Posición del primer registro de la página; null si está vacía.'
          type: integer
          example: 1
          nullable: true
        last_page:
          description: 'Última página disponible.'
          type: integer
          example: 3
        links:
          description: 'Elementos del paginador para renderizar la navegación.'
          type: array
          items:
            required:
              - url
              - label
              - page
              - active
            properties:
              url:
                type: string
                example: 'http://localhost:8000/api/solicitudes?page=1'
                nullable: true
              label:
                type: string
                example: '1'
              page:
                type: integer
                example: 1
                nullable: true
              active:
                type: boolean
                example: true
            type: object
        path:
          description: 'URL base del listado, sin query string.'
          type: string
          example: 'http://localhost:8000/api/solicitudes'
          nullable: true
        per_page:
          description: 'Registros por página.'
          type: integer
          example: 15
        to:
          description: 'Posición del último registro de la página; null si está vacía.'
          type: integer
          example: 15
          nullable: true
        total:
          description: 'Total de registros que matchean los filtros.'
          type: integer
          example: 42
      type: object
    ErrorValidacion:
      title: 'Error de validación'
      description: 'Respuesta 422 estándar de Laravel: un mensaje general y los mensajes por campo.'
      required:
        - message
        - errors
      properties:
        message:
          description: 'Mensaje general del primer error.'
          type: string
          example: 'El valor seleccionado para estado no es válido.'
        errors:
          description: 'Mensajes de validación agrupados por campo.'
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    Disputa:
      title: Disputa
      description: 'La disputa de un servicio (especificación §4.8, ADR 0033): una por solicitud. La abre el cliente (hasta 72 horas después de `ejecutada`) o el proveedor (cobro pendiente, acceso negado o calificación abusiva). Los importes son decimales exactos en string. `mensajes` y `resoluciones` solo viajan en el detalle. Los reembolsos se liquidan entre las partes fuera de la app.'
      required:
        - id
        - solicitud_id
        - abierta_por
        - motivo
        - detalle
        - monto_en_disputa
        - estado
        - ronda
        - creada_en
      properties:
        id:
          type: integer
          example: 9
        solicitud_id:
          type: integer
          example: 31
        abierta_por:
          type: string
          enum:
            - cliente
            - proveedor
        motivo:
          type: string
          enum:
            - cobertura_incompleta
            - mala_aplicacion
            - dano_a_cultivos_o_terceros
            - producto_distinto
            - equipo_ausente
            - evidencia_faltante
            - cobro_indebido
            - trato_inadecuado
            - cobro_pendiente
            - acceso_negado
            - calificacion_abusiva
        detalle:
          type: string
        monto_en_disputa:
          type: string
          example: '12000.00'
        estado:
          type: string
          enum:
            - abierta
            - en_revision
            - resuelta
            - retirada
        ronda:
          description: '1 es la disputa original; 2, la apelación (una sola vez).'
          type: integer
          enum:
            - 1
            - 2
        responde_antes_de:
          description: 'Hasta cuándo responde la contraparte (48 horas por defecto).'
          type: string
          format: date-time
          nullable: true
        apelable_hasta:
          description: 'Hasta cuándo se puede apelar la resolución (7 días); nulo si no hay resolución apelable.'
          type: string
          format: date-time
          nullable: true
        creada_en:
          type: string
          format: date-time
        mensajes:
          type: array
          items:
            required:
              - id
              - autor_rol
              - tipo
              - texto
              - creado_en
            properties:
              id:
                type: integer
              autor_rol:
                type: string
                enum:
                  - cliente
                  - proveedor
                  - soporte
              tipo:
                type: string
                enum:
                  - mensaje
                  - informacion
                  - apelacion
              texto:
                type: string
              creado_en:
                type: string
                format: date-time
            type: object
        resoluciones:
          description: 'La decisión del administrador es un registro nuevo; la apelación agrega una segunda y la última rige.'
          type: array
          items:
            required:
              - ronda
              - resultado
              - monto_reembolso
              - motivo
              - derivada_a_seguro
              - resuelta_en
            properties:
              ronda:
                type: integer
              resultado:
                type: string
                enum:
                  - a_favor_cliente
                  - a_favor_proveedor
                  - parcial
                  - sin_lugar
              monto_reembolso:
                type: string
                example: '6000.00'
              motivo:
                type: string
              derivada_a_seguro:
                description: 'El daño probado se deriva al seguro del proveedor; Agrocom facilita el expediente.'
                type: boolean
              resuelta_en:
                type: string
                format: date-time
            type: object
      type: object
    VersionApk:
      title: 'Versión del APK'
      description: 'Versión autorizada del APK de agrocom-field, con la URL de su release (HU-20).'
      required:
        - version
        - version_code
        - url_descarga
      properties:
        version:
          description: 'Versión SemVer.'
          type: string
          example: 1.4.2
        version_code:
          description: 'Código de versión de Android.'
          type: integer
          example: 14002
        url_descarga:
          description: 'URL del release del `.apk` publicado en agrocom-field (GitHub Releases).'
          type: string
          format: uri
      type: object
    FotoDeDron:
      title: 'Foto de un dron'
      required:
        - id
        - dron_id
        - tipo
        - estado
        - url
      properties:
        id:
          description: "Fotos del dron (`negociacion-contrato.md` §9): el proveedor las sube y el administrador las\naprueba; el cliente ve las aprobadas al comparar ofertas. Requieren red."
          type: integer
        dron_id:
          type: integer
        tipo:
          type: string
          enum:
            - frontal
            - lateral
            - placa_serie
            - otra
        estado:
          type: string
          enum:
            - en_revision
            - aprobada
            - rechazada
        motivo:
          description: 'Motivo del rechazo.'
          type: string
          nullable: true
        url:
          description: 'Se pide con el mismo token.'
          type: string
          example: /api/drones/fotos/5/archivo
      type: object
    Dron:
      title: Dron
      description: 'El vehículo del marketplace, con dueño y operador (ADR 0029). Necesita aprobación de un administrador antes de recibir ofertas. Capacidad y ancho de pasada viajan como string decimal.'
      required:
        - id
        - dueno_proveedor_id
        - operador_proveedor_id
        - marca
        - modelo
        - numero_serie
        - capacidad_tanque_l
        - ancho_pasada_m
        - ciclos_bateria
        - estado
        - origen
      properties:
        id:
          type: integer
          example: 9
        dueno_proveedor_id:
          type: integer
          example: 12
        operador_proveedor_id:
          type: integer
          example: 12
        marca:
          type: string
          example: DJI
        modelo:
          type: string
          example: 'Agras T40'
        numero_serie:
          type: string
          example: 1WNDH2K00A0001
        anio:
          description: 'Año del dron; el cliente lo ve al comparar ofertas.'
          type: integer
          example: 2024
          nullable: true
        capacidad_tanque_l:
          type: string
          example: '40.00'
        ancho_pasada_m:
          type: string
          example: '11.00'
        ciclos_bateria:
          description: 'Único dato de mantenimiento que se conserva; sube con cada recarga registrada en el lote.'
          type: integer
          example: 118
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
        origen:
          type: string
          example: externo
          enum:
            - flota_agrocom
            - vendido_por_agrocom
            - externo
      type: object
    Equipo:
      title: Equipo
      description: 'Combinación operativa piloto + dron (+ auxiliar) que ejecuta una solicitud. Un piloto y un dron no pueden estar en dos equipos vigentes a la vez.'
      required:
        - id
        - proveedor_id
        - piloto_id
        - dron_id
        - vigente_desde
      properties:
        id:
          type: integer
          example: 3
        proveedor_id:
          type: integer
          example: 12
        piloto_id:
          type: integer
          example: 5
        dron_id:
          type: integer
          example: 9
        auxiliar_id:
          type: integer
          nullable: true
        vigente_desde:
          type: string
          format: date
          example: '2026-11-23'
        vigente_hasta:
          description: 'null = sin fin.'
          type: string
          format: date
          nullable: true
      type: object
    Mensaje:
      title: 'Mensaje del chat'
      description: 'Tres tipos: `texto`; `foto` (`url` apunta al archivo privado, `texto` es el pie y puede ir vacío); `sistema` (`evento` dice qué pasó: `solicitud_adjudicada`, `servicio_iniciado`, `servicio_finalizado` o `precio_final_confirmado`; `autor_rol` es `sistema`, `propio` es falso y nunca se marca como leído).'
      required:
        - id
        - uuid_cliente
        - solicitud_id
        - autor_rol
        - propio
        - tipo
        - texto
        - creado_en
      properties:
        id:
          description: 'Crece con el orden de creación; es el cursor.'
          type: integer
          example: 120
        uuid_cliente:
          type: string
          format: uuid
        solicitud_id:
          type: integer
        autor_rol:
          type: string
          enum:
            - cliente
            - proveedor
            - sistema
        propio:
          description: 'Verdadero si lo escribió la cuenta que consulta.'
          type: boolean
        tipo:
          type: string
          enum:
            - texto
            - foto
            - sistema
        evento:
          description: 'Solo en los mensajes de sistema.'
          type: string
          nullable: true
          enum:
            - solicitud_adjudicada
            - servicio_iniciado
            - servicio_finalizado
            - precio_final_confirmado
        texto:
          description: 'El texto, el pie de la foto (puede ir vacío) o la línea del evento, ya en español.'
          type: string
          example: 'Llego el lunes temprano.'
        url:
          description: 'Solo en las fotos: ruta autenticada del archivo.'
          type: string
          example: /api/mensajes/121/archivo
          nullable: true
        bytes:
          description: 'Peso de la foto.'
          type: integer
          nullable: true
        leido_en:
          type: string
          format: date-time
          nullable: true
        creado_en:
          type: string
          format: date-time
      type: object
    SolicitudAbierta:
      title: 'Solicitud abierta (mapa)'
      description: 'Lo que un piloto ve de una solicitud antes de ofertar. Nunca incluye nombre, teléfono, documento ni dirección del cliente, ni los precios de las ofertas de otros proveedores.'
      required:
        - id
        - hectareas_solicitadas
        - precio_ha_propuesto
        - ofertas_vigentes
      properties:
        id:
          description: "El mapa de solicitudes abiertas del piloto (`negociacion-contrato.md` §8): todas las\nsolicitudes `abierta` y `con_ofertas` de Santa Cruz con filtros del usuario, sin radio\nfijo de operación y sin datos privados del cliente. Requiere red."
          type: integer
          example: 31
        centro:
          description: 'Centroide de los lotes.'
          properties:
            latitud:
              type: number
              example: -17.7833
            longitud:
              type: number
              example: -63.1821
          type: object
          nullable: true
        hectareas_solicitadas:
          type: string
          example: '80.0000'
        precio_ha_propuesto:
          type: string
          example: '125.0000'
        zona:
          type: string
          example: Warnes
          nullable: true
        zona_id:
          type: integer
          nullable: true
        macrorregion:
          type: string
          nullable: true
          enum:
            - cercado
            - norte_integrado
            - chiquitania
            - valles
            - chaco
        cultivo:
          type: string
          nullable: true
        tipo_aplicacion:
          type: string
        ventana_desde:
          type: string
          format: date
        ventana_hasta:
          type: string
          format: date
        ofertas_vigentes:
          description: 'Cuántas ofertas vigentes tiene (sin sus precios).'
          type: integer
        mi_negociacion:
          description: 'Estado de la última oferta de mi proveedor, o null si no oferté.'
          type: string
          nullable: true
        distancia_km:
          description: 'Solo si se envían `lat` y `lon`; esas coordenadas no se guardan.'
          type: string
          nullable: true
        publicada_en:
          type: string
          format: date-time
          nullable: true
        vence_en:
          type: string
          format: date-time
          nullable: true
        producto_indicado:
          description: 'Solo en el detalle.'
          type: string
        aporta_producto:
          description: 'Solo en el detalle.'
          type: string
        urgente:
          description: 'Solo en el detalle.'
          type: boolean
        observaciones:
          description: 'Solo en el detalle.'
          type: string
          nullable: true
        terreno:
          description: 'Solo en el detalle: nombre, hectáreas, `geometria` GeoJSON de los lotes, referencias de acceso, colindantes sensibles, acceso difícil y `fotos` del estado del terreno con URL firmada de corta vida (se piden sin token).'
          type: object
          nullable: true
      type: object
    Oferta:
      title: 'Oferta o contraoferta'
      description: 'El precio por hectárea que una parte pone sobre una solicitud. El autor alterna: número impar es del proveedor, par es del cliente. El cliente la recibe además con `proveedor` (calificación, tasa de cancelación, dron y fotos aprobadas) y, en el comparador, con `historial`.'
      required:
        - id
        - uuid_cliente
        - solicitud_id
        - numero
        - autor
        - tipo
        - precio_ha
        - monto_estimado
        - estado
        - es_definitiva
        - vence_en
      properties:
        id:
          description: "Ofertas y contraofertas (`negociacion-contrato.md` §2 y §3). Requieren red: la\nnegociación es una conversación entre dos personas y no pasa por el outbox. Adaptador\ndelgado (ADR 0008): el lado (cliente o proveedor) lo decide el rol del token; el\nalcance y las reglas viven en los casos de uso. Una oferta ajena responde 404."
          type: integer
          example: 41
        uuid_cliente:
          type: string
          format: uuid
        solicitud_id:
          type: integer
          example: 31
        proveedor_id:
          type: integer
          example: 3
        equipo_id:
          type: integer
          nullable: true
        numero:
          description: 'Posición en la negociación: 1 es la primera oferta del proveedor.'
          type: integer
          example: 1
        autor:
          type: string
          enum:
            - proveedor
            - cliente
        tipo:
          type: string
          enum:
            - acepta_propuesta
            - contraoferta
        precio_ha:
          type: string
          example: '118.0000'
        monto_estimado:
          description: 'Hectáreas solicitadas por este precio.'
          type: string
          example: '9440.00'
        estado:
          type: string
          enum:
            - vigente
            - aceptada
            - reemplazada
            - rechazada
            - retirada
            - vencida
            - cerrada
        es_definitiva:
          description: 'La última de la negociación: solo se acepta o se rechaza.'
          type: boolean
        nota:
          type: string
          nullable: true
        oferta_anterior_id:
          type: integer
          nullable: true
        distancia_km:
          type: string
          example: '42.50'
          nullable: true
        vence_en:
          type: string
          format: date-time
        respondida_en:
          type: string
          format: date-time
          nullable: true
        creada_en:
          type: string
          format: date-time
          nullable: true
        zona:
          description: 'Solo para el proveedor: nombre de la zona de la solicitud.'
          type: string
          example: 'Valle de Culiacán'
          nullable: true
        zona_id:
          description: 'Solo para el proveedor: id de la zona de la solicitud.'
          type: integer
          nullable: true
        lote:
          description: 'Solo para el proveedor: nombre del lote del cliente. Viene solo cuando la solicitud quedó adjudicada a ese proveedor; antes es `null`.'
          type: string
          example: 'Lote Norte'
          nullable: true
        proveedor:
          description: 'Solo para el cliente: `nombre`, `foto_url` (foto de perfil del piloto del equipo o del titular, URL firmada de corta vida que se pide sin token; `null` si no hay), calificación, tasa de cancelación y dron con fotos aprobadas.'
          type: object
          nullable: true
        historial:
          description: 'Solo en el comparador del cliente: las ofertas de esa negociación.'
          type: array
          items:
            type: object
          nullable: true
      type: object
    PagoConfirmado:
      title: 'Pago confirmado por el proveedor'
      description: 'Registro informativo: el pago ocurrió fuera de la aplicación y lo informa el proveedor. `monto` es el monto final del servicio al momento de confirmar.'
      required:
        - id
        - uuid_cliente
        - solicitud_id
        - monto
        - confirmado_en
      properties:
        id:
          description: "Confirmación del pago fuera de la aplicación (ADR 0034). El proveedor informa que\nrecibió el pago; el cliente solo lo consulta. No procesa cobros ni cambia el estado."
          type: integer
        uuid_cliente:
          type: string
          format: uuid
        solicitud_id:
          type: integer
        monto:
          type: string
          example: '9440.00'
        metodo:
          type: string
          nullable: true
          enum:
            - efectivo
            - transferencia
            - qr
            - otro
        nota:
          type: string
          nullable: true
        confirmado_en:
          type: string
          format: date-time
      type: object
    PrecioFinal:
      title: 'Precio final del servicio y su confirmación'
      description: 'Los valores del cierre del piloto. `confirmado` pasa a `true` cuando el cliente lo confirma; `confirmado_en` es nulo hasta entonces.'
      required:
        - hectareas_ejecutadas
        - precio_ha_acordado
        - monto_final
        - confirmado
        - confirmado_en
      properties:
        hectareas_ejecutadas:
          description: "Precio final del servicio: lo calcula el cierre del piloto (hectáreas ejecutadas por precio\nacordado) y el cliente, que es quien paga, tiene la última palabra: lo confirma aquí o abre\nuna disputa. No procesa cobros ni cambia el estado (ADR 0034)."
          type: string
          example: '78.5000'
        precio_ha_acordado:
          type: string
          example: '118.0000'
        monto_final:
          type: string
          example: '9263.00'
        confirmado:
          type: boolean
        confirmado_en:
          type: string
          format: date-time
          nullable: true
      type: object
    PreferenciasDeAviso:
      title: 'Preferencias de aviso'
      required:
        - nuevas_solicitudes
        - ofertas
        - mensajes
        - avance
        - calificaciones
      properties:
        nuevas_solicitudes:
          description: 'Solo aplica a cuentas de proveedor. `zonas` y `macrorregiones` vacías significan todas.'
          properties:
            activo:
              description: "Preferencias de aviso (`negociacion-contrato.md` §7): el piloto activa o desactiva los\navisos de nuevas solicitudes en sus zonas (el incentivo para recibir ofertas de\ntrabajo) y cada cuenta elige qué categorías recibe. Las obligatorias no se apagan."
              type: boolean
              example: true
            zonas:
              type: array
              items:
                type: integer
              example:
                - 3
                - 7
            macrorregiones:
              type: array
              items:
                type: string
                enum:
                  - cercado
                  - norte_integrado
                  - chiquitania
                  - valles
                  - chaco
              example:
                - chiquitania
            hectareas_minimas:
              type: string
              example: '50.0000'
              nullable: true
          type: object
        ofertas:
          type: boolean
        mensajes:
          type: boolean
        avance:
          type: boolean
        calificaciones:
          type: boolean
      type: object
    RegistroDeAvance:
      title: 'Registro de seguimiento'
      description: 'Un registro del piloto: `inicio`, `avance` o `cierre`. Nace en el dispositivo con su `uuid_cliente`, así que aplicarlo dos veces deja la base idéntica.'
      required:
        - id
        - uuid_cliente
        - tipo
        - registrado_en
      properties:
        id:
          description: "La ejecución del servicio (`negociacion-contrato.md` §4 y §6): el piloto marca el inicio,\nsube fotos y marca el avance, y cierra; el cliente ve el avance, las fotos y la última\nubicación del piloto. Los registros del piloto son idempotentes por `uuid_cliente`, para\nque la app los encole en el outbox y los reintente sin duplicar. La ubicación no va por\nel outbox: sin red, se omite."
          type: integer
        uuid_cliente:
          type: string
          format: uuid
        tipo:
          type: string
          enum:
            - inicio
            - avance
            - cierre
        hectareas_ejecutadas:
          type: string
          example: '40.0000'
          nullable: true
        porcentaje:
          type: string
          example: '50.00'
          nullable: true
        nota:
          type: string
          nullable: true
        registrado_en:
          type: string
          format: date-time
      type: object
    ErrorConflicto:
      title: 'Conflicto de estado'
      description: 'La acción ya no es posible por el estado actual (otra parte decidió antes, venció, etc.). `codigo` es estable y es lo que la app traduce a su pantalla.'
      required:
        - message
        - codigo
      properties:
        message:
          description: "Traduce una regla de negociación incumplida a su respuesta HTTP: 404 si el recurso no es\nde la cuenta (invariante 5), 403 si la cuenta no está habilitada, 409 con `codigo` si el\nestado ya no admite la acción (carreras, vencimientos) y 422 con el campo si el dato es inválido."
          type: string
          example: 'La oferta ya no está vigente.'
        codigo:
          type: string
          example: oferta_no_vigente
      type: object
    DispositivoPush:
      title: 'Token de push registrado'
      required:
        - id
        - plataforma
        - registrado_en
      properties:
        id:
          description: "Token de push del aparato de la cuenta (`negociacion-contrato.md` §7). Cualquier\ncuenta con sesión registra y retira los suyos: el alcance sale del token de la\nsesión, nunca del cuerpo, y retirar el token de otra cuenta responde 404."
          type: integer
          example: 14
        plataforma:
          type: string
          enum:
            - android
            - ios
        registrado_en:
          type: string
          format: date-time
          nullable: true
      type: object
    Auxiliar:
      title: Auxiliar
      description: 'Quien prepara la mezcla y asiste en el lote. Lo registra un piloto o el proveedor y lo aprueba un administrador (ADR 0032).'
      required:
        - id
        - proveedor_id
        - usuario_id
        - nombre
        - estado
      properties:
        id:
          type: integer
          example: 8
        proveedor_id:
          type: integer
          example: 12
        usuario_id:
          type: integer
          example: 34
        nombre:
          type: string
          example: 'Lucía Flores'
        registrado_por_piloto_id:
          type: integer
          nullable: true
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
      type: object
    DocumentoProveedor:
      title: 'Documento de verificación'
      description: 'Documento con vencimiento de un proveedor, piloto, auxiliar o dron. El archivo no se descarga por la API.'
      required:
        - id
        - sujeto_tipo
        - sujeto_id
        - tipo
        - estado
      properties:
        id:
          description: "Nunca expone `archivo_ref`: el archivo es privado y solo lo ven\nadministradores y soporte desde el panel (política de verificación)."
          type: integer
          example: 40
        sujeto_tipo:
          type: string
          example: piloto
          enum:
            - proveedor
            - piloto
            - auxiliar
            - dron
        sujeto_id:
          type: integer
          example: 5
        tipo:
          type: string
          example: licencia_piloto
          enum:
            - identidad
            - licencia_piloto
            - habilitacion_dron
            - seguro_responsabilidad
            - registro_dron
            - certificado_fumigacion
            - antecedentes
            - otro
        estado:
          type: string
          example: en_revision
          enum:
            - en_revision
            - aprobado
            - rechazado
            - vencido
        vence_en:
          type: string
          format: date
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        nombre_original:
          type: string
          nullable: true
        bytes:
          type: integer
          example: 182044
        subido_en:
          type: string
          format: date-time
      type: object
    Piloto:
      title: Piloto
      description: 'Quien opera el dron dentro de un proveedor. Comparte el ciclo de aprobación (ADR 0032).'
      required:
        - id
        - proveedor_id
        - usuario_id
        - nombre
        - licencia_numero
        - licencia_vence
        - categoria_habilitacion
        - estado
      properties:
        id:
          description: 'El nombre no es columna de `prv_pilotos` (vive en la cuenta): quien arma la respuesta lo resuelve por lote.'
          type: integer
          example: 5
        proveedor_id:
          type: integer
          example: 12
        usuario_id:
          type: integer
          example: 31
        nombre:
          type: string
          example: 'Marcelo Terrazas'
        licencia_numero:
          type: string
          example: RPA-2291
        licencia_vence:
          type: string
          format: date
          example: '2027-06-30'
        categoria_habilitacion:
          type: string
          example: 'RPAS agrícola'
        estado:
          type: string
          example: aprobado
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
      type: object
    Proveedor:
      title: Proveedor
      description: 'Entidad que presta el servicio y recibe ofertas (ADR 0028). Nace `pendiente`; solo un administrador la aprueba.'
      required:
        - id
        - tipo
        - razon_social
        - estado
      properties:
        id:
          type: integer
          example: 12
        tipo:
          description: '`propio` (Agrocom), `independiente` o `tercero`.'
          type: string
          example: tercero
          enum:
            - propio
            - independiente
            - tercero
        razon_social:
          type: string
          example: 'Fumigaciones del Oriente SRL'
        documento_fiscal:
          type: string
          example: '1023456028'
          nullable: true
        telefono:
          type: string
          example: '+591 70012345'
          nullable: true
        zona_base_id:
          type: integer
          example: 2
          nullable: true
        radio_operacion_km:
          description: 'Decimal exacto en string.'
          type: string
          example: '80.0'
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          description: 'Motivo del último rechazo, suspensión o baja; null si no aplica.'
          type: string
          example: null
          nullable: true
        aprobado_en:
          type: string
          format: date-time
          nullable: true
        calificacion_promedio:
          description: 'Decimal exacto en string (0 a 5).'
          type: string
          example: '4.80'
        calificaciones_conteo:
          type: integer
          example: 17
      type: object
    Dispositivo:
      title: 'Dispositivo con sesión'
      description: 'Dispositivo de campo con una sesión viva (HU-03). El token en sí nunca se devuelve.'
      required:
        - id
        - uuid_dispositivo
        - nombre_dispositivo
        - rol
        - last_used_at
        - created_at
      properties:
        id:
          description: 'Identificador del token de dispositivo.'
          type: integer
          example: 1
        uuid_dispositivo:
          description: 'UUID generado por el dispositivo.'
          type: string
          format: uuid
          example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
        nombre_dispositivo:
          description: 'Nombre legible informado por la app.'
          type: string
          example: 'Moto G84 — piloto 2'
          nullable: true
        rol:
          $ref: '#/components/schemas/RolActivo'
        last_used_at:
          description: 'Último request autenticado con este token.'
          type: string
          format: date-time
          nullable: true
        created_at:
          description: 'Cuándo se emitió el token.'
          type: string
          format: date-time
      type: object
    RolActivo:
      title: Rol
      description: 'Rol bajo el que opera una sesión de la app de campo.'
      required:
        - id
        - name
        - description
      properties:
        id:
          description: "Rol tal como lo ve la app de campo. Es el rol ÚNICO bajo el que opera la\nsesión —del token o del selector—, nunca una lista de permisos efectivos\n(invariante 10 de CLAUDE.md): los permisos se resuelven en el servidor\ncontra la base en cada request, no se le entregan a la app para que decida\nsola."
          type: integer
          example: 1
        name:
          description: 'Nombre interno del rol.'
          type: string
          example: piloto
        description:
          description: 'Descripción legible del rol.'
          type: string
          example: 'Piloto de dron: ejecuta sesiones de vuelo en campo.'
          nullable: true
      type: object
    UsuarioCampo:
      title: 'Usuario de campo'
      description: 'Cuenta con la que opera la app de campo.'
      required:
        - id
        - name
        - username
        - persona_id
      properties:
        id:
          description: "Identidad del operario tal como la necesita la app de campo: lo justo para\nsaludarlo y para saber a qué persona operativa corresponde.\n\n`persona_id` viaja como ID pelado (ADR 0003, regla 3): el detalle de la\npersona pertenece al módulo `Personal` y la app lo resuelve desde su\ncatálogo sincronizado, no anidado acá."
          type: integer
          example: 7
        name:
          description: 'Nombre para mostrar.'
          type: string
          example: 'Camila Rojas'
        username:
          description: 'Identificador de login (nunca un correo).'
          type: string
          example: camila.rojas
        persona_id:
          description: 'Persona operativa enlazada (módulo Personal, solo ID).'
          type: integer
          example: 3
          nullable: true
        foto_url:
          description: 'Foto de perfil de la cuenta: URL firmada y de corta vida (se pide sin token); `null` si no tiene.'
          type: string
          example: '/api/personas/7/foto?expires=1764000000&signature=ab12'
          nullable: true
      type: object
    PersonaCatalogo:
      title: 'Persona operativa (catálogo)'
      description: 'Persona vigente (no borrada) para el pull de catálogo (especificación §4.3).'
      required:
        - id
        - nombre
        - rol
        - base_id
        - activo
        - updated_at
      properties:
        id:
          description: "Adaptador delgado (ADR 0008): valida la query string, invoca el caso de\nuso y devuelve la respuesta — ninguna regla de negocio vive acá."
          type: integer
          example: 5
        nombre:
          type: string
          example: 'Piloto Uno'
        rol:
          type: string
          example: piloto
        base_id:
          type: integer
          example: 1
          nullable: true
        activo:
          type: boolean
          example: true
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
      type: object
    TerrenoServicioCatalogo:
      title: 'Terreno de un servicio (catálogo)'
      description: 'El terreno sobre el que se ejecuta el servicio: dónde volar y qué cuidar. Hectáreas como decimal exacto en string (invariante 6).'
      required:
        - nombre
        - hectareas
        - acceso_dificil
      properties:
        nombre:
          type: string
          example: 'Lote Norte'
        hectareas:
          type: string
          example: '120.5000'
        geometria:
          description: 'Polígono GeoJSON, o null si no está cargado.'
          type: object
          nullable: true
        referencias_acceso:
          type: string
          nullable: true
        colindantes_sensibles:
          description: 'Apiarios, cultivos orgánicos, viviendas.'
          type: string
          nullable: true
        acceso_dificil:
          type: boolean
          example: false
      type: object
    ServicioAsignadoCatalogo:
      title: 'Servicio asignado (catálogo)'
      description: 'Solicitud de servicio aceptada que el equipo del operario lleva al lote (ADR 0037). Solo estados de ejecución: `asignada`, `en_camino`, `en_ejecucion` o `suspendida_por_clima`. FILTRADO por el operario del token: solo los servicios de los equipos de flota en los que su cuenta es piloto o auxiliar con vigencia HOY; una cuenta sin equipo recibe la lista vacía. El `id` es el `solicitud_id` que la app envía en el registro `trabajo` de `POST /api/sync`. Sin datos de contacto del cliente. Límite conocido del cursor: si el operario entra a un equipo nuevo, los servicios de ese equipo que no cambiaron desde el último pull no llegan en el incremental; los trae un pull completo (`desde` vacío).'
      required:
        - id
        - uuid_cliente
        - estado
        - equipo_id
        - tipo_aplicacion
        - hectareas_solicitadas
        - producto_indicado
        - aporta_producto
        - ventana_desde
        - ventana_hasta
        - urgente
        - terreno
        - updated_at
      properties:
        id:
          type: integer
          example: 31
        uuid_cliente:
          type: string
          example: 9a1b7e3e-2f7a-4b3d-8c1e-6f2a1d9c4b0a
        estado:
          type: string
          example: adjudicada
          enum:
            - adjudicada
            - en_ejecucion
        equipo_id:
          type: integer
          example: 7
        tipo_aplicacion:
          type: string
          enum:
            - herbicida
            - insecticida
            - fungicida
            - fertilizante_foliar
            - desecante
            - otro
        hectareas_solicitadas:
          type: string
          example: '80.0000'
        cultivo:
          type: string
          example: Soya
          nullable: true
        producto_indicado:
          type: string
          example: 'Glifosato 480 SL, 2 L/ha'
        aporta_producto:
          type: string
          enum:
            - cliente
            - proveedor
        ventana_desde:
          type: string
          format: date
          example: '2026-12-01'
        ventana_hasta:
          type: string
          format: date
          example: '2026-12-10'
        urgente:
          type: boolean
          example: false
        observaciones:
          type: string
          nullable: true
        terreno:
          $ref: '#/components/schemas/TerrenoServicioCatalogo'
        precio_ha_propuesto:
          description: 'Lo que propuso el cliente al abrir la solicitud.'
          type: string
          example: '125.0000'
          nullable: true
        precio_ha_acordado:
          description: 'El precio de la oferta adjudicada.'
          type: string
          example: '118.0000'
          nullable: true
        hectareas_ejecutadas:
          type: string
          example: '51.2000'
          nullable: true
        porcentaje_avance:
          type: string
          example: '64.00'
          nullable: true
        contacto:
          description: 'La persona de contacto de la solicitud (nombre y teléfono) y, si el cliente es una empresa, su razón social: se entregan solo tras adjudicar. Las solicitudes sin contacto elegido traen el nombre y el teléfono del cliente.'
          properties:
            nombre:
              type: string
            telefono:
              type: string
              nullable: true
            cargo:
              type: string
              nullable: true
            empresa:
              type: string
              nullable: true
          type: object
          nullable: true
        updated_at:
          description: 'Posición del cursor de esta sección.'
          type: string
          format: date-time
          example: '2026-12-01T12:00:00+00:00'
      type: object
    ServicioRetiradoCatalogo:
      title: 'Servicio retirado (catálogo)'
      description: 'Servicio que el equipo del operario tuvo y ya no debe llevar al lote. La app lo OCULTA, no lo borra: puede tener trabajo capturado sin sincronizar. `motivo`: `cancelada`, `reasignada` (volvió a asignación: el proveedor canceló o soporte lo reasignó) o `ejecutada` (cerrado por el servidor, a la espera de conformidad o terminado). Un servicio nunca viaja a la vez en `servicios_asignados` y acá.'
      required:
        - id
        - uuid_cliente
        - motivo
        - updated_at
      properties:
        id:
          type: integer
          example: 31
        uuid_cliente:
          type: string
          example: 9a1b7e3e-2f7a-4b3d-8c1e-6f2a1d9c4b0a
        motivo:
          type: string
          example: cancelada
          enum:
            - cancelada
            - reasignada
            - ejecutada
        updated_at:
          description: 'Posición del cursor de esta sección.'
          type: string
          format: date-time
          example: '2026-12-02T11:00:00+00:00'
      type: object
    LimitesCondicionesCatalogo:
      title: 'Límites de condiciones de vuelo (catálogo)'
      description: 'Los límites con los que el servidor valida el registro `condiciones` de `POST /api/sync` (especificación §9.2); la app, que es offline, los muestra para que lo que ve y lo que se exige nunca se contradigan. DECIMAL como string (invariante 6). `viento_max_kmh`, `temperatura_max_c` y `humedad_max_pct` siempre traen valor; los demás son `null` si el sistema no fija un límite, y la app no debe aplicarlo.'
      required:
        - viento_max_kmh
        - temperatura_max_c
        - humedad_max_pct
      properties:
        humedad_min_pct:
          type: string
          nullable: true
        viento_max_kmh:
          type: string
          example: '17.00'
        temperatura_max_c:
          type: string
          example: '30.00'
        humedad_max_pct:
          type: string
          example: '90.00'
        altura_vuelo_m:
          type: string
          nullable: true
        velocidad_vuelo_kmh:
          type: string
          nullable: true
        ancho_pasada_m:
          type: string
          nullable: true
      type: object
    RegistroSync:
      title: 'Registro de entrada del lote de sync'
      description: 'Un elemento del arreglo `registros`. La forma exacta de los campos depende de `tipo`; un registro con datos incompletos o inválidos se responde `rechazado` sin frenar el resto del lote — nunca un 422 para el lote completo. `cierre_trabajo`/`cierre_sesion` (HU-05) MUTAN una fila existente en vez de crear una nueva: `uuid_cliente` identifica el EVENTO de cierre — distinto del `uuid_cliente` de apertura del trabajo/sesión que referencian. Trabajo dado de baja por el panel mientras se volaba (2/10/2026): lo ya en curso se registra igual — `cierre_trabajo`, y `cierre_sesion`/`condiciones`/`incidencia`/`recarga` de una sesión que ya existía, con los límites con los que el equipo salió —, el trabajo sigue dado de baja; nada nuevo: `sesion`, `recepcion_caldo` y `evidencia_equipo` sobre ese trabajo se rechazan con `trabajo_no_existe_aun`, y `mezcla` con el `trabajo_no_existe` de Mezclas. `recepcion_caldo` (HU-10 redefinida por CR-01, tarea 18) registra volumen de caldo entregado por el cliente — nunca su composición: eso es lo que ahora registra `mezcla` por separado (ver abajo), no `recepcion_caldo`. `mezcla` (especificación §4.6) registra qué productos y en qué cantidad se cargaron en el caldo al crear una aplicación — cabecera (`trabajo_uuid_cliente`, `hora`) más una lista `productos` (nombre de texto libre, cantidad, unidad); nunca dosis por hectárea, orden de incorporación ni compatibilidad entre productos (especificación §4.6). `incidencia` (HU-08, tarea 22) registra un evento puntual de la sesión (caldo/ESC/batería/mecánica/clima/otro) con foto SIEMPRE obligatoria, referenciada por `uuid_cliente` a una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_incidencia`. `recarga` (HU-13, tarea 23) registra cada ciclo de cambio de batería/recarga de caldo durante el vuelo — temperatura de batería > 50°C se persiste con `alerta_temperatura = true` sin rechazar el registro; independiente del evento `mezcla` (sin vínculo entre ambos en esta tarea). `trabajo` abre la ejecución de una solicitud de servicio aceptada: referencia la `solicitud_id` del servicio asignado del catálogo (ADR 0037) y se rechaza si la solicitud no tiene equipo asignado o ya terminó; al abrirse el primero, la solicitud pasa a `en_ejecucion`, y al cerrarse los trabajos que cubren lo pedido, a `ejecutada`. `evidencia_equipo` (HU-80, tarea 86) registra el "Reporte de Equipos": horas de vuelo declaradas del dron y las tres fotos de chequeo (control, ciclo de batería y balanceo, dron limpio), cada una referenciada por `uuid_cliente` a una evidencia ya subida por `POST /api/evidencias` — las tres son obligatorias, falta cualquiera y se rechaza el registro completo.'
      required:
        - tipo
        - uuid_cliente
      properties:
        tipo:
          description: "Adaptador delgado (ADR 0008): valida el sobre del lote, invoca el caso de\nuso y devuelve la respuesta — ninguna regla de negocio vive acá."
          type: string
          example: trabajo
          enum:
            - trabajo
            - recepcion_caldo
            - evidencia_equipo
            - mezcla
            - sesion
            - condiciones
            - incidencia
            - recarga
            - cierre_trabajo
            - cierre_sesion
        uuid_cliente:
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000001
        solicitud_id:
          description: '`trabajo`: id de servidor de la solicitud de servicio (`id` de `servicios_asignados` del pull de catálogo).'
          type: integer
          example: 31
        trabajo_uuid_cliente:
          description: '`sesion`/`cierre_trabajo`/`recepcion_caldo`/`evidencia_equipo`/`mezcla`: `uuid_cliente` de apertura del trabajo — nunca el id de servidor, que puede no existir todavía si el trabajo llegó en este mismo lote.'
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000001
        sesion_uuid_cliente:
          description: '`cierre_sesion`/`condiciones`/`incidencia`: `uuid_cliente` de apertura de la sesión referenciada.'
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000002
        secuencia:
          description: '`sesion`: orden de apertura. `recarga`: orden de la recarga dentro de la sesión.'
          type: integer
          example: 1
        piloto_id:
          description: '`sesion`: id de servidor de la persona (del pull de catálogo).'
          type: integer
          example: 5
        auxiliar_id:
          description: '`sesion`, opcional.'
          type: integer
          example: null
          nullable: true
        dron_id:
          description: '`sesion`, opcional (HU-07): id de servidor del dron (catálogo mínimo de `Operaciones`, sin pull de catálogo propio todavía).'
          type: integer
          example: null
          nullable: true
        hectareas_declaradas:
          description: 'DECIMAL como string (invariante 6). `0` si se omite.'
          type: string
          example: '0'
        hectarea_inicial_acumulada:
          description: '`sesion`, opcional (HU-07): acumulado de DJI al abrir la sesión, control de doble conteo (especificación §4.6). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        inicio:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00-04:00'
        fin:
          description: 'Requerido en `cierre_trabajo`/`cierre_sesion`.'
          type: string
          format: date-time
          example: null
          nullable: true
        litros:
          description: '`recepcion_caldo`: litros entregados por el cliente. DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        entregado_por:
          description: '`recepcion_caldo`: quién, del lado del cliente, entregó el caldo (especificación §4.6).'
          type: string
          example: null
          nullable: true
        hora:
          description: '`recepcion_caldo`: cuándo se entregó. `mezcla`: cuándo se cargó el caldo. `incidencia`: cuándo ocurrió. `recarga`: cuándo ocurrió el ciclo de cambio de batería/recarga de caldo.'
          type: string
          format: date-time
          example: null
          nullable: true
        productos:
          description: '`mezcla`: lista de productos cargados en el caldo. Cada elemento trae `producto` (nombre de texto libre, transcripto del envase — sin catálogo previo que la app baje), `cantidad` (DECIMAL positivo como string, invariante 6) y `unidad` (`l`, `ml`, `kg` o `g`). No puede venir vacía: si algún elemento es inválido, se rechaza el registro `mezcla` completo.'
          type: array
          items:
            required:
              - producto
              - cantidad
              - unidad
            properties:
              producto:
                type: string
                example: 'Glifosato 48%'
              cantidad:
                type: string
                example: '2.50'
              unidad:
                type: string
                example: l
                enum:
                  - l
                  - ml
                  - kg
                  - g
            type: object
          nullable: true
        litros_consumidos:
          description: '`cierre_sesion`, opcional: litros de caldo efectivamente rociados en la sesión (especificación §4.6). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        litros_sobrante:
          description: '`cierre_trabajo`, opcional: litros que quedaron sin aplicar al cerrar el trabajo (especificación §4.6). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        evidencia_imagen_campo_uuid_cliente:
          description: '`cierre_trabajo`: REQUERIDO — `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: imagen_campo` (especificación §4.6). Sin ella, referenciando una evidencia inexistente o de otro tipo, el cierre se rechaza ("sin captura no cierra").'
          type: string
          example: null
          nullable: true
        motivo_cierre:
          description: '`cierre_sesion`: catálogo de la especificación §4.6.'
          type: string
          example: null
          nullable: true
          enum:
            - completado
            - relevo_piloto
            - cambio_dron
            - falla_equipo
            - clima
            - fin_jornada
            - otro
        momento:
          description: '`condiciones`: solo `inicio_sesion` — condiciones climáticas capturadas EN el momento de una incidencia es un concepto distinto del registro `incidencia` en sí (que vive en su propia tabla), fuera de alcance de este catálogo.'
          type: string
          example: null
          nullable: true
          enum:
            - inicio_sesion
        viento_kmh:
          description: '`condiciones`.'
          type: string
          example: '12.50'
        temperatura_c:
          description: '`condiciones`.'
          type: string
          example: '24.00'
        humedad_pct:
          description: '`condiciones`.'
          type: string
          example: '65.00'
        observacion_agronomo:
          description: '`condiciones`: obligatoria junto con `firma_observacion` cuando alguna medición cae fuera de los límites EFECTIVOS (los mismos que entrega `limites` del pull de catálogo — viento > 17 km/h, temperatura > 30°C, humedad > 90%; la humedad mínima solo si el sistema la fija) — sin ambas, el registro se rechaza.'
          type: string
          example: null
          nullable: true
        firma_observacion:
          description: '`condiciones`: sin evidencia real todavía (TE-07), texto plano.'
          type: string
          example: null
          nullable: true
        tipo_incidencia:
          description: '`incidencia`: catálogo de la especificación §4.6. Campo separado de `tipo` (que en este objeto es el tipo de REGISTRO del lote) para evitar que ambos colisionen en la misma key.'
          type: string
          example: null
          nullable: true
          enum:
            - caldo
            - esc
            - bateria
            - mecanica
            - clima
            - otro
        descripcion:
          description: '`incidencia`, opcional: texto libre.'
          type: string
          example: null
          nullable: true
        evidencia_foto_uuid_cliente:
          description: '`incidencia`: REQUERIDO — `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_incidencia`. Sin ella, referenciando una evidencia inexistente, de otro tipo, o ya usada por otra incidencia, el registro se rechaza (HU-08: "con foto").'
          type: string
          example: null
          nullable: true
        litros_caldo:
          description: '`recarga`: litros de caldo cargados en ese ciclo. DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        bateria_saliente_id:
          description: '`recarga`: identificador de la batería que se retira (texto libre, sin catálogo de baterías en el esquema).'
          type: string
          example: null
          nullable: true
        temperatura_bateria_c:
          description: '`recarga`: temperatura medida de la batería saliente. > 50°C persiste con `alerta_temperatura = true`, sin rechazar el registro.'
          type: string
          example: null
          nullable: true
        motivo_retraso_caldo:
          description: '`recarga`, opcional: motivo del retraso o rechazo por calidad del caldo — solo se completa si hubo retraso, no en cada recarga.'
          type: string
          example: null
          nullable: true
          enum:
            - filtro_tapado
            - grumos
            - decantacion
            - espuma
            - color_olor_anormal
        hora_retraso:
          description: '`recarga`, opcional: cuándo ocurrió el retraso/rechazo por caldo.'
          type: string
          format: date-time
          example: null
          nullable: true
        litros_combustible_generador:
          description: '`recarga`, opcional: litros de combustible cargados al generador en ese ciclo. Informativo, sin costeo (Fase 3). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        horas_vuelo_dron:
          description: '`evidencia_equipo`: horas de vuelo del dron declaradas por el auxiliar/piloto (no calculadas). DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        foto_control_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_control`.'
          type: string
          example: null
          nullable: true
        foto_ciclo_bateria_balanceo_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia con `tipo: foto_ciclo_bateria_balanceo`.'
          type: string
          example: null
          nullable: true
        foto_dron_limpio_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia con `tipo: foto_dron_limpio`.'
          type: string
          example: null
          nullable: true
      type: object
    ResultadoSync:
      title: 'Resultado de aplicar un registro del lote'
      description: 'Uno por registro de entrada, en el mismo orden (especificación §13).'
      required:
        - uuid_cliente
        - tipo
        - estado
      properties:
        uuid_cliente:
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000001
          nullable: true
        tipo:
          type: string
          example: trabajo
          nullable: true
        estado:
          type: string
          example: aplicado
          enum:
            - aplicado
            - duplicado
            - rechazado
        motivo:
          description: 'Presente solo cuando `estado` es `rechazado`.'
          type: string
          example: 'el trabajo referenciado no existe todavía'
      type: object
    ContactoEntrada:
      title: 'Contacto de referencia (datos que envía el cliente)'
      description: 'Cuerpo de `POST /api/clientes/mi/contactos` y de `PUT /api/clientes/mi/contactos/{id}`. El primer contacto del cliente queda como principal; marcar otro como principal releva al anterior.'
      required:
        - nombre
        - telefono
      properties:
        nombre:
          description: "Contactos de referencia del cliente de la cuenta (`/clientes/mi/contactos`).\nAdaptador delgado (ADR 0008): las reglas y el alcance (solo lo propio, un id\najeno es 404) viven en {@see GestionarContactos}."
          type: string
          example: 'Rosa Condori Vargas'
        telefono:
          type: string
          example: '+591 76543210'
        cargo:
          type: string
          example: 'Encargada de campo'
          nullable: true
        es_principal:
          type: boolean
          nullable: true
      type: object
    EstimacionSolicitud:
      title: 'Estimación de una solicitud'
      required:
        - precio_acordado
        - hectareas
      properties:
        precio_ha:
          description: 'Precio por hectárea vigente: el acordado si ya se adjudicó; si no, el propuesto.'
          type: string
          example: '125.0000'
          nullable: true
        precio_acordado:
          description: 'Verdadero si la solicitud ya se adjudicó y el precio no cambia.'
          type: boolean
        hectareas:
          type: string
          example: '80.0000'
        monto_estimado:
          type: string
          example: '10000.00'
          nullable: true
      type: object
    TerrenoEntrada:
      title: 'Terreno (datos que envía el cliente)'
      description: 'Cuerpo de `POST /api/terrenos` y de `PUT /api/terrenos/{id}`: solo lo que el cliente escribe, sin `id`. Las hectáreas viajan como número o cadena decimal con hasta cuatro decimales (invariante 6).'
      required:
        - nombre
        - hectareas
      properties:
        nombre:
          description: "Terrenos del cliente (especificación §10.1, `GET/POST/PUT /terrenos`).\nAdaptador delgado (ADR 0008): la regla y el alcance (solo lo propio, un id\najeno es 404) viven en {@see GestionarTerrenos}."
          type: string
          example: 'Lote Norte'
        hectareas:
          type: string
          example: '120.5'
        cultivo:
          type: string
          nullable: true
        geometria:
          description: 'Polígono GeoJSON (`Polygon` o `MultiPolygon`).'
          type: object
          nullable: true
        referencias_acceso:
          type: string
          nullable: true
        colindantes_sensibles:
          type: string
          nullable: true
        acceso_dificil:
          type: boolean
          nullable: true
        zona_id:
          type: integer
          nullable: true
      type: object
    ClienteContacto:
      title: 'Contacto de referencia del cliente'
      description: 'Persona con quien el proveedor coordina el servicio. Una empresa tiene al menos uno; un cliente persona puede no tener. Se entrega al proveedor solo tras adjudicar la solicitud.'
      required:
        - id
        - nombre
        - telefono
        - es_principal
      properties:
        id:
          type: integer
          example: 7
        nombre:
          type: string
          example: 'Rosa Condori Vargas'
        telefono:
          type: string
          example: '+591 76543210'
        cargo:
          type: string
          example: 'Encargada de campo'
          nullable: true
        es_principal:
          description: 'El contacto que se usa cuando una solicitud no elige otro. Hay uno solo.'
          type: boolean
          example: true
      type: object
    Cliente:
      title: Cliente
      description: 'Quien solicita el servicio de fumigación y califica al proveedor (especificación §4.1).'
      required:
        - id
        - tipo
        - razon_social
        - estado
      properties:
        id:
          type: integer
          example: 4
        tipo:
          type: string
          example: empresa
          enum:
            - persona
            - empresa
        razon_social:
          type: string
          example: 'Agropecuaria San Rafael SRL'
        documento_fiscal:
          type: string
          example: '1029384027'
          nullable: true
        telefono:
          type: string
          example: '+591 76543210'
          nullable: true
        estado:
          type: string
          example: activo
          enum:
            - activo
            - suspendido
        calificacion_promedio:
          description: 'Decimal exacto en string (0 a 5).'
          type: string
          example: '0.00'
        calificaciones_conteo:
          type: integer
          example: 0
        publicacion_limitada:
          description: 'Verdadero si la publicación de solicitudes está limitada hasta una revisión por calificación baja (política de calificación).'
          type: boolean
          example: false
        contactos:
          description: 'Contactos de referencia vigentes, el principal primero. Una empresa tiene al menos uno.'
          type: array
          items:
            $ref: '#/components/schemas/ClienteContacto'
        aviso_calificacion:
          description: 'Verdadero si el promedio bajó del umbral y hay un aviso vigente.'
          type: boolean
          example: false
      type: object
    SolicitudServicio:
      title: 'Solicitud de servicio'
      description: 'La unidad de negocio del marketplace (especificación §4.2, ADR 0027). Hectáreas, precios y montos son decimales exactos en string. `precio_ha_propuesto` lo fija el cliente; `precio_ha_acordado` queda fijo al adjudicar; `monto_final` (hectáreas ejecutadas × precio acordado) se congela al finalizar y es lo que el cliente paga fuera de la app. `terreno` e `historial` solo viajan en el detalle.'
      required:
        - id
        - uuid_cliente
        - terreno_id
        - tipo_aplicacion
        - hectareas_solicitadas
        - producto_indicado
        - aporta_producto
        - ventana_desde
        - ventana_hasta
        - urgente
        - estado
      properties:
        id:
          type: integer
          example: 31
        uuid_cliente:
          description: 'Nace en el dispositivo; hace idempotente la creación.'
          type: string
          format: uuid
        terreno_id:
          type: integer
          example: 12
        contacto_id:
          description: 'Contacto de referencia elegido; una empresa que no elige usa su contacto principal. Nulo en un cliente persona sin contacto.'
          type: integer
          example: 7
          nullable: true
        tipo_aplicacion:
          type: string
          enum:
            - herbicida
            - insecticida
            - fungicida
            - fertilizante_foliar
            - desecante
            - otro
        hectareas_solicitadas:
          type: string
          example: '80.0000'
        cultivo:
          type: string
          example: Soya
          nullable: true
        producto_indicado:
          type: string
          example: 'Glifosato 480 SL, 2 L/ha'
        aporta_producto:
          type: string
          enum:
            - cliente
            - proveedor
        ventana_desde:
          type: string
          format: date
          example: '2026-12-01'
        ventana_hasta:
          type: string
          format: date
          example: '2026-12-10'
        urgente:
          type: boolean
          example: false
        observaciones:
          type: string
          nullable: true
        precio_ha_propuesto:
          description: 'Precio por hectárea que propone el cliente.'
          type: string
          example: '125.0000'
          nullable: true
        precio_ha_acordado:
          description: 'Precio de la oferta adjudicada.'
          type: string
          example: '118.0000'
          nullable: true
        monto_estimado:
          description: 'Hectáreas solicitadas por el precio vigente.'
          type: string
          example: '9440.00'
          nullable: true
        hectareas_ejecutadas:
          type: string
          example: '78.5000'
          nullable: true
        porcentaje_avance:
          type: string
          example: '65.00'
        monto_final:
          description: 'Se congela al finalizar: hectáreas ejecutadas por el precio acordado.'
          type: string
          nullable: true
        estado:
          type: string
          enum:
            - borrador
            - abierta
            - con_ofertas
            - adjudicada
            - en_ejecucion
            - finalizada
            - calificada
            - cancelada
            - expirada
            - disputada
        oferta_adjudicada_id:
          type: integer
          nullable: true
        vence_en:
          type: string
          format: date-time
          nullable: true
        proveedor_id:
          type: integer
          nullable: true
        publicada_en:
          type: string
          format: date-time
          nullable: true
        motivo_cancelacion:
          type: string
          nullable: true
        cancelada_por:
          type: string
          nullable: true
          enum:
            - cliente
            - proveedor
            - administrador
            - sistema
        contacto:
          nullable: true
          allOf:
            -
              $ref: '#/components/schemas/ClienteContacto'
        terreno:
          $ref: '#/components/schemas/Terreno'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistorialSolicitud'
      type: object
    HistorialSolicitud:
      title: 'Paso del historial de una solicitud'
      description: 'Cada transición deja una fila inmutable con quién, por qué y cuándo (ADR 0027, punto 4).'
      required:
        - estado_nuevo
        - origen
        - creado_en
      properties:
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          type: string
        origen:
          type: string
          enum:
            - cliente
            - proveedor
            - administrador
            - sistema
        motivo:
          type: string
          nullable: true
        creado_en:
          type: string
          format: date-time
      type: object
    Terreno:
      title: Terreno
      description: 'Terreno de un cliente sobre el que pide servicios (especificación §4.1). Hectáreas como decimal exacto en string.'
      required:
        - id
        - nombre
        - hectareas
        - acceso_dificil
      properties:
        id:
          type: integer
          example: 12
        nombre:
          type: string
          example: 'Lote Norte'
        hectareas:
          type: string
          example: '120.5000'
        cultivo:
          type: string
          example: Soya
          nullable: true
        geometria:
          description: 'Polígono GeoJSON del terreno.'
          type: object
          nullable: true
        referencias_acceso:
          type: string
          nullable: true
        colindantes_sensibles:
          description: 'Apiarios, cultivos orgánicos, viviendas.'
          type: string
          nullable: true
        acceso_dificil:
          type: boolean
          example: false
        zona_id:
          type: integer
          example: 1
          nullable: true
        fotos:
          description: 'Fotos del estado del terreno (hasta 8). Las URLs son firmadas y de corta vida: se piden de nuevo con el terreno.'
          type: array
          items:
            $ref: '#/components/schemas/FotoDeTerreno'
      type: object
    FotoDeTerreno:
      title: 'Foto del estado de un terreno'
      required:
        - id
        - url
      properties:
        id:
          type: integer
          example: 5
        descripcion:
          type: string
          example: 'Borde norte con maleza alta'
          nullable: true
        url:
          description: 'URL firmada y de corta vida (relativa a la base de la API); se pide sin token.'
          type: string
          example: '/api/terrenos/fotos/5/archivo?expires=1764000000&signature=ab12'
      type: object
  securitySchemes:
    tokenDispositivo:
      type: http
      description: 'Token por dispositivo emitido por `POST /api/auth/token` (HU-03). Se envía como `Authorization: Bearer {token}`. Caduca a los `SANCTUM_EXPIRATION` minutos de emitido (30 días por defecto), o antes si se lo revoca desde el panel o si la cuenta o el rol con el que se emitió dejan de estar vigentes.'
      scheme: bearer
tags:
  -
    name: Calificaciones
    description: 'El cliente califica al proveedor, al piloto y al auxiliar de un servicio completado, durante 7 días; el proveedor califica al cliente en privado y ve las calificaciones que recibe (ADR 0031).'
  -
    name: Disputas
    description: 'El cliente (hasta 72 horas después de `ejecutada`) o el proveedor (cobro pendiente, acceso negado o calificación abusiva) abren una disputa; soporte media y un administrador resuelve; ambas partes pueden apelar una vez en 7 días (ADR 0033). Los reembolsos se liquidan fuera de la app.'
  -
    name: Distribucion
    description: 'Versionado y distribución del APK de agrocom-field (HU-20).'
  -
    name: Mensajes
    description: 'Mensajes entre el cliente y el proveedor adjudicado, desde la adjudicación. Texto de hasta 1000 caracteres, fotos de menos de 300 KB y líneas de sistema que el servidor escribe al cambiar la solicitud.'
  -
    name: Mercado
    description: 'El piloto ve en un mapa las solicitudes abiertas para decidir a qué zona ir con su equipo (los valles frente a la Chiquitania) y a cuáles ofertar.'
  -
    name: Ofertas
    description: 'El proveedor ofrece su precio por hectárea, cada parte contraoferta a la otra y el cliente elige: aceptar una oferta adjudica la solicitud.'
  -
    name: Preferencias
    description: 'Qué avisos recibe la cuenta. Las categorías obligatorias (adjudicación, cierre, expiración, cuenta y aprobación, disputas, emergencias) no aparecen y no se pueden desactivar.'
  -
    name: Seguimiento
    description: 'Inicio, avance con fotos, cierre y ubicación del piloto. El piloto solo sube fotos y marca el avance; lo operativo se acuerda en persona.'
  -
    name: Notificaciones
    description: 'Avisos in-app de la cuenta (ADR 0025): el panel los ve en la campana; las apps, por esta API.'
  -
    name: Operaciones
    description: 'Trabajos, sesiones, condiciones, recepción de caldo y evidencias de campo.'
  -
    name: Proveedores
    description: 'Registro, personal, documentos y reenvío a revisión de proveedores del marketplace (ADR 0028, 0032).'
  -
    name: Seguridad
    description: 'Sesión de la app de campo por token de dispositivo (especificación §13).'
  -
    name: Sincronizacion
    description: 'Push de escritura offline de la app de campo (especificación §13): `trabajo`, `sesion`, `condiciones`, `recepcion_caldo`, `mezcla`, `incidencia`, `recarga`, `evidencia_equipo` y los cierres de trabajo y de sesión, todos como tipos de registro de `POST /api/sync`.'
  -
    name: Clientes
    description: 'Registro y perfil del cliente del marketplace, que solicita el servicio y califica al proveedor (ADR 0027).'
  -
    name: 'Contactos del cliente'
    description: 'Personas de referencia del cliente (en una empresa, quienes coordinan el servicio con el proveedor). El proveedor recibe sus datos solo tras adjudicar.'
  -
    name: Solicitudes
    description: 'El cliente pide, consulta, publica y cancela servicios de fumigación (ADR 0027). Sin cobro en la app en la versión 1.'
  -
    name: Terrenos
    description: 'Terrenos que el cliente registra una vez y reutiliza en cada solicitud de servicio (ADR 0027).'
  -
    name: Flota
    description: Flota

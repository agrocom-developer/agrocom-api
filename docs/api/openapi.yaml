      operationId: cancelarSolicitud
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - motivo
              properties:
                motivo:
                  type: string
                  example: 'Cambió la fecha de siembra'
              type: object
      responses:
        200:
          description: 'Solicitud cancelada.'
          content:
            application/json:
              schema:
                required:
                  - solicitud
                properties:
                  solicitud:
                    $ref: '#/components/schemas/SolicitudServicio'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
        422:
          description: 'Falta el motivo o la solicitud ya no admite cancelación.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/terrenos:
    get:
      tags:
        - Terrenos
      summary: 'Mis terrenos'
      description: 'Los terrenos del cliente de la cuenta del token, por nombre.'
      operationId: listarTerrenos
      responses:
        200:
          description: 'Terrenos del cliente.'
          content:
            application/json:
              schema:
                required:
                  - terrenos
                properties:
                  terrenos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Terreno'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'La cuenta no tiene ficha de cliente.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Terrenos
      summary: 'Registrar un terreno'
      description: 'Registra un terreno del cliente. Las hectáreas se envían como número o cadena decimal con hasta cuatro decimales.'
      operationId: crearTerreno
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - nombre
                - hectareas
              properties:
                nombre:
                  type: string
                  example: 'Lote Norte'
                hectareas:
                  type: string
                  example: '120.5'
                cultivo:
                  type: string
                  nullable: true
                geometria:
                  description: 'Polígono GeoJSON (`Polygon` o `MultiPolygon`).'
                  type: object
                  nullable: true
                referencias_acceso:
                  type: string
                  nullable: true
                colindantes_sensibles:
                  type: string
                  nullable: true
                acceso_dificil:
                  type: boolean
                  nullable: true
                zona_id:
                  type: integer
                  nullable: true
              type: object
      responses:
        201:
          description: 'Terreno creado.'
          content:
            application/json:
              schema:
                required:
                  - terreno
                properties:
                  terreno:
                    $ref: '#/components/schemas/Terreno'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        422:
          description: 'Datos inválidos o cliente suspendido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  '/api/terrenos/{id}':
    get:
      tags:
        - Terrenos
      summary: 'Un terreno mío'
      operationId: verTerreno
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'El terreno.'
          content:
            application/json:
              schema:
                required:
                  - terreno
                properties:
                  terreno:
                    $ref: '#/components/schemas/Terreno'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
      security:
        -
          tokenDispositivo: []
    put:
      tags:
        - Terrenos
      summary: 'Actualizar un terreno'
      description: 'Corrige los datos de un terreno propio. Las solicitudes ya creadas conservan sus propias hectáreas.'
      operationId: actualizarTerreno
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Terreno'
      responses:
        200:
          description: 'Terreno actualizado.'
          content:
            application/json:
              schema:
                required:
                  - terreno
                properties:
                  terreno:
                    $ref: '#/components/schemas/Terreno'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'No existe o es de otro cliente.'
        422:
          description: 'Datos inválidos.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/zonas:
    get:
      tags:
        - Clientes
      summary: 'Catálogo de zonas'
      description: 'Zonas geográficas del marketplace con su centroide y radio, ordenadas por nombre. Sin autenticación: el registro de un proveedor las usa para elegir su zona base. Coordenadas y radio como string decimal.'
      operationId: listarZonas
      responses:
        200:
          description: Zonas.
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      required:
                        - id
                        - nombre
                        - centroide_lat
                        - centroide_lng
                        - radio_km
                      properties:
                        id:
                          type: integer
                          example: 1
                        nombre:
                          type: string
                          example: 'Santa Cruz de la Sierra'
                        centroide_lat:
                          type: string
                          example: '-17.7833000'
                        centroide_lng:
                          type: string
                          example: '-63.1821000'
                        radio_km:
                          type: string
                          example: '40.0'
                      type: object
                type: object
components:
  schemas:
    Oferta:
      title: 'Oferta de servicio'
      required:
        - id
        - solicitud_id
        - estado
        - ronda
        - grupo
        - ofrecida_en
        - vence_en
        - segundos_restantes
      properties:
        id:
          description: "Una oferta tal como la ve el proveedor (especificación §6, punto 8): el\nterreno aproximado, las hectáreas, el pago estimado y la distancia; sin datos\nde contacto del cliente. Los importes y las hectáreas viajan como cadena\ndecimal exacta (invariante 6 de CLAUDE.md)."
          type: integer
          example: 31
        solicitud_id:
          type: integer
          example: 12
        estado:
          type: string
          enum:
            - ofrecida
            - aceptada
            - rechazada
            - vencida
            - retirada
        ronda:
          type: integer
          example: 1
        grupo:
          type: string
          enum:
            - propio
            - tercero
        ofrecida_en:
          type: string
          format: date-time
        vence_en:
          type: string
          format: date-time
        segundos_restantes:
          description: 'Cuenta regresiva de una oferta viva; 0 si ya se resolvió.'
          type: integer
          example: 540
        respondida_en:
          type: string
          format: date-time
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        motivo_retiro:
          type: string
          nullable: true
          enum:
            - otro_acepto
            - cancelada
            - reasignada
            - asignacion_forzada
        equipo_id:
          type: integer
          nullable: true
        pago_estimado:
          type: string
          example: '9792.00'
          nullable: true
        distancia_km:
          type: string
          example: '23.40'
          nullable: true
        servicio:
          description: 'Lo que se muestra del servicio antes de aceptar: sin nombre del terreno ni contacto del cliente.'
          properties:
            tipo_aplicacion:
              type: string
            hectareas:
              type: string
              example: '80.0000'
            urgente:
              type: boolean
            ventana_desde:
              type: string
              format: date
            ventana_hasta:
              type: string
              format: date
            zona:
              type: string
              example: Warnes
              nullable: true
            ubicacion_aproximada:
              properties:
                lat:
                  type: string
                lng:
                  type: string
              type: object
              nullable: true
          type: object
          nullable: true
      type: object
    PaginacionLinks:
      title: 'Links de paginación'
      description: 'Links de navegación de la respuesta paginada estándar de Laravel.'
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          description: 'URL de la primera página.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=1'
        last:
          description: 'URL de la última página.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=3'
        prev:
          description: 'URL de la página anterior; null en la primera.'
          type: string
          example: null
          nullable: true
        next:
          description: 'URL de la página siguiente; null en la última.'
          type: string
          example: 'http://localhost:8000/api/solicitudes?page=2'
          nullable: true
      type: object
    PaginacionMeta:
      title: 'Metadatos de paginación'
      description: 'Metadatos de la respuesta paginada estándar de Laravel.'
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          description: 'Página actual.'
          type: integer
          example: 1
        from:
          description: 'Posición del primer registro de la página; null si está vacía.'
          type: integer
          example: 1
          nullable: true
        last_page:
          description: 'Última página disponible.'
          type: integer
          example: 3
        links:
          description: 'Elementos del paginador para renderizar la navegación.'
          type: array
          items:
            required:
              - url
              - label
              - page
              - active
            properties:
              url:
                type: string
                example: 'http://localhost:8000/api/solicitudes?page=1'
                nullable: true
              label:
                type: string
                example: '1'
              page:
                type: integer
                example: 1
                nullable: true
              active:
                type: boolean
                example: true
            type: object
        path:
          description: 'URL base del listado, sin query string.'
          type: string
          example: 'http://localhost:8000/api/solicitudes'
          nullable: true
        per_page:
          description: 'Registros por página.'
          type: integer
          example: 15
        to:
          description: 'Posición del último registro de la página; null si está vacía.'
          type: integer
          example: 15
          nullable: true
        total:
          description: 'Total de registros que matchean los filtros.'
          type: integer
          example: 42
      type: object
    ErrorValidacion:
      title: 'Error de validación'
      description: 'Respuesta 422 estándar de Laravel: un mensaje general y los mensajes por campo.'
      required:
        - message
        - errors
      properties:
        message:
          description: 'Mensaje general del primer error.'
          type: string
          example: 'El valor seleccionado para estado no es válido.'
        errors:
          description: 'Mensajes de validación agrupados por campo.'
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    VersionApk:
      title: 'Versión del APK'
      description: 'Versión autorizada del APK de agrocom-field, con la URL de su release (HU-20).'
      required:
        - version
        - version_code
        - url_descarga
      properties:
        version:
          description: 'Versión SemVer.'
          type: string
          example: 1.4.2
        version_code:
          description: 'Código de versión de Android.'
          type: integer
          example: 14002
        url_descarga:
          description: 'URL del release del `.apk` publicado en agrocom-field (GitHub Releases).'
          type: string
          format: uri
      type: object
    Disponibilidad:
      title: 'Disponibilidad de un equipo'
      required:
        - equipo_id
        - en_linea
        - actualizado_en
      properties:
        equipo_id:
          description: "Disponibilidad «en línea» de los equipos del proveedor (especificación §4.4 y\n§10.2). Requiere red: sin señal el proveedor no recibe ofertas de todos modos."
          type: integer
          example: 4
        en_linea:
          type: boolean
        lat:
          type: string
          example: '-17.7833000'
          nullable: true
        lng:
          type: string
          example: '-63.1821000'
          nullable: true
        actualizado_en:
          type: string
          format: date-time
      type: object
    Dron:
      title: Dron
      description: 'El vehículo del marketplace, con dueño y operador (ADR 0029). Necesita aprobación de un administrador antes de recibir ofertas. Capacidad y ancho de pasada viajan como string decimal.'
      required:
        - id
        - dueno_proveedor_id
        - operador_proveedor_id
        - marca
        - modelo
        - numero_serie
        - capacidad_tanque_l
        - ancho_pasada_m
        - ciclos_bateria
        - estado
        - origen
      properties:
        id:
          type: integer
          example: 9
        dueno_proveedor_id:
          type: integer
          example: 12
        operador_proveedor_id:
          type: integer
          example: 12
        marca:
          type: string
          example: DJI
        modelo:
          type: string
          example: 'Agras T40'
        numero_serie:
          type: string
          example: 1WNDH2K00A0001
        capacidad_tanque_l:
          type: string
          example: '40.00'
        ancho_pasada_m:
          type: string
          example: '11.00'
        ciclos_bateria:
          description: 'Único dato de mantenimiento que se conserva; sube con cada recarga registrada en el lote.'
          type: integer
          example: 118
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
        origen:
          type: string
          example: externo
          enum:
            - flota_agrocom
            - vendido_por_agrocom
            - externo
      type: object
    Equipo:
      title: Equipo
      description: 'Combinación operativa piloto + dron (+ auxiliar) que ejecuta una solicitud. Un piloto y un dron no pueden estar en dos equipos vigentes a la vez.'
      required:
        - id
        - proveedor_id
        - piloto_id
        - dron_id
        - vigente_desde
      properties:
        id:
          type: integer
          example: 3
        proveedor_id:
          type: integer
          example: 12
        piloto_id:
          type: integer
          example: 5
        dron_id:
          type: integer
          example: 9
        auxiliar_id:
          type: integer
          nullable: true
        vigente_desde:
          type: string
          format: date
          example: '2026-11-23'
        vigente_hasta:
          description: 'null = sin fin.'
          type: string
          format: date
          nullable: true
      type: object
    Auxiliar:
      title: Auxiliar
      description: 'Quien prepara la mezcla y asiste en el lote. Lo registra un piloto o el proveedor y lo aprueba un administrador (ADR 0032).'
      required:
        - id
        - proveedor_id
        - usuario_id
        - nombre
        - estado
      properties:
        id:
          type: integer
          example: 8
        proveedor_id:
          type: integer
          example: 12
        usuario_id:
          type: integer
          example: 34
        nombre:
          type: string
          example: 'Lucía Flores'
        registrado_por_piloto_id:
          type: integer
          nullable: true
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
      type: object
    DocumentoProveedor:
      title: 'Documento de verificación'
      description: 'Documento con vencimiento de un proveedor, piloto, auxiliar o dron. El archivo no se descarga por la API.'
      required:
        - id
        - sujeto_tipo
        - sujeto_id
        - tipo
        - estado
      properties:
        id:
          description: "Nunca expone `archivo_ref`: el archivo es privado y solo lo ven\nadministradores y soporte desde el panel (política de verificación)."
          type: integer
          example: 40
        sujeto_tipo:
          type: string
          example: piloto
          enum:
            - proveedor
            - piloto
            - auxiliar
            - dron
        sujeto_id:
          type: integer
          example: 5
        tipo:
          type: string
          example: licencia_piloto
          enum:
            - identidad
            - licencia_piloto
            - habilitacion_dron
            - seguro_responsabilidad
            - registro_dron
            - certificado_fumigacion
            - antecedentes
            - otro
        estado:
          type: string
          example: en_revision
          enum:
            - en_revision
            - aprobado
            - rechazado
            - vencido
        vence_en:
          type: string
          format: date
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true
        nombre_original:
          type: string
          nullable: true
        bytes:
          type: integer
          example: 182044
        subido_en:
          type: string
          format: date-time
      type: object
    Piloto:
      title: Piloto
      description: 'Quien opera el dron dentro de un proveedor. Comparte el ciclo de aprobación (ADR 0032).'
      required:
        - id
        - proveedor_id
        - usuario_id
        - nombre
        - licencia_numero
        - licencia_vence
        - categoria_habilitacion
        - estado
      properties:
        id:
          description: 'El nombre no es columna de `prv_pilotos` (vive en la cuenta): quien arma la respuesta lo resuelve por lote.'
          type: integer
          example: 5
        proveedor_id:
          type: integer
          example: 12
        usuario_id:
          type: integer
          example: 31
        nombre:
          type: string
          example: 'Marcelo Terrazas'
        licencia_numero:
          type: string
          example: RPA-2291
        licencia_vence:
          type: string
          format: date
          example: '2027-06-30'
        categoria_habilitacion:
          type: string
          example: 'RPAS agrícola'
        estado:
          type: string
          example: aprobado
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          type: string
          nullable: true
      type: object
    Proveedor:
      title: Proveedor
      description: 'Entidad que presta el servicio y recibe ofertas (ADR 0028). Nace `pendiente`; solo un administrador la aprueba.'
      required:
        - id
        - tipo
        - razon_social
        - estado
      properties:
        id:
          type: integer
          example: 12
        tipo:
          description: '`propio` (Agrocom), `independiente` o `tercero`.'
          type: string
          example: tercero
          enum:
            - propio
            - independiente
            - tercero
        razon_social:
          type: string
          example: 'Fumigaciones del Oriente SRL'
        documento_fiscal:
          type: string
          example: '1023456028'
          nullable: true
        telefono:
          type: string
          example: '+591 70012345'
          nullable: true
        zona_base_id:
          type: integer
          example: 2
          nullable: true
        radio_operacion_km:
          description: 'Decimal exacto en string.'
          type: string
          example: '80.0'
        estado:
          type: string
          example: pendiente
          enum:
            - pendiente
            - aprobado
            - suspendido
            - rechazado
            - baja
        motivo_estado:
          description: 'Motivo del último rechazo, suspensión o baja; null si no aplica.'
          type: string
          example: null
          nullable: true
        aprobado_en:
          type: string
          format: date-time
          nullable: true
        calificacion_promedio:
          description: 'Decimal exacto en string (0 a 5).'
          type: string
          example: '4.80'
        calificaciones_conteo:
          type: integer
          example: 17
      type: object
    Dispositivo:
      title: 'Dispositivo con sesión'
      description: 'Dispositivo de campo con una sesión viva (HU-03). El token en sí nunca se devuelve.'
      required:
        - id
        - uuid_dispositivo
        - nombre_dispositivo
        - rol
        - last_used_at
        - created_at
      properties:
        id:
          description: 'Identificador del token de dispositivo.'
          type: integer
          example: 1
        uuid_dispositivo:
          description: 'UUID generado por el dispositivo.'
          type: string
          format: uuid
          example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
        nombre_dispositivo:
          description: 'Nombre legible informado por la app.'
          type: string
          example: 'Moto G84 — piloto 2'
          nullable: true
        rol:
          $ref: '#/components/schemas/RolActivo'
        last_used_at:
          description: 'Último request autenticado con este token.'
          type: string
          format: date-time
          nullable: true
        created_at:
          description: 'Cuándo se emitió el token.'
          type: string
          format: date-time
      type: object
    RolActivo:
      title: Rol
      description: 'Rol bajo el que opera una sesión de la app de campo.'
      required:
        - id
        - name
        - description
      properties:
        id:
          description: "Rol tal como lo ve la app de campo. Es el rol ÚNICO bajo el que opera la\nsesión —del token o del selector—, nunca una lista de permisos efectivos\n(invariante 10 de CLAUDE.md): los permisos se resuelven en el servidor\ncontra la base en cada request, no se le entregan a la app para que decida\nsola."
          type: integer
          example: 1
        name:
          description: 'Nombre interno del rol.'
          type: string
          example: piloto
        description:
          description: 'Descripción legible del rol.'
          type: string
          example: 'Piloto de dron: ejecuta sesiones de vuelo en campo.'
          nullable: true
      type: object
    UsuarioCampo:
      title: 'Usuario de campo'
      description: 'Cuenta con la que opera la app de campo.'
      required:
        - id
        - name
        - username
        - persona_id
      properties:
        id:
          description: "Identidad del operario tal como la necesita la app de campo: lo justo para\nsaludarlo y para saber a qué persona operativa corresponde.\n\n`persona_id` viaja como ID pelado (ADR 0003, regla 3): el detalle de la\npersona pertenece al módulo `Personal` y la app lo resuelve desde su\ncatálogo sincronizado, no anidado acá."
          type: integer
          example: 7
        name:
          description: 'Nombre para mostrar.'
          type: string
          example: 'Camila Rojas'
        username:
          description: 'Identificador de login (nunca un correo).'
          type: string
          example: camila.rojas
        persona_id:
          description: 'Persona operativa enlazada (módulo Personal, solo ID).'
          type: integer
          example: 3
          nullable: true
      type: object
    PersonaCatalogo:
      title: 'Persona operativa (catálogo)'
      description: 'Persona vigente (no borrada) para el pull de catálogo (espec §4.2).'
      required:
        - id
        - nombre
        - rol
        - base_id
        - activo
        - updated_at
      properties:
        id:
          description: "Adaptador delgado (ADR 0008): valida la query string, invoca el caso de\nuso y devuelve la respuesta — ninguna regla de negocio vive acá."
          type: integer
          example: 5
        nombre:
          type: string
          example: 'Piloto Uno'
        rol:
          type: string
          example: piloto
        base_id:
          type: integer
          example: 1
          nullable: true
        activo:
          type: boolean
          example: true
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
      type: object
    TerrenoServicioCatalogo:
      title: 'Terreno de un servicio (catálogo)'
      description: 'El terreno sobre el que se ejecuta el servicio: dónde volar y qué cuidar. Hectáreas como decimal exacto en string (invariante 6).'
      required:
        - nombre
        - hectareas
        - acceso_dificil
      properties:
        nombre:
          type: string
          example: 'Lote Norte'
        hectareas:
          type: string
          example: '120.5000'
        geometria:
          description: 'Polígono GeoJSON, o null si no está cargado.'
          type: object
          nullable: true
        referencias_acceso:
          type: string
          nullable: true
        colindantes_sensibles:
          description: 'Apiarios, cultivos orgánicos, viviendas.'
          type: string
          nullable: true
        acceso_dificil:
          type: boolean
          example: false
      type: object
    ServicioAsignadoCatalogo:
      title: 'Servicio asignado (catálogo)'
      description: 'Solicitud de servicio aceptada que el equipo del operario lleva al lote (ADR 0037). Solo estados de ejecución: `asignada`, `en_camino`, `en_ejecucion` o `suspendida_por_clima`. FILTRADO por el operario del token: solo los servicios de los equipos de flota en los que su cuenta es piloto o auxiliar con vigencia HOY; una cuenta sin equipo recibe la lista vacía. El `id` es el `solicitud_id` que la app envía en el registro `trabajo` de `POST /api/sync`. Sin datos de contacto del cliente. Límite conocido del cursor: si el operario entra a un equipo nuevo, los servicios de ese equipo que no cambiaron desde el último pull no llegan en el incremental; los trae un pull completo (`desde` vacío).'
      required:
        - id
        - uuid_cliente
        - estado
        - equipo_id
        - tipo_aplicacion
        - hectareas_solicitadas
        - producto_indicado
        - aporta_producto
        - ventana_desde
        - ventana_hasta
        - urgente
        - terreno
        - updated_at
      properties:
        id:
          type: integer
          example: 31
        uuid_cliente:
          type: string
          example: 9a1b7e3e-2f7a-4b3d-8c1e-6f2a1d9c4b0a
        estado:
          type: string
          example: asignada
          enum:
            - asignada
            - en_camino
            - en_ejecucion
            - suspendida_por_clima
        equipo_id:
          type: integer
          example: 7
        tipo_aplicacion:
          type: string
          enum:
            - herbicida
            - insecticida
            - fungicida
            - fertilizante_foliar
            - desecante
            - otro
        hectareas_solicitadas:
          type: string
          example: '80.0000'
        cultivo:
          type: string
          example: Soya
          nullable: true
        producto_indicado:
          type: string
          example: 'Glifosato 480 SL, 2 L/ha'
        aporta_producto:
          type: string
          enum:
            - cliente
            - proveedor
        ventana_desde:
          type: string
          format: date
          example: '2026-12-01'
        ventana_hasta:
          type: string
          format: date
          example: '2026-12-10'
        urgente:
          type: boolean
          example: false
        observaciones:
          type: string
          nullable: true
        terreno:
          $ref: '#/components/schemas/TerrenoServicioCatalogo'
        updated_at:
          description: 'Posición del cursor de esta sección.'
          type: string
          format: date-time
          example: '2026-12-01T12:00:00+00:00'
      type: object
    ServicioRetiradoCatalogo:
      title: 'Servicio retirado (catálogo)'
      description: 'Servicio que el equipo del operario tuvo y ya no debe llevar al lote. La app lo OCULTA, no lo borra: puede tener trabajo capturado sin sincronizar. `motivo`: `cancelada`, `reasignada` (volvió a asignación: el proveedor canceló o soporte lo reasignó) o `ejecutada` (cerrado por el servidor, a la espera de conformidad o terminado). Un servicio nunca viaja a la vez en `servicios_asignados` y acá.'
      required:
        - id
        - uuid_cliente
        - motivo
        - updated_at
      properties:
        id:
          type: integer
          example: 31
        uuid_cliente:
          type: string
          example: 9a1b7e3e-2f7a-4b3d-8c1e-6f2a1d9c4b0a
        motivo:
          type: string
          example: cancelada
          enum:
            - cancelada
            - reasignada
            - ejecutada
        updated_at:
          description: 'Posición del cursor de esta sección.'
          type: string
          format: date-time
          example: '2026-12-02T11:00:00+00:00'
      type: object
    LimitesCondicionesCatalogo:
      title: 'Límites de condiciones de vuelo (catálogo)'
      description: 'Los límites con los que el servidor valida el registro `condiciones` de `POST /api/sync` (espec §9.2); la app, que es offline, los muestra para que lo que ve y lo que se exige nunca se contradigan. DECIMAL como string (invariante 6). `viento_max_kmh`, `temperatura_max_c` y `humedad_max_pct` siempre traen valor; los demás son `null` si el sistema no fija un límite, y la app no debe aplicarlo.'
      required:
        - viento_max_kmh
        - temperatura_max_c
        - humedad_max_pct
      properties:
        humedad_min_pct:
          type: string
          nullable: true
        viento_max_kmh:
          type: string
          example: '17.00'
        temperatura_max_c:
          type: string
          example: '30.00'
        humedad_max_pct:
          type: string
          example: '90.00'
        altura_vuelo_m:
          type: string
          nullable: true
        velocidad_vuelo_kmh:
          type: string
          nullable: true
        ancho_pasada_m:
          type: string
          nullable: true
      type: object
    RegistroSync:
      title: 'Registro de entrada del lote de sync'
      description: 'Un elemento del arreglo `registros`. La forma exacta de los campos depende de `tipo`; un registro con datos incompletos o inválidos se responde `rechazado` sin frenar el resto del lote — nunca un 422 para el lote completo. `cierre_trabajo`/`cierre_sesion` (HU-05) MUTAN una fila existente en vez de crear una nueva: `uuid_cliente` identifica el EVENTO de cierre — distinto del `uuid_cliente` de apertura del trabajo/sesión que referencian. Trabajo dado de baja por el panel mientras se volaba (2/10/2026): lo ya en curso se registra igual — `cierre_trabajo`, y `cierre_sesion`/`condiciones`/`incidencia`/`recarga` de una sesión que ya existía, con los límites con los que el equipo salió —, el trabajo sigue dado de baja; nada nuevo: `sesion`, `recepcion_caldo` y `evidencia_equipo` sobre ese trabajo se rechazan con `trabajo_no_existe_aun`, y `mezcla` con el `trabajo_no_existe` de Mezclas. `recepcion_caldo` (HU-10 redefinida por CR-01, tarea 18) registra volumen de caldo entregado por el cliente — nunca su composición: eso es lo que ahora registra `mezcla` por separado (ver abajo), no `recepcion_caldo`. `mezcla` (espec §7, HU-78, tarea 94, revierte CR-01 del 1/9/2026) registra qué productos y en qué cantidad se cargaron en el caldo al crear una aplicación — cabecera (`trabajo_uuid_cliente`, `hora`) más una lista `productos` (nombre de texto libre, cantidad, unidad); nunca dosis por hectárea, orden de incorporación ni compatibilidad entre productos (§7.1 sigue vigente en eso, ver espec §7). `incidencia` (HU-08, tarea 22) registra un evento puntual de la sesión (caldo/ESC/batería/mecánica/clima/otro) con foto SIEMPRE obligatoria, referenciada por `uuid_cliente` a una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_incidencia`. `recarga` (HU-13, tarea 23) registra cada ciclo de cambio de batería/recarga de caldo durante el vuelo — temperatura de batería > 50°C se persiste con `alerta_temperatura = true` sin rechazar el registro; independiente del evento `mezcla` (sin vínculo entre ambos en esta tarea). `trabajo` abre la ejecución de una solicitud de servicio aceptada: referencia la `solicitud_id` del servicio asignado del catálogo (ADR 0037) y se rechaza si la solicitud no tiene equipo asignado o ya terminó; al abrirse el primero, la solicitud pasa a `en_ejecucion`, y al cerrarse los trabajos que cubren lo pedido, a `ejecutada`. `evidencia_equipo` (HU-80, tarea 86) registra el "Reporte de Equipos": horas de vuelo declaradas del dron y las tres fotos de chequeo (control, ciclo de batería y balanceo, dron limpio), cada una referenciada por `uuid_cliente` a una evidencia ya subida por `POST /api/evidencias` — las tres son obligatorias, falta cualquiera y se rechaza el registro completo.'
      required:
        - tipo
        - uuid_cliente
      properties:
        tipo:
          description: "Adaptador delgado (ADR 0008): valida el sobre del lote, invoca el caso de\nuso y devuelve la respuesta — ninguna regla de negocio vive acá."
          type: string
          example: trabajo
          enum:
            - trabajo
            - recepcion_caldo
            - evidencia_equipo
            - mezcla
            - sesion
            - condiciones
            - incidencia
            - recarga
            - cierre_trabajo
            - cierre_sesion
        uuid_cliente:
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000001
        solicitud_id:
          description: '`trabajo`: id de servidor de la solicitud de servicio (`id` de `servicios_asignados` del pull de catálogo).'
          type: integer
          example: 31
        trabajo_uuid_cliente:
          description: '`sesion`/`cierre_trabajo`/`recepcion_caldo`/`evidencia_equipo`/`mezcla`: `uuid_cliente` de apertura del trabajo — nunca el id de servidor, que puede no existir todavía si el trabajo llegó en este mismo lote.'
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000001
        sesion_uuid_cliente:
          description: '`cierre_sesion`/`condiciones`/`incidencia`: `uuid_cliente` de apertura de la sesión referenciada.'
          type: string
          example: a1b2c3d4-0000-4000-8000-000000000002
        secuencia:
          description: '`sesion`: orden de apertura. `recarga`: orden de la recarga dentro de la sesión.'
          type: integer
          example: 1
        piloto_id:
          description: '`sesion`: id de servidor de la persona (del pull de catálogo).'
          type: integer
          example: 5
        auxiliar_id:
          description: '`sesion`, opcional.'
          type: integer
          example: null
          nullable: true
        dron_id:
          description: '`sesion`, opcional (HU-07): id de servidor del dron (catálogo mínimo de `Operaciones`, sin pull de catálogo propio todavía).'
          type: integer
          example: null
          nullable: true
        hectareas_declaradas:
          description: 'DECIMAL como string (invariante 6). `0` si se omite.'
          type: string
          example: '0'
        hectarea_inicial_acumulada:
          description: '`sesion`, opcional (HU-07): acumulado de DJI al abrir la sesión, control de doble conteo (espec §5). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        inicio:
          type: string
          format: date-time
          example: '2026-09-01T10:00:00-04:00'
        fin:
          description: 'Requerido en `cierre_trabajo`/`cierre_sesion`.'
          type: string
          format: date-time
          example: null
          nullable: true
        litros:
          description: '`recepcion_caldo`: litros entregados por el cliente. DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        entregado_por:
          description: '`recepcion_caldo`: quién, del lado del cliente, entregó el caldo (espec §7.2).'
          type: string
          example: null
          nullable: true
        hora:
          description: '`recepcion_caldo`: cuándo se entregó. `mezcla`: cuándo se cargó el caldo. `incidencia`: cuándo ocurrió. `recarga`: cuándo ocurrió el ciclo de cambio de batería/recarga de caldo.'
          type: string
          format: date-time
          example: null
          nullable: true
        productos:
          description: '`mezcla`: lista de productos cargados en el caldo. Cada elemento trae `producto` (nombre de texto libre, transcripto del envase — sin catálogo previo que la app baje), `cantidad` (DECIMAL positivo como string, invariante 6) y `unidad` (`l`, `ml`, `kg` o `g`). No puede venir vacía: si algún elemento es inválido, se rechaza el registro `mezcla` completo.'
          type: array
          items:
            required:
              - producto
              - cantidad
              - unidad
            properties:
              producto:
                type: string
                example: 'Glifosato 48%'
              cantidad:
                type: string
                example: '2.50'
              unidad:
                type: string
                example: l
                enum:
                  - l
                  - ml
                  - kg
                  - g
            type: object
          nullable: true
        litros_consumidos:
          description: '`cierre_sesion`, opcional: litros de caldo efectivamente rociados en la sesión (espec §7.2). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        litros_sobrante:
          description: '`cierre_trabajo`, opcional: litros que quedaron sin aplicar al cerrar el trabajo (espec §7.2). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        evidencia_imagen_campo_uuid_cliente:
          description: '`cierre_trabajo`: REQUERIDO — `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: imagen_campo` (espec §9/§10, HU-09). Sin ella, referenciando una evidencia inexistente o de otro tipo, el cierre se rechaza ("sin captura no cierra").'
          type: string
          example: null
          nullable: true
        motivo_cierre:
          description: '`cierre_sesion`: catálogo espec §4.3.'
          type: string
          example: null
          nullable: true
          enum:
            - completado
            - relevo_piloto
            - cambio_dron
            - falla_equipo
            - clima
            - fin_jornada
            - otro
        momento:
          description: '`condiciones`: solo `inicio_sesion` — condiciones climáticas capturadas EN el momento de una incidencia es un concepto distinto del registro `incidencia` en sí (que vive en su propia tabla), fuera de alcance de este catálogo.'
          type: string
          example: null
          nullable: true
          enum:
            - inicio_sesion
        viento_kmh:
          description: '`condiciones`.'
          type: string
          example: '12.50'
        temperatura_c:
          description: '`condiciones`.'
          type: string
          example: '24.00'
        humedad_pct:
          description: '`condiciones`.'
          type: string
          example: '65.00'
        observacion_agronomo:
          description: '`condiciones`: obligatoria junto con `firma_observacion` cuando alguna medición cae fuera de los límites EFECTIVOS (los mismos que entrega `limites` del pull de catálogo — viento > 17 km/h, temperatura > 30°C, humedad > 90%; la humedad mínima solo si el sistema la fija) — sin ambas, el registro se rechaza.'
          type: string
          example: null
          nullable: true
        firma_observacion:
          description: '`condiciones`: sin evidencia real todavía (TE-07), texto plano.'
          type: string
          example: null
          nullable: true
        tipo_incidencia:
          description: '`incidencia`: catálogo espec §4.3. Campo separado de `tipo` (que en este objeto es el tipo de REGISTRO del lote) para evitar que ambos colisionen en la misma key.'
          type: string
          example: null
          nullable: true
          enum:
            - caldo
            - esc
            - bateria
            - mecanica
            - clima
            - otro
        descripcion:
          description: '`incidencia`, opcional: texto libre.'
          type: string
          example: null
          nullable: true
        evidencia_foto_uuid_cliente:
          description: '`incidencia`: REQUERIDO — `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_incidencia`. Sin ella, referenciando una evidencia inexistente, de otro tipo, o ya usada por otra incidencia, el registro se rechaza (HU-08: "con foto").'
          type: string
          example: null
          nullable: true
        litros_caldo:
          description: '`recarga`: litros de caldo cargados en ese ciclo. DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        bateria_saliente_id:
          description: '`recarga`: identificador de la batería que se retira (texto libre, sin catálogo de baterías en el esquema).'
          type: string
          example: null
          nullable: true
        temperatura_bateria_c:
          description: '`recarga`: temperatura medida de la batería saliente. > 50°C persiste con `alerta_temperatura = true`, sin rechazar el registro.'
          type: string
          example: null
          nullable: true
        motivo_retraso_caldo:
          description: '`recarga`, opcional: motivo del retraso o rechazo por calidad del caldo — solo se completa si hubo retraso, no en cada recarga.'
          type: string
          example: null
          nullable: true
          enum:
            - filtro_tapado
            - grumos
            - decantacion
            - espuma
            - color_olor_anormal
        hora_retraso:
          description: '`recarga`, opcional: cuándo ocurrió el retraso/rechazo por caldo.'
          type: string
          format: date-time
          example: null
          nullable: true
        litros_combustible_generador:
          description: '`recarga`, opcional: litros de combustible cargados al generador en ese ciclo. Informativo, sin costeo (Fase 3). DECIMAL como string.'
          type: string
          example: null
          nullable: true
        horas_vuelo_dron:
          description: '`evidencia_equipo`: horas de vuelo del dron declaradas por el auxiliar/piloto (no calculadas). DECIMAL como string (invariante 6).'
          type: string
          example: null
          nullable: true
        foto_control_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia ya subida por `POST /api/evidencias` con `tipo: foto_control`.'
          type: string
          example: null
          nullable: true
        foto_ciclo_bateria_balanceo_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia con `tipo: foto_ciclo_bateria_balanceo`.'
          type: string
          example: null
          nullable: true
        foto_dron_limpio_uuid_cliente:
          description: '`evidencia_equipo`, obligatorio: `uuid_cliente` de una evidencia con `tipo: foto_dron_limpio`.'
          type: string
          example: null
          nullable: true
      type: object
    ResultadoSync:

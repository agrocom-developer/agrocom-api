  /api/solicitudes:
    get:
      tags:
        - Solicitudes
      summary: 'Mis solicitudes e historial'
      description: 'Las solicitudes del cliente de la cuenta, de la más nueva a la más vieja. `vista=activas` deja las que siguen vivas; `vista=historial`, las que terminaron (`calificada`, `cancelada` o `expirada`). `estado` filtra por un estado exacto.'
      operationId: listarSolicitudes
      parameters:
        -
          name: vista
          in: query
          required: false
          schema:
            type: string
            enum:
              - activas
              - historial
        -
          name: estado
          in: query
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Página de solicitudes.'
          content:
            application/json:
              schema:
                required:
                  - solicitudes
                  - pagina
                  - paginas
                  - total
                properties:
                  solicitudes:
                    type: array
                    items:
                      $ref: '#/components/schemas/SolicitudServicio'
                  pagina:
                    type: integer
                    example: 1
                  paginas:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 4
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'La cuenta no tiene ficha de cliente.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Solicitudes
      summary: 'Crear una solicitud de servicio'
      description: 'Crea una solicitud en `borrador`, idempotente por `uuid_cliente`: reintentar el mismo uuid responde 200 con la solicitud ya creada (nunca una segunda). Las hectáreas no pueden superar las del terreno. `precio_ha_propuesto` (precio por hectárea que propone el cliente) puede venir acá o fijarse con `POST /api/solicitudes/{id}/precio` antes de publicar.'
      operationId: crearSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - uuid_cliente
                - terreno_id
                - tipo_aplicacion
                - hectareas_solicitadas
                - producto_indicado
                - ventana_desde
                - ventana_hasta
              properties:
                uuid_cliente:
                  type: string
                  format: uuid
                terreno_id:
                  type: integer
                  example: 12
                contacto_id:
                  description: 'Contacto de referencia (uno de `GET /api/clientes/mi/contactos`). Opcional: una empresa que no elige usa su contacto principal.'
                  type: integer
                  example: 7
                  nullable: true
                tipo_aplicacion:
                  type: string
                  enum:
                    - herbicida
                    - insecticida
                    - fungicida
                    - fertilizante_foliar
                    - desecante
                    - otro
                hectareas_solicitadas:
                  type: string
                  example: '80'
                cultivo:
                  type: string
                  nullable: true
                producto_indicado:
                  type: string
                  example: 'Glifosato 480 SL, 2 L/ha'
                aporta_producto:
                  type: string
                  nullable: true
                  enum:
                    - cliente
                    - proveedor
                ventana_desde:
                  description: 'Fecha deseada: inicio de la ventana.'
                  type: string
                  format: date
                ventana_hasta:
                  description: 'Fecha deseada: fin de la ventana.'
                  type: string
                  format: date
                urgente:
                  type: boolean
                  nullable: true
                observaciones:
                  type: string
                  nullable: true
                precio_ha_propuesto:
                  type: string
                  example: '125'
                  nullable: true
              type: object
      responses:
        201:
          description: 'Solicitud creada en `borrador`.'
          content:
            application/json:
              schema:
                required:
                  - solicitud
                properties:
                  solicitud:
                    $ref: '#/components/schemas/SolicitudServicio'
                type: object
        200:
          description: 'Reintento: el `uuid_cliente` ya estaba creado; devuelve esa misma solicitud.'
          content:
            application/json:
              schema:
                required:
                  - solicitud
                properties:
                  solicitud:
                    $ref: '#/components/schemas/SolicitudServicio'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'El terreno no existe o es de otro cliente.'
        422:
          description: 'Datos inválidos, contacto que no es del cliente, empresa sin contactos, hectáreas mayores a las del terreno o cliente suspendido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []

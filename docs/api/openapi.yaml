          description: 'Congelado al publicar.'
          type: string
          example: '10560.00'
          nullable: true
        monto_final:
          type: string
          nullable: true
        estado:
          type: string
          enum:
            - borrador
            - publicada
            - en_asignacion
            - sin_proveedor
            - asignada
            - en_camino
            - en_ejecucion
            - suspendida_por_clima
            - ejecutada
            - en_disputa
            - completada
            - cancelada
        proveedor_id:
          type: integer
          nullable: true
        publicada_en:
          type: string
          format: date-time
          nullable: true
        motivo_cancelacion:
          type: string
          nullable: true
        cancelada_por:
          type: string
          nullable: true
          enum:
            - cliente
            - proveedor
            - administrador
            - sistema
        terreno:
          $ref: '#/components/schemas/Terreno'
        historial:
          type: array
          items:
            $ref: '#/components/schemas/HistorialSolicitud'
      type: object
    HistorialSolicitud:
      title: 'Paso del historial de una solicitud'
      description: 'Cada transición deja una fila inmutable con quién, por qué y cuándo (ADR 0027, punto 4).'
      required:
        - estado_nuevo
        - origen
        - creado_en
      properties:
        estado_anterior:
          type: string
          nullable: true
        estado_nuevo:
          type: string
        origen:
          type: string
          enum:
            - cliente
            - proveedor
            - administrador
            - sistema
        motivo:
          type: string
          nullable: true
        creado_en:
          type: string
          format: date-time
      type: object
    Terreno:
      title: Terreno
      description: 'Terreno de un cliente sobre el que pide servicios (especificación §4.1). Hectáreas como decimal exacto en string.'
      required:
        - id
        - nombre
        - hectareas
        - acceso_dificil
      properties:
        id:
          type: integer
          example: 12
        nombre:
          type: string
          example: 'Lote Norte'
        hectareas:
          type: string
          example: '120.5000'
        cultivo:
          type: string
          example: Soya
          nullable: true
        geometria:
          description: 'Polígono GeoJSON del terreno.'
          type: object
          nullable: true
        referencias_acceso:
          type: string
          nullable: true
        colindantes_sensibles:
          description: 'Apiarios, cultivos orgánicos, viviendas.'
          type: string
          nullable: true
        acceso_dificil:
          type: boolean
          example: false
        zona_id:
          type: integer
          example: 1
          nullable: true
      type: object
  securitySchemes:
    tokenDispositivo:
      type: http
      description: 'Token por dispositivo emitido por `POST /api/auth/token` (HU-03). Se envía como `Authorization: Bearer {token}`. Caduca a los `SANCTUM_EXPIRATION` minutos de emitido (30 días por defecto), o antes si se lo revoca desde el panel o si la cuenta o el rol con el que se emitió dejan de estar vigentes.'
      scheme: bearer
tags:
  -
    name: Ofertas
    description: 'El proveedor ve las ofertas que le hace el motor de asignación y las acepta o rechaza (ADR 0030). Requiere red.'
  -
    name: Distribucion
    description: 'Versionado y distribución del APK de agrocom-field (HU-20).'
  -
    name: Notificaciones
    description: 'Avisos in-app de la cuenta (ADR 0025): el panel los ve en la campana; las apps, por esta API.'
  -
    name: Operaciones
    description: 'Trabajos, sesiones, condiciones, recepción de caldo, evidencias, actas y reportes técnicos.'
  -
    name: Proveedores
    description: 'Registro, personal, documentos y reenvío a revisión de proveedores del marketplace (ADR 0028, 0032).'
  -
    name: Seguridad
    description: 'Sesión de la app de campo por token de dispositivo (espec §4.6, HU-03).'
  -
    name: Sincronizacion
    description: 'Push de escritura offline de la app de campo (espec §2.1, puntos 3 a 5; TE-05). Recorte de alcance de la tarea 09: solo `trabajo` y `sesion` — `incidencia` (tarea 22), `recarga` (tarea 23) y `mezcla` (HU-78, tarea 94, revierte CR-01 del 1/9/2026) se sumaron después como tipos de registro de este mismo endpoint; `acta` tiene sus propios endpoints (`ActaController`), fuera de este push (ver docs/gestion/cola_tareas.md).'
  -
    name: Clientes
    description: 'Registro y perfil del cliente del marketplace, que solicita el servicio y califica al proveedor (ADR 0027).'
  -
    name: Solicitudes
    description: 'El cliente pide, consulta, publica y cancela servicios de fumigación (ADR 0027). Sin cobro en la app en la versión 1.'
  -
    name: Terrenos
    description: 'Terrenos que el cliente registra una vez y reutiliza en cada solicitud de servicio (ADR 0027).'
  -
    name: Flota
    description: Flota

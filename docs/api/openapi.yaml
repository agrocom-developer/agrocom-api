                properties:
                  cliente:
                    $ref: '#/components/schemas/Cliente'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'La cuenta no tiene ficha de cliente.'
      security:
        -
          tokenDispositivo: []
  /api/solicitudes:
    get:
      tags:
        - Solicitudes
      summary: 'Mis solicitudes e historial'
      description: 'Las solicitudes del cliente de la cuenta, de la más nueva a la más vieja. `vista=activas` deja las que siguen vivas; `vista=historial`, las que terminaron (`completada` o `cancelada`). `estado` filtra por un estado exacto.'
      operationId: listarSolicitudes
      parameters:

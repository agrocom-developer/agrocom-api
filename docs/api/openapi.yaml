                    $ref: '#/components/schemas/Oferta'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol no oferta o el proveedor no está habilitado.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConflicto'
        404:
          description: 'La solicitud no existe o la cuenta no es de un proveedor.'
        409:
          description: 'La solicitud ya no está abierta, o ya hay una negociación vigente o cerrada con este proveedor.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorConflicto'
        422:

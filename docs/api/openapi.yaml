openapi: 3.0.0
info:
  title: 'Agrocom API'
  description: 'API del Sistema de Gestión de Operaciones de Fumigación de Agrocom SRL. Sirve a las apps de campo (`agrocom-field`) y al portal del cliente; el spec generado desde el código es el contrato de la API (ADR 0014). Dinero y hectáreas viajan como string decimal, nunca como número de punto flotante.'
  version: 0.1.0
servers:
  -
    url: /
    description: 'Servidor actual — la URL base la define el entorno (local, staging, producción).'
paths:
  /api/ordenes:
    get:
      tags:
        - Operaciones
      summary: 'Lista las órdenes de aplicación con filtros'
      description: 'Listado paginado de órdenes de aplicación para la app de campo (espec §8). Exige el token del dispositivo desde HU-03: dejó de ser público. Todos los filtros se combinan por AND; si `vigentes` y `estado` se contradicen, el resultado es vacío — no hay prevalencia silenciosa entre filtros. Las órdenes borradas lógicamente nunca aparecen.'
      operationId: listarOrdenes
      parameters:
        -
          name: estado
          in: query
          description: 'Filtra por estado de la orden.'
          required: false
          schema:
            type: string
            enum:
              - emitida
              - vigente
              - consumida
              - vencida
        -
          name: lote_id
          in: query
          description: 'Filtra por lote (ID del módulo Comercial).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: contrato_id
          in: query
          description: 'Filtra por contrato (ID del módulo Comercial).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: nro_aplicacion
          in: query
          description: 'Filtra por número de aplicación dentro del contrato (1..n).'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: vigentes
          in: query
          description: 'Con valor verdadero devuelve solo las órdenes vigentes (atajo para la app del piloto; equivale a `estado=vigente`).'
          required: false
          schema:
            type: boolean
            default: false
        -
          name: per_page
          in: query
          description: 'Registros por página.'
          required: false
          schema:
            type: integer
            default: 15
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Número de página.'
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Listado paginado de órdenes, ordenado por fecha de emisión descendente.'
          content:
            application/json:
              schema:
                required:
                  - data
                  - links
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrdenAplicacion'
                  links:
                    $ref: '#/components/schemas/PaginacionLinks'
                  meta:
                    $ref: '#/components/schemas/PaginacionMeta'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        422:
          description: 'Algún filtro no pasó la validación (estado desconocido, per_page fuera de 1..100, etc.).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
  /api/dispositivos:
    get:
      tags:
        - Seguridad
      summary: 'Lista los dispositivos del operario autenticado'
      description: 'Dispositivos donde el operario autenticado tiene sesión abierta. Solo los suyos: no existe forma de listar los de otro usuario desde la app de campo.'
      operationId: listarDispositivosPropios
      responses:
        200:
          description: 'Dispositivos con sesión viva, el usado más recientemente primero.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  '/api/dispositivos/{id}':
    get:
      tags:
        - Seguridad
      summary: 'Muestra un dispositivo del operario autenticado'
      description: 'Un dispositivo del operario autenticado. Un id que no le pertenece devuelve 404 y no 403: un 403 confirmaría que ese dispositivo existe.'
      operationId: verDispositivoPropio
      parameters:
        -
          name: id
          in: path
          description: 'Identificador del dispositivo.'
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'El dispositivo pedido.'
          content:
            application/json:
              schema:
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
        404:
          description: 'No existe, o es de otro usuario — indistinguibles a propósito.'
      security:
        -
          tokenDispositivo: []
  /api/auth/token:
    post:
      tags:
        - Seguridad
      summary: 'Emite el token de un dispositivo de campo'
      description: 'Autentica al operario y emite el token con el que ese dispositivo opera sin volver a loguearse. El token no caduca por tiempo (sesión persistente offline): deja de valer cuando se lo revoca desde el panel. Reintentar desde el mismo `uuid_dispositivo` revoca el token anterior y emite uno nuevo — nunca acumula credenciales vivas. El valor en claro se devuelve UNA sola vez.'
      operationId: emitirTokenDispositivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - username
                - password
                - uuid_dispositivo
              properties:
                username:
                  description: 'Login del operario (nunca un correo).'
                  type: string
                  example: camila.rojas
                password:
                  type: string
                  format: password
                  example: password
                uuid_dispositivo:
                  description: 'UUID generado en el dispositivo.'
                  type: string
                  format: uuid
                  example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
                nombre_dispositivo:
                  description: 'Nombre legible del equipo, para que el panel sepa cuál revoca.'
                  type: string
                  example: 'Moto G84 — piloto 2'
                  nullable: true
                role_id:
                  description: 'Rol con el que se quiere operar. Opcional si el usuario tiene un único rol vivo.'
                  type: integer
                  example: 1
                  nullable: true
              type: object
      responses:
        201:
          description: 'Token emitido. `token` es el único momento en que la credencial existe en claro.'
          content:
            application/json:
              schema:
                required:
                  - token
                  - token_type
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  token:
                    description: 'Credencial completa, para el header `Authorization: Bearer`.'
                    type: string
                    example: 12|aB3cD4...
                  token_type:
                    type: string
                    example: Bearer
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        403:
          description: 'El `role_id` pedido no está entre los roles vivos del usuario.'
        409:
          description: 'El usuario tiene más de un rol vivo (o ninguno) y no indicó `role_id`: hay que elegir con cuál entra. Mismo contrato que el 409 del panel.'
          content:
            application/json:
              schema:
                required:
                  - message
                  - roles
                properties:
                  message:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RolActivo'
                type: object
        422:
          description: 'Credenciales incorrectas, cuenta deshabilitada, o payload inválido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
    delete:
      tags:
        - Seguridad
      summary: 'Cierra la sesión del dispositivo actual'
      description: 'Cierra la sesión de ESTE dispositivo revocando el token con el que se hizo el request. Un dispositivo nunca puede cerrar la sesión de otro: para eso está la pantalla de revocación del panel.'
      operationId: cerrarSesionCampo
      responses:
        204:
          description: 'Sesión cerrada; el token deja de valer de inmediato.'
        401:
          description: 'Token ausente o ya revocado.'
      security:
        -
          tokenDispositivo: []
  /api/auth/sesion:
    get:
      tags:
        - Seguridad
      summary: 'Datos de la sesión del dispositivo'
      description: 'Quién es el operario, con qué rol opera y desde qué dispositivo. La app la consulta al reconectarse para saber si su token sigue vigente: un token revocado, una cuenta deshabilitada o un rol que le sacaron devuelven 401 acá.'
      operationId: verSesionCampo
      responses:
        200:
          description: 'Sesión vigente.'
          content:
            application/json:
              schema:
                required:
                  - usuario
                  - rol
                  - dispositivo
                properties:
                  usuario:
                    $ref: '#/components/schemas/UsuarioCampo'
                  rol:
                    $ref: '#/components/schemas/RolActivo'
                  dispositivo:
                    $ref: '#/components/schemas/Dispositivo'
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
  /api/sync/catalogo:
    get:
      tags:
        - Sincronizacion
      summary: 'Pull de catálogo con cursor (órdenes, lotes, personas)'
      description: 'Baja el catálogo de órdenes vigentes, lotes y personas modificados desde la posición del cursor recibido, con paginación por cursor (`updated_at`, `id`) — nunca por número de página, para no perder ni repetir registros entre pulls. `desde` vacío o ausente trae todo lo vigente (primera sincronización). Un `desde` no decodificable se trata igual que vacío, nunca como error de validación.'
      operationId: obtenerCatalogoSincronizacion
      parameters:
        -
          name: desde
          in: query
          description: 'Cursor opaco devuelto por el pull anterior. Ausente o vacío en la primera sincronización.'
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Catálogo modificado desde el cursor, y el cursor de continuación para el próximo pull.'
          content:
            application/json:
              schema:
                required:
                  - ordenes
                  - lotes
                  - personas
                  - cursor
                properties:
                  ordenes:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrdenCatalogo'
                  lotes:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoteCatalogo'
                  personas:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonaCatalogo'
                  cursor:
                    description: 'Cursor opaco a reenviar tal cual en `desde` en el próximo pull.'
                    type: string
                type: object
        401:
          description: 'Token ausente, revocado o ya sin rol válido.'
      security:
        -
          tokenDispositivo: []
components:
  schemas:
    PaginacionLinks:
      title: 'Links de paginación'
      description: 'Links de navegación de la respuesta paginada estándar de Laravel.'
      required:
        - first
        - last
        - prev
        - next
      properties:
        first:
          description: 'URL de la primera página.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=1'
        last:
          description: 'URL de la última página.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=3'
        prev:
          description: 'URL de la página anterior; null en la primera.'
          type: string
          example: null
          nullable: true
        next:
          description: 'URL de la página siguiente; null en la última.'
          type: string
          example: 'http://localhost:8000/api/ordenes?page=2'
          nullable: true
      type: object
    PaginacionMeta:
      title: 'Metadatos de paginación'
      description: 'Metadatos de la respuesta paginada estándar de Laravel.'
      required:
        - current_page
        - from
        - last_page
        - links
        - path
        - per_page
        - to
        - total
      properties:
        current_page:
          description: 'Página actual.'
          type: integer
          example: 1
        from:
          description: 'Posición del primer registro de la página; null si está vacía.'
          type: integer
          example: 1
          nullable: true
        last_page:
          description: 'Última página disponible.'
          type: integer
          example: 3
        links:
          description: 'Elementos del paginador para renderizar la navegación.'
          type: array
          items:
            required:
              - url
              - label
              - page
              - active
            properties:
              url:
                type: string
                example: 'http://localhost:8000/api/ordenes?page=1'
                nullable: true
              label:
                type: string
                example: '1'
              page:
                type: integer
                example: 1
                nullable: true
              active:
                type: boolean
                example: true
            type: object
        path:
          description: 'URL base del listado, sin query string.'
          type: string
          example: 'http://localhost:8000/api/ordenes'
          nullable: true
        per_page:
          description: 'Registros por página.'
          type: integer
          example: 15
        to:
          description: 'Posición del último registro de la página; null si está vacía.'
          type: integer
          example: 15
          nullable: true
        total:
          description: 'Total de registros que matchean los filtros.'
          type: integer
          example: 42
      type: object
    ErrorValidacion:
      title: 'Error de validación'
      description: 'Respuesta 422 estándar de Laravel: un mensaje general y los mensajes por campo.'
      required:
        - message
        - errors
      properties:
        message:
          description: 'Mensaje general del primer error.'
          type: string
          example: 'El valor seleccionado para estado no es válido.'
        errors:
          description: 'Mensajes de validación agrupados por campo.'
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    OrdenAplicacion:
      title: 'Orden de aplicación'
      description: 'Orden de aplicación emitida por el cliente para un lote (espec §4.3). Los valores DECIMAL (dosis, límites climáticos y de vuelo) viajan como string. Los límites en null heredan del contrato o del parámetro por defecto del sistema (RF-60).'
      required:
        - id
        - contrato_id
        - lote_id
        - nro_aplicacion
        - litros_ha
        - humedad_min_pct
        - viento_max_kmh
        - temperatura_max_c
        - humedad_max_pct
        - velocidad_max_kmh
        - altura_vuelo_m
        - velocidad_vuelo_kmh
        - ancho_pasada_m
        - observaciones
        - emitida_por_contacto_id
        - fecha_emision
        - estado
        - created_at
        - updated_at
      properties:
        id:
          description: 'Identificador de la orden.'
          type: integer
          example: 1
        contrato_id:
          description: 'Contrato al que pertenece la orden (módulo Comercial, solo ID).'
          type: integer
          example: 1
        lote_id:
          description: 'Lote sobre el que se aplica (módulo Comercial, solo ID).'
          type: integer
          example: 3
        nro_aplicacion:
          description: 'Número de aplicación dentro del contrato (1..n).'
          type: integer
          example: 1
        litros_ha:
          description: 'Dosis en litros por hectárea. DECIMAL como string.'
          type: string
          example: '10.00'
        humedad_min_pct:
          description: 'Humedad relativa mínima para aplicar (%). DECIMAL como string; null hereda.'
          type: string
          example: '60.00'
          nullable: true
        viento_max_kmh:
          description: 'Viento máximo para aplicar (km/h). DECIMAL como string; null hereda.'
          type: string
          example: '15.00'
          nullable: true
        temperatura_max_c:
          description: 'Temperatura máxima para aplicar (°C). DECIMAL como string; null hereda.'
          type: string
          example: '32.00'
          nullable: true
        humedad_max_pct:
          description: 'Humedad relativa máxima para aplicar (%). DECIMAL como string; null hereda.'
          type: string
          example: '90.00'
          nullable: true
        velocidad_max_kmh:
          description: 'Velocidad máxima del equipo (km/h). DECIMAL como string; null hereda.'
          type: string
          example: '25.00'
          nullable: true
        altura_vuelo_m:
          description: 'Altura de vuelo indicada (m). DECIMAL como string; null hereda.'
          type: string
          example: '3.00'
          nullable: true
        velocidad_vuelo_kmh:
          description: 'Velocidad de vuelo indicada (km/h). DECIMAL como string; null hereda.'
          type: string
          example: '18.00'
          nullable: true
        ancho_pasada_m:
          description: 'Ancho de pasada indicado (m). DECIMAL como string; null hereda.'
          type: string
          example: '7.00'
          nullable: true
        observaciones:
          description: 'Observaciones libres del emisor.'
          type: string
          example: 'Aplicar en horas de la mañana.'
          nullable: true
        emitida_por_contacto_id:
          description: 'Contacto del cliente que emitió la orden (módulo Comercial, solo ID).'
          type: integer
          example: 2
          nullable: true
        fecha_emision:
          description: 'Fecha de emisión de la orden.'
          type: string
          format: date
          example: '2026-08-26'
        estado:
          description: 'Estado de la orden (espec §5: emitida → vigente → consumida | vencida).'
          type: string
          enum:
            - emitida
            - vigente
            - consumida
            - vencida
        created_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
          nullable: true
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
          nullable: true
      type: object
    Dispositivo:
      title: 'Dispositivo con sesión'
      description: 'Dispositivo de campo con una sesión viva (HU-03). El token en sí nunca se devuelve.'
      required:
        - id
        - uuid_dispositivo
        - nombre_dispositivo
        - rol
        - last_used_at
        - created_at
      properties:
        id:
          description: 'Identificador del token de dispositivo.'
          type: integer
          example: 1
        uuid_dispositivo:
          description: 'UUID generado por el dispositivo.'
          type: string
          format: uuid
          example: 6f1d0a2e-1f34-4c9f-9a8b-2b7c1d5e0f31
        nombre_dispositivo:
          description: 'Nombre legible informado por la app.'
          type: string
          example: 'Moto G84 — piloto 2'
          nullable: true
        rol:
          $ref: '#/components/schemas/RolActivo'
        last_used_at:
          description: 'Último request autenticado con este token.'
          type: string
          format: date-time
          nullable: true
        created_at:
          description: 'Cuándo se emitió el token.'
          type: string
          format: date-time
      type: object
    RolActivo:
      title: Rol
      description: 'Rol bajo el que opera una sesión de la app de campo.'
      required:
        - id
        - name
        - description
      properties:
        id:
          description: "Rol tal como lo ve la app de campo. Es el rol ÚNICO bajo el que opera la\nsesión —del token o del selector—, nunca una lista de permisos efectivos\n(invariante 10 de CLAUDE.md): los permisos se resuelven en el servidor\ncontra la base en cada request, no se le entregan a la app para que decida\nsola."
          type: integer
          example: 1
        name:
          description: 'Nombre interno del rol.'
          type: string
          example: piloto
        description:
          description: 'Descripción legible del rol.'
          type: string
          example: 'Piloto de dron: ejecuta sesiones de vuelo en campo.'
          nullable: true
      type: object
    UsuarioCampo:
      title: 'Usuario de campo'
      description: 'Cuenta con la que opera la app de campo.'
      required:
        - id
        - name
        - username
        - persona_id
      properties:
        id:
          description: "Identidad del operario tal como la necesita la app de campo: lo justo para\nsaludarlo y para saber a qué persona operativa corresponde.\n\n`persona_id` viaja como ID pelado (ADR 0003, regla 3): el detalle de la\npersona pertenece al módulo `Personal` y la app lo resuelve desde su\ncatálogo sincronizado, no anidado acá."
          type: integer
          example: 7
        name:
          description: 'Nombre para mostrar.'
          type: string
          example: 'Camila Rojas'
        username:
          description: 'Identificador de login (nunca un correo).'
          type: string
          example: camila.rojas
        persona_id:
          description: 'Persona operativa enlazada (módulo Personal, solo ID).'
          type: integer
          example: 3
          nullable: true
      type: object
    OrdenCatalogo:
      title: 'Orden de aplicación (catálogo)'
      description: 'Orden vigente para el pull de catálogo (espec §4.3). Los DECIMAL viajan como string (invariante 6).'
      required:
        - id
        - contrato_id
        - lote_id
        - nro_aplicacion
        - litros_ha
        - humedad_min_pct
        - viento_max_kmh
        - temperatura_max_c
        - humedad_max_pct
        - velocidad_max_kmh
        - altura_vuelo_m
        - velocidad_vuelo_kmh
        - ancho_pasada_m
        - observaciones
        - emitida_por_contacto_id
        - fecha_emision
        - estado
        - updated_at
      properties:
        id:
          description: "Adaptador delgado (ADR 0008): valida la query string, invoca el caso de\nuso y devuelve la respuesta — ninguna regla de negocio vive acá."
          type: integer
          example: 1
        contrato_id:
          type: integer
          example: 1
        lote_id:
          type: integer
          example: 3
        nro_aplicacion:
          type: integer
          example: 1
        litros_ha:
          type: string
          example: '10.00'
        humedad_min_pct:
          type: string
          example: '60.00'
          nullable: true
        viento_max_kmh:
          type: string
          example: '15.00'
          nullable: true
        temperatura_max_c:
          type: string
          example: '32.00'
          nullable: true
        humedad_max_pct:
          type: string
          example: '90.00'
          nullable: true
        velocidad_max_kmh:
          type: string
          example: '25.00'
          nullable: true
        altura_vuelo_m:
          type: string
          example: '3.00'
          nullable: true
        velocidad_vuelo_kmh:
          type: string
          example: '18.00'
          nullable: true
        ancho_pasada_m:
          type: string
          example: '7.00'
          nullable: true
        observaciones:
          type: string
          example: 'Aplicar en horas de la mañana.'
          nullable: true
        emitida_por_contacto_id:
          type: integer
          example: 2
          nullable: true
        fecha_emision:
          type: string
          format: date
          example: '2026-08-26'
        estado:
          type: string
          example: vigente
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
      type: object
    LoteCatalogo:
      title: 'Lote (catálogo)'
      description: 'Lote vigente (no borrado) para el pull de catálogo (espec §4.1). `hectareas` es DECIMAL como string (invariante 6).'
      required:
        - id
        - campo_id
        - codigo
        - hectareas
        - geometria
        - restricciones
        - updated_at
      properties:
        id:
          type: integer
          example: 3
        campo_id:
          type: integer
          example: 1
        codigo:
          type: string
          example: L-01
        hectareas:
          type: string
          example: '120.50'
        geometria:
          description: 'GeoJSON del lote, o null si no está cargado.'
          type: object
          nullable: true
        restricciones:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
      type: object
    PersonaCatalogo:
      title: 'Persona operativa (catálogo)'
      description: 'Persona vigente (no borrada) para el pull de catálogo (espec §4.2).'
      required:
        - id
        - nombre
        - rol
        - base_id
        - activo
        - updated_at
      properties:
        id:
          type: integer
          example: 5
        nombre:
          type: string
          example: 'Piloto Uno'
        rol:
          type: string
          example: piloto
        base_id:
          type: integer
          example: 1
          nullable: true
        activo:
          type: boolean
          example: true
        updated_at:
          type: string
          format: date-time
          example: '2026-08-26T12:00:00+00:00'
      type: object
  securitySchemes:
    tokenDispositivo:
      type: http
      description: 'Token por dispositivo emitido por `POST /api/auth/token` (HU-03). Se envía como `Authorization: Bearer {token}`. No caduca por tiempo: vale hasta que se lo revoque desde el panel, o hasta que la cuenta o el rol con el que se emitió dejen de estar vigentes.'
      scheme: bearer

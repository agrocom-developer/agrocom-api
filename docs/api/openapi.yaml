      operationId: quitarFotoDePerfil
      responses:
        204:
          description: 'Sin foto de perfil.'
        401:
          description: 'Token ausente o revocado.'
      security:
        -
          tokenDispositivo: []
  '/api/personas/{usuario}/foto':
    get:
      tags:
        - Seguridad
      summary: 'Descargar una foto de perfil'
      description: 'La imagen de perfil de una cuenta. No lleva token: la URL es firmada y de corta vida (15 minutos), y solo la entregan la propia sesión y la tarjeta del proveedor que ve el cliente al comparar ofertas. Una firma inválida o vencida responde 403.'
      operationId: descargarFotoDePerfil
      parameters:
        -
          name: usuario
          in: path
          required: true
          schema:
            type: integer
        -
          name: expires

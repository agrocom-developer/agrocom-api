              - activas
              - historial
        -
          name: estado
          in: query
          required: false
          schema:
            type: string
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: 'Página de solicitudes.'
          content:
            application/json:
              schema:
                required:
                  - solicitudes
                  - pagina
                  - paginas
                  - total
                properties:
                  solicitudes:
                    type: array
                    items:
                      $ref: '#/components/schemas/SolicitudServicio'
                  pagina:
                    type: integer
                    example: 1
                  paginas:
                    type: integer
                    example: 1
                  total:
                    type: integer
                    example: 4
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'La cuenta no tiene ficha de cliente.'
      security:
        -
          tokenDispositivo: []
    post:
      tags:
        - Solicitudes
      summary: 'Crear una solicitud de servicio'
      description: 'Crea una solicitud en `borrador`, idempotente por `uuid_cliente`: reintentar el mismo uuid responde 200 con la solicitud ya creada (nunca una segunda). Las hectáreas no pueden superar las del terreno. La tarifa se calcula y se congela al publicar.'
      operationId: crearSolicitud
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - uuid_cliente
                - terreno_id
                - tipo_aplicacion
                - hectareas_solicitadas
                - producto_indicado
                - ventana_desde
                - ventana_hasta
              properties:
                uuid_cliente:
                  type: string
                  format: uuid
                terreno_id:
                  type: integer
                  example: 12
                tipo_aplicacion:
                  type: string
                  enum:
                    - herbicida
                    - insecticida
                    - fungicida
                    - fertilizante_foliar
                    - desecante
                    - otro
                hectareas_solicitadas:
                  type: string
                  example: '80'
                cultivo:
                  type: string
                  nullable: true
                producto_indicado:
                  type: string
                  example: 'Glifosato 480 SL, 2 L/ha'
                aporta_producto:
                  type: string
                  nullable: true
                  enum:
                    - cliente
                    - proveedor
                ventana_desde:
                  description: 'Fecha deseada: inicio de la ventana.'
                  type: string
                  format: date
                ventana_hasta:
                  description: 'Fecha deseada: fin de la ventana.'
                  type: string
                  format: date
                urgente:
                  type: boolean
                  nullable: true
                observaciones:
                  type: string
                  nullable: true
              type: object
      responses:
        201:
          description: 'Solicitud creada en `borrador`.'
          content:
            application/json:
              schema:
                required:
                  - solicitud
                properties:
                  solicitud:
                    $ref: '#/components/schemas/SolicitudServicio'
                type: object
        200:
          description: 'Reintento: el `uuid_cliente` ya estaba creado; devuelve esa misma solicitud.'
          content:
            application/json:
              schema:
                required:
                  - solicitud
                properties:
                  solicitud:
                    $ref: '#/components/schemas/SolicitudServicio'
                type: object
        401:
          description: 'Token ausente o revocado.'
        403:
          description: 'El rol del token no es de cliente.'
        404:
          description: 'El terreno no existe o es de otro cliente.'
        422:
          description: 'Datos inválidos, hectáreas mayores a las del terreno o cliente suspendido.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []

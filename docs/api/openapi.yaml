        401:
          description: 'Token ausente o revocado.'
        422:
          description: 'Archivo inválido o de 300 KB o más.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
      security:
        -
          tokenDispositivo: []
    delete:
      tags:
        - Seguridad
      summary: 'Quitar mi foto de perfil'

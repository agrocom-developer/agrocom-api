# Nginx: reverse proxy hacia PHP-FPM.
# (docs/decisiones/0017-despliegue-proxmox-lxc-self-hosted-runner.md)
#
# Escucha en puerto 80, proxea todas las peticiones a PHP-FPM (port 9000),
# sirve archivos estáticos directamente (public/ y public/build/).

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    root /var/www/html/public;

    # Assets compilados por Vite y otros estáticos se sirven directamente sin pasar por FPM.
    location ~* ^/(build|css|js|images|fonts)/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.php es el punto de entrada de Laravel.
    index index.php;

    # Toda petición que no sea un archivo o carpeta existente se redirige a index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesa archivos .php con PHP-FPM.
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Rechaza acceso a archivos sensibles.
    location ~ /\. {
        deny all;
    }
}

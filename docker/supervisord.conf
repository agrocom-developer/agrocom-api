# supervisord: controla PHP-FPM y Nginx dentro del contenedor.
# (docs/decisiones/0017-despliegue-proxmox-lxc-self-hosted-runner.md)
#
# Corre en foreground (nodaemon=true) para que Docker pueda capturar logs en stdout.

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# PHP-FPM ya está en la imagen base; supervisord lo monitorea para que reinicie si cae.
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile=/var/log/supervisor/php-fpm.out.log

# Nginx proxy inverso hacia PHP-FPM.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile=/var/log/supervisor/nginx.out.log

; Margen sobre el tope de subida del logo (`max:20480` = 20 MB, ver ADR 0019 y
; los Form Requests de `logo` — 15/9/2026: cámaras modernas superan los 2 MB
; que regía antes; ahora el servidor optimiza la imagen en vez de rechazarla,
; pero igual hace falta un tope técnico de subida). Con margen, el único que
; corta con un mensaje específico es Laravel — PHP nunca corta antes.
upload_max_filesize = 25M
post_max_size = 30M

; El default (128M) no alcanza para decodificar en memoria una foto de
; celular de hoy: GD guarda el bitmap sin comprimir mientras trabaja (una
; foto de 48 MP, 8000x6000, ya pesa ~183 MB solo el bitmap crudo, antes de
; redimensionar). Sin este margen, `OptimizarImagenSubida` revienta con un
; 500 ("Allowed memory size exhausted") en vez de optimizar la imagen —
; verificado con GD directamente en este contenedor (15/9/2026).
memory_limit = 512M
